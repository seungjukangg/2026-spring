<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOT TWIST | 프리미엄 금융 문해력 & 자산 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --surface: #111113;
            --primary: #ffffff;
            --accent: #3b82f6; /* 금융을 상징하는 하이엔드 블루 */
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 60%);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* 내비게이션 */
        .navbar { padding: 30px 40px; display: flex; justify-content: center; background: rgba(3,3,5,0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .navbar h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; }
        .navbar h1 span { color: var(--accent); }

        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        /* 진행 바 */
        .progress-container { width: 100%; height: 2px; background: var(--border); margin-bottom: 50px; position: relative; display: none; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 15px var(--accent); }

        /* 공통 뷰 컨테이너 */
        .view-section { display: none; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .view-section.active { display: block; }

        /* 헤더 텍스트 */
        .badge-text { font-size: 0.85rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        .main-title { font-size: 2.5rem; font-weight: 900; line-height: 1.3; margin-bottom: 40px; word-break: keep-all; }
        .sub-title { font-size: 1.1rem; color: var(--text-sub); margin-bottom: 40px; font-weight: 300; }

        /* 버튼 옵션 */
        .options { display: flex; flex-direction: column; gap: 16px; }
        .btn-opt {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text-main);
            padding: 24px 32px; border-radius: 20px; font-size: 1.15rem; font-weight: 500; text-align: left;
            cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px);
        }
        .btn-opt:hover { background: rgba(59, 130, 246, 0.08); border-color: var(--accent); transform: translateX(10px); }

        /* HTML/CSS로 구현한 재무제표 시각화 테이블 */
        .finance-panel {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;
        }
        .finance-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px;
            text-align: center; transition: 0.3s; cursor: pointer;
        }
        .finance-card:hover { border-color: var(--accent); box-shadow: 0 10px 30px var(--accent-glow); transform: translateY(-5px); }
        .f-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 20px; color: var(--primary); }
        .f-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .f-row:last-child { border-bottom: none; }
        .f-label { color: var(--text-sub); font-weight: 600; }
        .f-val { font-weight: 900; font-family: monospace; font-size: 1.1rem; }
        .f-val.good { color: #22c55e; }
        .f-val.bad { color: #ef4444; }

        /* 결과 화면 */
        .res-box { text-align: center; margin-bottom: 60px; }
        .res-type { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        .res-name { font-size: 3.5rem; font-weight: 900; margin-bottom: 25px; line-height: 1.2; }
        .res-desc { font-size: 1.15rem; color: var(--text-sub); line-height: 1.7; max-width: 700px; margin: 0 auto; font-weight: 300; }

        .curation-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; text-align: left; }
        .c-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 35px; }
        .c-icon { font-size: 2rem; margin-bottom: 20px; }
        .c-header { font-size: 1.4rem; font-weight: 900; margin-bottom: 25px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        .c-item { margin-bottom: 20px; }
        .c-item h4 { font-size: 1.1rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
        .c-item p { font-size: 0.95rem; color: var(--text-sub); line-height: 1.6; }

        .btn-restart { display: block; width: 100%; padding: 22px; margin-top: 60px; background: var(--primary); color: var(--bg); font-size: 1.2rem; font-weight: 900; text-align: center; border-radius: 16px; text-decoration: none; transition: 0.3s; }
        .btn-restart:hover { background: var(--text-sub); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .main-title { font-size: 1.8rem; }
            .finance-panel { grid-template-columns: 1fr; }
            .res-name { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>PLOT<span>TWIST</span> FINANCE</h1>
    </nav>

    <div class="container">
        
        <div id="viewOnboarding" class="view-section active">
            <span class="badge-text">ONBOARDING</span>
            <h1 class="main-title">현재 당신의 금융 지식과<br>투자 성향을 알려주세요.</h1>
            <p class="sub-title">입력하신 정보에 맞춰 AI가 최적화된 문항 세트를 구성합니다.</p>
            
            <div class="options">
                <button class="btn-opt" onclick="startQuiz('beginner')">
                    🌱 주식에 관심은 있지만, 아직 용어도 어렵고 안전한 게 좋아요. (초급)
                </button>
                <button class="btn-opt" onclick="startQuiz('advanced')">
                    🦅 투자 경험이 꽤 있고, 기업 분석이나 수익률에 욕심이 있습니다. (중/고급)
                </button>
            </div>
        </div>

        <div id="viewQuiz" class="view-section">
            <div class="progress-container" style="display: block;">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="quizContent"></div>
        </div>

        <div id="viewResult" class="view-section">
            <div class="res-box">
                <div class="res-type" id="resType">투자 페르소나 분석 완료</div>
                <h1 class="res-name" id="resName">타이틀</h1>
                <p class="res-desc" id="resDesc">설명 텍스트</p>
            </div>

            <div class="curation-grid">
                <div class="c-card">
                    <div class="c-icon">📈</div>
                    <div class="c-header">맞춤형 포트폴리오 추천</div>
                    <div id="resPort"></div>
                </div>
                <div class="c-card">
                    <div class="c-icon">📚</div>
                    <div class="c-header">지식 확장을 위한 로드맵</div>
                    <div id="resStudy"></div>
                </div>
            </div>

            <a href="#" class="btn-restart" onclick="location.reload()">새로운 진단 시작하기</a>
        </div>

    </div>

<script>
    // 유저 상태 저장
    let userLevel = 'beginner';
    let currentQ = 0;
    let scores = { knowledge: 0, risk: 0, value: 0 }; // 지식, 위험감수, 가치투자 성향

    // --- 문제 세트 (초급/고급 분리) ---
    const quizData = {
        beginner: [
            {
                type: 'text',
                q: "다음 중 주식 투자 시 위험을 줄이기 위한 가장 기본적인 방법은 무엇인가요?",
                opts: [
                    { txt: "유튜브에서 추천하는 하나의 종목에 집중 투자한다.", k: 0, r: 10, v: 0 },
                    { txt: "여러 섹터의 종목에 나누어 투자하는 분산투자를 한다.", k: 10, r: -5, v: 5 },
                    { txt: "대출을 받아 투자 규모를 키운다.", k: -5, r: 20, v: 0 }
                ]
            },
            {
                type: 'visual',
                q: "친구에게 추천받은 두 회사가 있습니다. 당신의 선택은?",
                companies: [
                    { name: "A 기업", desc: "주가 변동이 거의 없지만, 매년 5%의 배당금(현금)을 꼬박꼬박 주는 은행주", k: 5, r: -10, v: 10 },
                    { name: "B 기업", desc: "배당금은 없지만, 최근 AI 테마로 묶여 한 달 만에 주가가 2배 오른 IT주", k: 0, r: 20, v: -5 }
                ]
            },
            {
                type: 'text',
                q: "보유하고 있는 주식이 갑자기 -15% 하락했습니다. 이때 당신의 첫 번째 행동은?",
                opts: [
                    { txt: "불안한 마음에 주식 어플을 삭제하고 외면한다.", k: 0, r: 0, v: -5 },
                    { txt: "하락한 이유(실적 부진 vs 시장 전체 하락)를 뉴스와 공시로 확인한다.", k: 10, r: 0, v: 10 },
                    { txt: "손실을 복구하기 위해 곧바로 물타기(추가 매수)를 감행한다.", k: 0, r: 15, v: -10 }
                ]
            }
        ],
        advanced: [
            {
                type: 'text',
                q: "기업의 수익성 지표인 ROE(자기자본이익률)와 PBR(주가순자산비율)의 관계로 가장 이상적인 투자 대상은?",
                opts: [
                    { txt: "ROE는 높고, PBR은 낮은 기업 (저평가 우량주)", k: 15, r: 0, v: 15 },
                    { txt: "ROE는 낮고, PBR은 높은 기업 (고평가 기업)", k: 0, r: 10, v: -10 },
                    { txt: "ROE와 상관없이 무조건 PER이 높은 기업", k: -5, r: 5, v: 0 }
                ]
            },
            {
                type: 'visual',
                q: "다음은 두 기업의 핵심 재무 지표입니다. 펀더멘털 분석에 기반하여 당신이 투자할 기업은?",
                companies: [
                    { name: "A 기업 (가치주)", data: { per: "6.5", pbr: "0.8", roe: "12%" }, k: 10, r: -5, v: 15 },
                    { name: "B 기업 (성장주)", data: { per: "85.0", pbr: "5.2", roe: "4%" }, k: 5, r: 15, v: -10 }
                ]
            },
            {
                type: 'text',
                q: "시장 전체가 공포에 빠져 폭락하는 베어마켓(Bear Market)이 왔습니다. 당신의 멘탈 관리와 대처법은?",
                opts: [
                    { txt: "포트폴리오의 펀더멘털이 훼손되지 않았다면, 이성적인 어른(Adult) 자아를 유지하며 분할 매수한다.", k: 10, r: 5, v: 15 },
                    { txt: "시장을 원망하고 스스로를 자책하는 통제적 부모(Controlling Parent, CP) 자아에 빠져 전량 손절한다.", k: -5, r: 0, v: -15 },
                    { txt: "기존 포트폴리오를 다 팔고 인버스/곱버스(하락 배팅) 상품으로 스위칭한다.", k: 5, r: 20, v: -5 }
                ]
            }
        ]
    };

    let activeSet = [];

    // 1. 온보딩 처리
    function startQuiz(level) {
        userLevel = level;
        activeSet = quizData[level];
        
        document.getElementById('viewOnboarding').classList.remove('active');
        document.getElementById('viewQuiz').classList.add('active');
        renderQuestion();
    }

    // 2. 퀴즈 렌더링
    function renderQuestion() {
        const qData = activeSet[currentQ];
        const progress = (currentQ / activeSet.length) * 100;
        document.getElementById('progressBar').style.width = progress + '%';

        const content = document.getElementById('quizContent');
        
        let html = `
            <span class="badge-text">QUESTION 0${currentQ + 1}</span>
            <h2 class="main-title">${qData.q}</h2>
        `;

        if (qData.type === 'text') {
            html += `<div class="options">`;
            qData.opts.forEach(opt => {
                html += `<button class="btn-opt" onclick="handleAnswer(${opt.k}, ${opt.r}, ${opt.v})">${opt.txt}</button>`;
            });
            html += `</div>`;
        } 
        else if (qData.type === 'visual') {
            html += `<div class="finance-panel">`;
            qData.companies.forEach(comp => {
                if(comp.data) {
                    // 재무제표 시각화 뷰 (고급)
                    html += `
                        <div class="finance-card" onclick="handleAnswer(${comp.k}, ${comp.r}, ${comp.v})">
                            <div class="f-title">${comp.name}</div>
                            <div class="f-row"><span class="f-label">PER (주가수익비율)</span> <span class="f-val">${comp.data.per}</span></div>
                            <div class="f-row"><span class="f-label">PBR (주가순자산비율)</span> <span class="f-val">${comp.data.pbr}</span></div>
                            <div class="f-row"><span class="f-label">ROE (자기자본이익률)</span> <span class="f-val ${comp.data.roe.replace('%','') > 10 ? 'good' : 'bad'}">${comp.data.roe}</span></div>
                        </div>
                    `;
                } else {
                    // 단순 설명 뷰 (초급)
                    html += `
                        <div class="finance-card" style="padding: 40px 20px;" onclick="handleAnswer(${comp.k}, ${comp.r}, ${comp.v})">
                            <div class="f-title">${comp.name}</div>
                            <p style="color: var(--text-sub);">${comp.desc}</p>
                        </div>
                    `;
                }
            });
            html += `</div>`;
        }

        content.innerHTML = html;
    }

    // 3. 답변 처리 및 로직 연산
    function handleAnswer(k, r, v) {
        scores.knowledge += k;
        scores.risk += r;
        scores.value += v;

        currentQ++;
        if(currentQ < activeSet.length) {
            renderQuestion();
        } else {
            document.getElementById('progressBar').style.width = '100%';
            showResult();
        }
    }

    // 4. 결과 도출 (작가님의 TA 심리학 + 투자 지표 완벽 융합)
    function showResult() {
        document.getElementById('viewQuiz').classList.remove('active');
        document.getElementById('viewResult').classList.add('active');

        const title = document.getElementById('resName');
        const desc = document.getElementById('resDesc');
        const port = document.getElementById('resPort');
        const study = document.getElementById('resStudy');

        if (scores.knowledge >= 15 && scores.value > 10) {
            document.getElementById('resType').innerText = "이성적 가치 투자자 (Adult Ego)";
            title.innerText = "데이터로 시장을 꿰뚫는\n'냉철한 분석가'";
            desc.innerText = "PER, PBR, ROE의 본질을 정확히 이해하고 있습니다. 하락장에서도 흔들리지 않는 어른(Adult) 자아를 바탕으로 저평가된 훌륭한 기업을 발굴할 수 있는 멘탈과 지식을 모두 갖추었습니다.";
            
            port.innerHTML = `
                <div class="c-item"><h4>1. 고품질 가치주 (예: 풍산, 명인제약, 현대차 등)</h4><p>낮은 PBR과 꾸준한 ROE를 보여주는 펀더멘털 우량 기업 위주로 비중을 확대하세요.</p></div>
                <div class="c-item"><h4>2. 중개형 ISA & IRP 연금저축 최적화</h4><p>비과세 및 세액공제 혜택을 한도 끝까지 활용하여 배당 재투자 복리 효과를 극대화해야 합니다.</p></div>
            `;
            study.innerHTML = `
                <div class="c-item"><h4>📖 필독서: 현명한 투자자 (벤자민 그레이엄)</h4><p>가치투자의 창시자가 남긴 걸작. 당신의 분석 논리에 확신을 더해줄 것입니다.</p></div>
                <div class="c-item"><h4>📺 추천 큐레이션: 전자공시시스템(DART) 파고들기</h4><p>유튜브나 기사가 아닌, 실제 기업의 사업보고서 원문을 직접 읽고 해석하는 연습을 추천합니다.</p></div>
            `;
        } 
        else if (scores.risk > 15 && scores.knowledge < 15) {
            document.getElementById('resType').innerText = "감정적 하이리스커 (Controlling Parent)";
            title.innerText = "통제적 자아를 다스려야 할\n'불나방 투자자'";
            desc.innerText = "수익에 대한 열망은 크지만, 시장을 예측하고 통제할 수 있다는 'Controlling Parent(CP)' 자아의 오류에 빠지기 쉽습니다. 기업의 가치보다는 차트와 뉴스에 휩쓸리는 뇌동매매를 주의해야 합니다.";
            
            port.innerHTML = `
                <div class="c-item"><h4>1. S&P 500 등 시장 지수 추종 ETF</h4><p>개별 종목의 변동성에 베팅하기보다, 시장 전체의 성장에 자본을 맡기는 수동적 투자가 멘탈 관리에 훨씬 유리합니다.</p></div>
                <div class="c-item"><h4>2. 고배당 ETF (예: SCHD, KODEX 고배당)</h4><p>주가 등락과 관계없이 매달/매분기 들어오는 현금 흐름이 당신의 불안한 심리를 안정시켜 줄 것입니다.</p></div>
            `;
            study.innerHTML = `
                <div class="c-item"><h4>📖 필독서: 돈의 심리학 (모건 하우절)</h4><p>투자는 지능이 아니라 태도입니다. 기술적 분석 이전에 투자 멘탈을 세팅하는 것이 시급합니다.</p></div>
                <div class="c-item"><h4>📺 추천 콘텐츠: 교류분석(TA)과 투자 심리학 강의</h4><p>나의 심리적 스크립트를 먼저 파악해야 투자 시장에서 살아남을 수 있습니다.</p></div>
            `;
        } 
        else {
            document.getElementById('resType').innerText = "안전제일주의자 (Child Ego)";
            title.innerText = "기본기 장착이 필요한\n'성장형 저축가'";
            desc.innerText = "아직은 투자 세계의 변동성이 낯설고 두렵습니다. 손실에 대한 방어 기제가 강하여 예적금에만 머물러 있을 확률이 높습니다. 인플레이션을 방어하기 위한 금융 기초 체력을 먼저 길러야 합니다.";
            
            port.innerHTML = `
