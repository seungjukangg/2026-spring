<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR ASSET CURATOR | 초정밀 자산 & 심리 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* 프리미엄 다크 모드 & 하이엔드 UI 변수 */
        :root {
            --bg: #030305;
            --surface: #111113;
            --primary: #ffffff;
            --accent: #10b981; /* 에메랄드 그린 (수익/안정) */
            --accent-glow: rgba(16, 185, 129, 0.15);
            --safe: #3b82f6;   /* 블루 (한국장 하락 / 안전) */
            --danger: #ef4444; /* 레드 (한국장 상승 / 위험) */
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 70%);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* 1. 글로벌 네비게이션 */
        .navbar { 
            padding: 20px 40px; display: flex; justify-content: center; 
            background: rgba(3,3,5,0.85); backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; 
        }
        .navbar h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; }
        .navbar h1 span { color: var(--accent); }

        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        /* 뷰 트랜지션 (화면 전환 효과) */
        .view-section { display: none; animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .view-section.active { display: block; }

        /* 타이포그래피 */
        .badge-text { font-size: 0.85rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; display: block; }
        .main-title { font-size: 2.3rem; font-weight: 900; line-height: 1.35; margin-bottom: 20px; word-break: keep-all; }
        .sub-title { font-size: 1.1rem; color: var(--text-sub); margin-bottom: 50px; font-weight: 300; }

        /* 2. 인터랙티브 옵션 버튼 */
        .options { display: flex; flex-direction: column; gap: 16px; }
        .btn-opt {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text-main);
            padding: 24px 30px; border-radius: 16px; font-size: 1.1rem; font-weight: 500; text-align: left;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); line-height: 1.5;
        }
        .btn-opt:hover { background: rgba(16, 185, 129, 0.05); border-color: var(--accent); transform: translateX(8px); box-shadow: 0 5px 20px var(--accent-glow); }

        /* 3. 데이터 시각화 패널 (차트 & 재무제표) */
        .visual-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .visual-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; cursor: pointer; transition: 0.3s; }
        .visual-card:hover { border-color: var(--accent); box-shadow: 0 10px 30px var(--accent-glow); transform: translateY(-5px); }
        .v-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; color: var(--primary); text-align: center; }

        /* 한국형 주식 캔들 차트 (CSS Only) */
        .chart-box { display: flex; align-items: center; justify-content: center; gap: 15px; height: 140px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .candle-container { display: flex; align-items: flex-end; height: 100px; gap: 8px; }
        .candle { position: relative; display: flex; justify-content: center; width: 14px; }
        .wick { position: absolute; width: 2px; height: 100%; z-index: 1; }
        .body { position: relative; width: 100%; z-index: 2; border-radius: 2px; }
        
        .up .wick, .up .body { background-color: var(--danger); } /* 상승(한국): Red */
        .down .wick, .down .body { background-color: var(--safe); } /* 하락(한국): Blue */

        /* 바 차트 (안전자산용) */
        .bar-chart { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 120px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .bar { width: 30px; background: var(--accent); border-radius: 4px 4px 0 0; transition: 0.5s; }

        /* 재무제표 텍스트 뷰 */
        .f-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }
        .f-row:last-child { border-bottom: none; }
        .f-val { font-weight: 800; font-family: monospace; font-size: 1.05rem; }

        /* 프로그레스 바 */
        .progress-container { width: 100%; height: 3px; background: var(--border); border-radius: 10px; margin-bottom: 50px; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; transition: 0.5s ease; box-shadow: 0 0 10px var(--accent); }

        /* 4. 결과 화면 */
        .res-header { text-align: center; margin-bottom: 50px; }
        .res-type { font-size: 1.15rem; font-weight: 800; color: var(--accent); margin-bottom: 12px; letter-spacing: 1px; }
        .res-name { font-size: 3.2rem; font-weight: 900; margin-bottom: 20px; line-height: 1.2; letter-spacing: -1px; }
        .res-desc { font-size: 1.1rem; color: var(--text-sub); line-height: 1.7; max-width: 750px; margin: 0 auto; word-break: keep-all; font-weight: 300; }

        .curation-grid { display: grid; grid-template-columns: 1fr; gap: 30px; text-align: left; margin-bottom: 50px; }
        .c-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 35px; }
        .c-header { font-size: 1.4rem; font-weight: 900; margin-bottom: 25px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .c-item { margin-bottom: 15px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 16px; border: 1px solid transparent; transition: 0.3s; }
        .c-item:hover { border-color: var(--border); background: rgba(255,255,255,0.04); }
        .c-item h4 { font-size: 1.15rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
        .c-item p { font-size: 0.95rem; color: var(--text-sub); line-height: 1.6; margin-bottom: 15px; }

        /* 다이렉트 링크 버튼 */
        .link-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 0.85rem; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .link-btn:hover { background: var(--primary); color: var(--bg); border-color: var(--primary); }

        .btn-restart { display: block; width: 100%; padding: 22px; background: var(--primary); color: var(--bg); font-size: 1.1rem; font-weight: 900; text-align: center; border-radius: 16px; cursor: pointer; border: none; transition: 0.3s; }
        .btn-restart:hover { background: var(--text-sub); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .visual-panel { grid-template-columns: 1fr; } .main-title { font-size: 1.8rem; } .res-name { font-size: 2.2rem; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>YOUR ASSET <span>CURATOR</span></h1>
    </nav>

    <div class="container">
        
        <div id="viewScreening" class="view-section active">
            <span class="badge-text">PHASE 1. INVESTOR SCREENING</span>
            <h1 class="main-title">자산을 운용하는 데 있어<br>귀하의 지식과 경험 수준을 선택해 주세요.</h1>
            <p class="sub-title">선택하신 수준에 따라 전문화된 맞춤형 분석 문항(차트/재무제표 등)이 제시됩니다.</p>
            
            <div class="options">
                <button class="btn-opt" onclick="setScreening('expert')">
                    🦅 <b>[적극적 자산관리형]</b> 주식, 채권 등 위험 자산 투자 경험이 있으며, 스스로 캔들 차트나 PBR/PER 등의 기업 지표를 분석해 매매를 결정해 본 적이 있다.
                </button>
                <button class="btn-opt" onclick="setScreening('beginner')">
                    🌱 <b>[안정 지향 / 입문형]</b> 예적금 위주로만 돈을 모아봤거나, 투자를 해봤어도 지인의 추천이나 뉴스만 보고 소액 매매해 본 것이 전부다.
                </button>
            </div>
        </div>

        <div id="viewQuiz" class="view-section">
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <div id="quizContent"></div>
        </div>

        <div id="viewResult" class="view-section">
            <div class="res-header">
                <div class="res-type" id="resType">분석 완료</div>
                <h1 class="res-name" id="resName">타이틀</h1>
                <p class="res-desc" id="resDesc">설명</p>
            </div>

            <div class="curation-grid">
                <div class="c-card">
                    <div class="c-header">📈 맞춤형 자산 포트폴리오 큐레이션</div>
                    <div id="resPort"></div>
                </div>
                <div class="c-card">
                    <div class="c-header">📚 인사이트 확장을 위한 추천 콘텐츠</div>
                    <div id="resStudy"></div>
                </div>
            </div>

            <button class="btn-restart" onclick="location.reload()">새로운 시나리오 진단하기</button>
        </div>

    </div>

<script>
    let userType = ''; 
    let currentQ = 0;
    // 다면 평가 척도
    let scores = { risk: 0, knowledge: 0, emotion: 0 }; 

    // [초급/안전형 세트]
    const beginnerQuiz = [
        {
            type: 'text', q: "매달 월급이 들어오면 남는 돈을 어떻게 관리하시나요?",
            opts: [
                { txt: "일단 일반 입출금 통장(월급통장)에 그대로 방치한다.", r: 0, k: 0, e: -5 },
                { txt: "매일 이자가 붙는 CMA나 파킹통장으로 즉시 이체한다.", r: 2, k: 10, e: 5 }
            ]
        },
        {
            type: 'visual', q: "두 가지 안전 자산 상품이 있습니다. 당신의 선택은?",
            companies: [
                { name: "A. 시중은행 정기예금", html: `<div class="bar-chart"><div class="bar" style="height:30px; background:#3b82f6;"></div><div class="bar" style="height:50px; background:#3b82f6;"></div><div class="bar" style="height:70px; background:#3b82f6;"></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">원금에만 단리 이자 적용</p>`, r: 0, k: 5, e: 0 },
                { name: "B. 초단기 국고채 ETF", html: `<div class="bar-chart"><div class="bar" style="height:20px; background:#10b981;"></div><div class="bar" style="height:40px; background:#10b981;"></div><div class="bar" style="height:80px; background:#10b981;"></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">이자에 이자가 붙는 복리 효과</p>`, r: 3, k: 15, e: 5 }
            ]
        },
        {
            type: 'text', q: "주변 지인들이 코인과 테마주로 돈을 벌었다고 자랑합니다. (FOMO 테스트)",
            opts: [
                { txt: "불안해져서 나도 모르게 주식 계좌를 만들고 유행하는 종목을 산다. (Child 자아)", r: 20, k: -10, e: -20 },
                { txt: "배는 아프지만, 내가 잘 모르는 분야는 쳐다보지 않는다며 멘탈을 다잡는다. (Adult 자아)", r: 0, k: 10, e: 20 }
            ]
        },
        {
            type: 'text', q: "다가올 노후 대비, 어떻게 준비하고 계신가요?",
            opts: [
                { txt: "국민연금과 회사에서 주는 퇴직금만 믿고 있다.", r: 0, k: 0, e: 0 },
                { txt: "퇴직연금(IRP)이나 연금저축펀드를 통해 세액공제를 받으며 안전하게 굴린다.", r: 5, k: 20, e: 10 }
            ]
        }
    ];

    // [전문가/적극형 세트]
    const expertQuiz = [
        {
            type: 'visual', q: "다음은 하락장 끝자락에서 발생한 일봉 캔들 차트입니다. 당신이 매수에 베팅할 차트 패턴은?",
            companies: [
                { name: "A. 긴 밑꼬리를 단 양봉 (망치형)", html: `<div class="chart-box"><div class="candle up" style="height: 80px;"><div class="wick" style="height:100%; top:0;"></div><div class="body" style="height:35%; top:0;"></div></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">장중 매도세를 이기고 강한 매수세가 유입되며 저점을 지지함</p>`, r: 10, k: 20, e: 10 },
                { name: "B. 윗꼬리가 긴 음봉 (유성형)", html: `<div class="chart-box"><div class="candle down" style="height: 80px;"><div class="wick" style="height:100%; top:0;"></div><div class="body" style="height:40%; bottom:0;"></div></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">장중 크게 상승했으나 강한 매도세에 밀려 하락 마감함</p>`, r: -10, k: -15, e: -10 }
            ]
        },
        {
            type: 'text', q: "최근 외국인 자본이 대형 반도체주에서 차익을 실현하고, 상대적으로 소외되었던 철강 및 화학 등 저PBR 경기민감주로 이동하고 있습니다. 당신의 포트폴리오 전략은?",
            opts: [
                { txt: "시장 수급과 매크로 흐름에 맞춰, 주도주 비중을 축소하고 턴어라운드가 기대되는 저PBR 철강/가치주 섹터로 로테이션을 준비한다.", r: 10, k: 25, e: 15 },
                { txt: "외국인 수급은 일시적이므로 신경 쓰지 않고, 내가 산 주도주가 다시 오를 때까지 맹목적으로 버틴다. (Controlling Parent 자아)", r: -10, k: -10, e: -15 }
            ]
        },
        {
            type: 'visual', q: "두 기업의 핵심 펀더멘털 지표입니다. 가치투자를 지향한다면 어디를 고르시겠습니까?",
            companies: [
                { name: "C 기업 (저평가 가치주)", html: `<div class="f-row"><span>PER</span><span class="f-val" style="color:var(--accent);">6.5</span></div><div class="f-row"><span>PBR</span><span class="f-val">0.7</span></div><div class="f-row"><span>ROE</span><span class="f-val">11.5%</span></div>`, r: 5, k: 20, e: 15 },
                { name: "D 기업 (초고성장 테마주)", html: `<div class="f-row"><span>PER</span><span class="f-val" style="color:var(--danger);">185.0</span></div><div class="f-row"><span>PBR</span><span class="f-val">9.5</span></div><div class="f-row"><span>ROE</span><span class="f-val">-1.5%</span></div>`, r: 20, k: -5, e: -15 }
            ]
        },
        {
            type: 'text', q: "보유 종목이 단기적인 시장 악재로 -15% 하락했습니다. 당신의 심리 상태와 대처는?",
            opts: [
                { txt: "공포감에 휩싸여 차트를 계속 보다가, 더 떨어질까 무서워 바닥에서 전량 매도한다. (Child 자아)", r: -10, k: -10, e: -20 },
                { txt: "기업의 본질 가치가 훼손되지 않았다면 싼 값에 살 기회라 생각하고 이성적으로 분할 매수한다. (Adult 자아)", r: 15, k: 15, e: 25 }
            ]
        }
    ];

    let activeQuiz = [];

    function setScreening(type) {
        userType = type;
        activeQuiz = type === 'expert' ? expertQuiz : beginnerQuiz;
        
        document.getElementById('viewScreening').classList.remove('active');
        document.getElementById('viewQuiz').classList.add('active');
        renderQuiz();
    }

    function renderQuiz() {
        const qData = activeQuiz[currentQ];
        const progress = (currentQ / activeQuiz.length) * 100;
        document.getElementById('progressBar').style.width = progress + '%';
        const content = document.getElementById('quizContent');
        
        let html = `
            <span class="badge-text">PHASE 2. DEEP DIVE : Q0${currentQ + 1}</span>
            <h2 class="main-title">${qData.q}</h2>
        `;

        if (qData.type === 'text') {
            html += `<div class="options">`;
            qData.opts.forEach(opt => { html += `<button class="btn-opt" onclick="handleAns(${opt.r}, ${opt.k}, ${opt.e})">${opt.txt}</button>`; });
            html += `</div>`;
        } else if (qData.type === 'visual') {
            html += `<div class="visual-panel">`;
            qData.companies.forEach(comp => {
                html += `
                    <div class="visual-card" onclick="handleAns(${comp.r}, ${comp.k}, ${comp.e})">
                        <div class="v-title">${comp.name}</div>
                        ${comp.html}
                    </div>
                `;
            });
            html += `</div>`;
        }
        content.innerHTML = html;
    }

    function handleAns(r, k, e) {
        scores.risk += r; scores.knowledge += k; scores.emotion += e;
        currentQ++;
        if(currentQ < activeQuiz.length) renderQuiz();
        else {
            document.getElementById('progressBar').style.width = '100%';
            setTimeout(showResult, 500); 
        }
    }

    function showResult() {
        document.getElementById('viewQuiz').classList.remove('active');
        document.getElementById('viewResult').classList.add('active');

        const typeLabel = document.getElementById('resType');
        const nameLabel = document.getElementById('resName');
        const descLabel = document.getElementById('resDesc');
        const portArea = document.getElementById('resPort');
        const studyArea = document.getElementById('resStudy');

        // [결과 1] 입문형 & 방어형 자산가
        if (userType === 'beginner' || (userType === 'expert' && scores.emotion < 0)) {
            typeLabel.innerText = "멘탈 관리 필수 (Child Ego)";
            nameLabel.innerText = "손실 방어가 최우선인\n'수비형 자산가'";
            descLabel.innerText = "투자 세계의 변동성에 대한 방어 기제(Child 자아)가 강합니다. 무리한 주식 투자로 극심한 스트레스를 받기보다는, 자산을 안전하게 굴리면서 복리의 마법을 챙기는 시스템 구축이 필요합니다.";
            
            portArea.innerHTML = `
                <div class="c-item">
                    <h4 style="color:var(--safe);">1. CMA 파킹통장 및 초단기 금리형 상품</h4>
                    <p>비상금은 KODEX KOFR 금리액티브 등 무손실에 가까운 초단기 채권형 상품에 넣어 매일 이자가 붙는 구조를 만드세요.</p>
                </div>
                <div class="c-item">
                    <h4 style="color:var(--safe);">2. 예적금 & 국공채 펀드</h4>
