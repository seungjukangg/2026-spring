<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The mirror of the s(e)oul</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Noto Sans KR', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 250vh;
            overflow-x: hidden;
            font-family: var(--font-sans);
            scroll-behavior: smooth;
        }

        /* ------------------------------------
           1. Intro & Action Sections
        ------------------------------------ */
        .intro-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 20; background-color: var(--bg-color); transition: opacity 0.3s ease-out;
        }
        .intro-section::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_1ccf77.jpg'); background-size: cover; background-position: center;
            opacity: 0.15; z-index: -1; pointer-events: none;
        }
        .eye-image {
            width: 100%; height: 25vh; background-image: url('image_fe4efa.jpg'); 
            background-size: cover; background-repeat: no-repeat; filter: grayscale(100%); 
        }
        .eye-top { background-position: center top; }
        .eye-bottom { background-position: center bottom; }
        .center-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .main-title { font-family: var(--font-serif); font-size: clamp(3rem, 7vw, 7rem); font-weight: 400; letter-spacing: 0.02em; line-height: 1.1; text-transform: uppercase; margin: 20px 0; }
        .main-title span { font-style: italic; color: #aaaaaa; }
        .sub-text { font-size: 0.9rem; letter-spacing: 0.1em; color: #cccccc; font-family: var(--font-sans); text-transform: uppercase; }

        .scroll-indicator { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 25; transition: opacity 0.3s; pointer-events: none; }
        .scroll-indicator span { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: #888; }
        .scroll-indicator .arrow { width: 1px; height: 30px; background: #fff; margin: 10px auto 0; animation: slideDown 1.5s infinite; }
        @keyframes slideDown { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(15px); opacity: 0; } }

        .action-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 10; opacity: 0; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #111111 0%, #000000 100%);
            transition: opacity 0.3s ease-out; pointer-events: none; 
        }
        .action-btn {
            display: inline-block; font-family: var(--font-serif); font-size: 1.5rem; color: #ffffff; text-decoration: none; padding: 20px 50px;
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50px; letter-spacing: 0.05em; transition: all 0.4s ease;
            position: relative; overflow: hidden; background: transparent; cursor: pointer; text-transform: lowercase; min-width: 300px; text-align: center;
        }
        .action-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: -1; transform: scaleX(0); transform-origin: right; transition: transform 0.4s ease; }
        .action-btn:hover { color: #000000; border-color: #ffffff; }
        .action-btn:hover::before { transform: scaleX(1); transform-origin: left; }

        /* ------------------------------------
           2. Survey & Generative Art (Soul Art)
        ------------------------------------ */
        .survey-container, .result-container, .transition-screen, .places-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: var(--bg-color); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.5s ease; overflow-y: auto; padding: 20px;
        }
        .active { display: flex !important; opacity: 1 !important; }
        
        /* [아이디어 1] 생성형 아트 캔버스 스타일 */
        #soulArtCanvas {
            width: 300px; height: 300px; margin-bottom: 20px;
            filter: blur(20px); /* 몽환적인 느낌을 위해 블러 처리 */
            animation: rotateArt 20s linear infinite;
        }
        @keyframes rotateArt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .progress-bar { position: absolute; top: 0; left: 0; height: 4px; background-color: #ffffff; width: 0%; transition: width 0.3s ease; }
        .question-text { font-family: var(--font-serif); font-size: 2.2rem; margin-bottom: 40px; text-align: center; word-break: keep-all; }
        .option-btn { background: #111; border: 1px solid #444; color: #fff; padding: 18px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; transition: all 0.3s; margin-bottom: 10px; width: 100%; max-width: 500px; }
        .option-btn:hover { border-color: #fff; background-color: #222; }

        .axis-container { width: 100%; max-width: 600px; background: #111; padding: 25px; border-radius: 15px; margin-bottom: 30px; }
        .axis-row { margin-bottom: 20px; }
        .axis-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .axis-line { position: relative; width: 100%; height: 2px; background: #333; }
        .axis-dot { position: absolute; top: -4px; width: 10px; height: 10px; background: #fff; border-radius: 50%; transition: left 1s ease; }

        /* ------------------------------------
           3. Places & Soundscape
        ------------------------------------ */
        .places-bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; object-fit: cover; z-index: -1; opacity: 0.2; filter: grayscale(100%); }
        .places-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }
        
        .place-card {
            background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 12px; padding: 25px;
            text-decoration: none; color: #ffffff; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        /* [아이디어 3] 마우스 오버 시 카드 강조 및 사운드 힌트 */
        .place-card:hover { border-color: #fff; transform: translateY(-10px); background: rgba(30, 30, 30, 0.9); }
        .place-card::after { content: '🔊 Ambient Soundscape'; font-size: 0.6rem; color: #666; display: block; margin-top: 15px; opacity: 0; transition: 0.3s; }
        .place-card:hover::after { opacity: 1; }

        .place-title { font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 5px; }
        .place-vibe { font-size: 0.75rem; color: #888; margin-bottom: 15px; text-transform: uppercase; }
        .place-desc { font-size: 0.9rem; color: #ccc; line-height: 1.6; flex-grow: 1; }
    </style>
</head>
<body>

    <!-- 1. Intro -->
    <div class="intro-section" id="introSection">
        <div class="eye-image eye-top"></div>
        <div class="center-content">
            <p class="sub-text">Analyzing one's soul, connecting to Seoul.</p>
            <h1 class="main-title">The mirror of<br>the s<span>(e)</span>oul</h1>
            <p class="sub-text">Take in the soul of Seoul.</p>
        </div>
        <div class="eye-image eye-bottom"></div>
        <div class="scroll-indicator" id="scrollIndicator"><span>Scroll Down</span><div class="arrow"></div></div>
    </div>

    <!-- 2. Action -->
    <div class="action-section" id="actionSection">
        <div class="btn-wrapper">
            <p class="btn-desc">당신의 공간 성향을 찾아보세요</p>
            <a href="#" id="startSurveyBtn" class="action-btn">mirroring my soul</a>
        </div>
    </div>

    <!-- 3. Survey -->
    <div class="survey-container" id="surveyContainer">
        <div class="progress-bar" id="progressBar"></div>
        <div class="question-box">
            <h2 class="question-text" id="questionText">Loading...</h2>
            <div class="options-wrapper" id="optionsWrapper"></div>
        </div>
    </div>

    <!-- 4. Transition -->
    <div class="transition-screen" id="transitionScreen">
        <h1 class="transition-text">&lt;&lt; Your Seoul Soul Archetype &gt;&gt;</h1>
    </div>

    <!-- 5. Result (Generating Art) -->
    <div class="result-container" id="resultContainer">
        <div class="result-content">
            <!-- [아이디어 1] 생성형 아트 영역 -->
            <canvas id="soulArtCanvas" width="400" height="400"></canvas>
            <div id="archetypeResult"></div>
            <div class="axis-container" id="axisContainer"></div>
            <button class="option-btn" id="goSearchingBtn" style="border-color:#fff; background:rgba(255,255,255,0.1);">Searching my Seoul 하러가기</button>
            <button class="option-btn" style="font-size:0.8rem; border:none; color:#666;" onclick="location.reload()">다시 하기</button>
        </div>
    </div>

    <!-- 6. Map Animation -->
    <div class="map-transition-screen" id="mapTransitionScreen">
        <h1 class="map-overlay-text">Plotting your coordinates...</h1>
    </div>

    <!-- 7. Places (Soundscape) -->
    <div class="places-container" id="placesContainer">
        <img src="https://images.unsplash.com/photo-1524311583145-d5593bd2602a?q=80&w=2000&auto=format&fit=crop" class="places-bg-image">
        <div class="places-header" style="text-align:center; margin-bottom:40px;">
            <h1 class="archetype-title" style="font-size: 2.5rem;">Your Seoul Archive</h1>
            <p style="color:#888; font-style:italic;">장소 위에 마우스를 올려 공간의 소리를 미리 들어보세요.</p>
        </div>
        <div class="places-grid" id="placesGrid"></div>
        <button class="option-btn" style="margin-top:50px; max-width:200px;" onclick="location.reload()">처음으로</button>
    </div>

    <!-- [아이디어 3] 오디오 재생용 보이지 않는 요소 -->
    <audio id="ambientAudio" loop></audio>

    <script>
        // ==========================================
        // 장소 데이터베이스 (Sound 링크 추가됨)
        // ==========================================
        const placesDB = {
              introvert: [
                { title: "Papier Prost", vibe: "사색 · 기록 · 서재", desc: "고요하게 나의 내면으로 침잠할 수 있는 서촌의 문구점 겸 카페. 노트와 펜만 있으면 완벽한 곳.", link: "https://map.naver.com/p/entry/place/1416133236?placePath=%252Fhome%253Fentry%253Dplt&searchType=place&lng=126.9692198&lat=37.5803821" },
                { title: "LocalStitch 서교", vibe: "몰입 · 작업 · 영감", desc: "크리에이터들을 위한 고요한 영감의 공간. 노트북 하나 들고 하루 종일 글쓰기 좋은 라운지.", link: "https://localstitch.town/" },
                { title: "보안여관", vibe: "전시 · 통의동 · 영감", desc: "오래된 여관의 뼈대를 남긴 갤러리 겸 서점. 삐걱거리는 나무 바닥 소리와 함께 사색하기 좋은 곳.", link: "https://map.naver.com/p/search/%EB%B3%B4%EC%95%88%EC%97%AC%EA%B4%80/place/19584832?c=15.00,0,0,0,dh" },
                { title: "수수께끼와 답장", vibe: "독서 · 휴식 · 저자극", desc: "서초 도심 속 작은 아지트처럼 꾸며진 공간. 책을 읽으며 복잡한 머릿속을 비워내기 좋습니다.", link: "https://map.naver.com/p/entry/place/2097989513?c=15.00,0,0,0,dh&placePath=/home?from=map&fromPanelNum=1&additionalHeight=76&timestamp=202604302318&locale=ko&svcName=map_pcv5" },
                { title: "맨홀커피웨스턴책방", vibe: "클래식 · 인테리어 · 디저트 ", desc: "영등포 골목 1만 권의 책과 커피가 어우러진 아늑한 공간", link: "https://map.naver.com/p/entry/place/1471240461?c=11.76,0,0,0,dh&placePath=/home?bookmarkId=2866770638&from=map&fromPanelNum=1&additionalHeight=76&timestamp=202604302312&locale=ko&svcName=map_pcv5" }, 
                { title: "pointtofiveseconds", vibe: "향수 · 소품샵 · 티코스", desc: "경복궁 뷰에서 프리미엄 티코스를 즐기며 당신만의 향을 시향해보세요", link: "https://map.naver.com/p/entry/place/1125006314?c=14.55,0,0,0,dh&placePath=/home?bookmarkId=4397527871&from=map&fromPanelNum=1&additionalHeight=76&timestamp=202604302326&locale=ko&svcName=map_pcv5" }
            ], // <--- 여기가 빠져 있어서 오류가 났던 것입니다!
            extrovert: [
                { title: "AllThatJazz", vibe: "재즈 · 밤 · 고자극", desc: "이태원의 밤을 낭만으로 채우는 라이브 재즈바. 사람들의 열기와 음악이 뒤섞인 공간.", link: "https://map.naver.com/p/search/allthatjazz?c=15.00,0,0,0,dh" },
                { title: "성수연방", vibe: "팝업 · 탐험 · 복합공간", desc: "언제나 새로운 브랜드와 힙한 사람들이 모이는 곳. 트렌드의 최전선에서 자극을 받기 좋습니다.", link: "https://sites.google.com/view/ssyb" },
                { title: "BoogieWoogie", vibe: "음악 · 교류 · 공연", desc: "신청곡을 적어내고 공간을 채우는 사운드에 몸을 맡기는 곳. 우연한 대화가 싹트기도 합니다.", link: "https://map.naver.com/p/search/boogiewoogie/place/37921792?c=15.00,0,0,0,dh&isCorrectAnswer=true&placePath=/home?from=map&fromPanelNum=1&additionalHeight=76&timestamp=202604302317&locale=ko&svcName=map_pcv5&searchText=boogiewoogie" },
                { title: "Graphic", vibe: "만화 · 그림 · 무제한간식", desc: "해방촌에 숨겨진 트렌디한 만화방, 무제한 간식과 아늑한 공간.", link: "https://map.naver.com/p/entry/place/1867194239?c=14.71,0,0,0,dh" },
                { title: "스테이희와", vibe: "한옥 · 료칸 · 자연", desc: "혜화 끝자락에 위치한 프라이빗 한옥 독채, 산으로 둘러쌓인 자연의 공간." , link: "https://map.naver.com/p/entry/place/1095060963?c=13.23,0,0,0,dh&placePath=/home?bookmarkId=4299220930&from=map&fromPanelNum=1&additionalHeight=76&timestamp=202604302320&locale=ko&svcName=map_pcv5&businessCategory=guesthouse" },
                { title: "DynamicMaze", vibe: "한옥 · 료칸 · 자연", desc: "인사동의 명물, 끝없는 미로에서 탈출하라! 액티비티와 다양한 게도 함께", link: "https://map.naver.com/p/entry/place/36631598?c=15.00,0,0,0,dh&placePath=/home?from=map&fromPanelNum=1&additionalHeight=76&timestamp=202604302325&locale=ko&svcName=map_pcv5" }
            ]
        };

        // ==========================================
        // 1. [아이디어 1] 생성형 영혼 아트 (Canvas Drawing)
        // ==========================================
        function drawSoulArt(axes) {
            const canvas = document.getElementById('soulArtCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.clearRect(0, 0, w, h);
            
            // 축 수치에 따라 색상과 형태 변형
            // 내향(Intro) 수치가 높으면 Blue 계열, 외향(Extro) 수치가 높으면 Red/Gold 계열
            const energyVal = axes[0].val; // Energy Axis
            const color = energyVal < 50 ? `rgba(100, 150, 255, 0.8)` : `rgba(255, 100, 50, 0.8)`;
            
            ctx.shadowBlur = 40;
            ctx.shadowColor = color;
            
            // 유기적인 '영혼의 형태' 그리기 (Bezier Curves)
            ctx.beginPath();
            ctx.fillStyle = color;
            
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = 60 + (axes[1].val / 2); // 자극(Stimulus) 수치에 따라 크기 변화

            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * radius * (Math.random() * 0.5 + 0.8);
                const y = centerY + Math.sin(angle) * radius * (Math.random() * 0.5 + 0.8);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
        }

        // ==========================================
        // 2. [아이디어 3] 소리의 서울 (Audio Control)
        // ==========================================
        const ambientAudio = document.getElementById('ambientAudio');
        
        function playSound(url) {
            if(!url) return;
            ambientAudio.src = url;
            ambientAudio.volume = 0; // 페이드 인 효과
            ambientAudio.play();
            let vol = 0;
            const fadeIn = setInterval(() => {
                if (vol >= 0.4) clearInterval(fadeIn);
                vol += 0.05;
                ambientAudio.volume = vol;
            }, 50);
        }

        function stopSound() {
            let vol = ambientAudio.volume;
            const fadeOut = setInterval(() => {
                if (vol <= 0.05) {
                    clearInterval(fadeOut);
                    ambientAudio.pause();
                }
                vol -= 0.05;
                if(vol > 0) ambientAudio.volume = vol;
            }, 50);
        }

        // ==========================================
        // 3. UI Control & Logic
        // ==========================================
        const introSection = document.getElementById('introSection');
        const actionSection = document.getElementById('actionSection');

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY || document.documentElement.scrollTop;
            const windowHeight = window.innerHeight;
            let scrollRatio = scrollY / (windowHeight * 0.5);
            if (scrollRatio > 1) scrollRatio = 1;

            introSection.style.opacity = 1 - scrollRatio;
            actionSection.style.opacity = scrollRatio;

            if (scrollRatio > 0.5) {
                actionSection.style.pointerEvents = 'auto';
                introSection.style.pointerEvents = 'none'; 
            } else {
                actionSection.style.pointerEvents = 'none';
                introSection.style.pointerEvents = 'auto';
            }
        });

        const startBtn = document.getElementById('startSurveyBtn');
        startBtn.addEventListener('click', (e) => {
            e.preventDefault(); 
            document.body.style.overflow = 'hidden'; 
            introSection.style.display = 'none';
            actionSection.style.display = 'none';
            document.getElementById('surveyContainer').classList.add('active');
            renderQuestion(); 
        });

        // 설문 문항 및 로직
        const questions = [
            { q: "Q1. 당신은 에너지를 어디서 회복하나요?", options: ["완전히 혼자", "조용한 소수", "적당한 사람들", "활기찬 사람들 속"] },
            { q: "Q2. 가장 편안한 소리 환경은?", options: ["완전한 정적", "잔잔한 배경음 (카페/재즈)", "사람들의 웅성거림", "음악/활기 있는 소음"] },
            { q: "Q3. 선호하는 공간의 밀도는?", options: ["널찍하고 비어있는 공간", "적당히 여유로운 공간", "아늑하게 채워진 공간", "꽉 찬 활기 있는 공간"] },
            { q: "Q4. 가장 끌리는 조명은?", options: ["자연광", "따뜻한 간접조명", "어두운 무드 조명", "네온/강한 인공조명"] },
            { q: "Q5. 가장 ‘나답다’고 느끼는 시간은?", options: ["이른 아침", "낮", "저녁", "깊은 밤"] },
            { q: "Q6. 공간을 찾는 주된 이유는?", options: ["몰입 (공부/작업)", "사색/감정 정리", "대화/관계", "자극/영감 얻기"] },
            { q: "Q7. 요즘 가장 원하는 감정 상태는?", options: ["안정/평온", "따뜻함/위로", "설렘/로맨틱", "자극/흥분"] },
            { q: "Q8. 끌리는 공간 스타일은?", options: ["미니멀/화이트", "우드/빈티지", "클래식/유럽풍", "힙/인더스트리얼"] },
            { q: "Q9. 공간 선택 시 중요한 기준은?", options: ["가격 효율", "분위기", "독특함", "브랜드/퀄리티"] },
            { q: "Q10. 당신은?", options: ["익숙한 곳 반복", "70% 익숙 + 30% 새로움", "50:50", "항상 새로운 곳"] },
            { q: "Q11. 감각 중 가장 중요한 것은?", options: ["시각 (인테리어)", "청각 (음악/소리)", "후각 (향)", "촉각 (의자/공간 질감)"] },
            { q: "Q12. 공간에서 타인과의 거리감은?", options: ["완전 분리", "적당한 거리", "자연스럽게 섞임", "적극적 교류"] },
            { q: "Q13. 더 끌리는 것은?", options: ["책/글", "음악", "음식/카페", "예술/전시"] },
            { q: "Q14. 좋은 공간을 위해 이동 가능한 범위는?", options: ["집 근처만", "30분 이내", "1시간 이내", "거리 상관 없음"] },
            { q: "Q15. 공간 방문 스타일은?", options: ["철저한 계획", "대략 계획", "즉흥", "완전 즉흥"] },
            { q: "Q16. 당신에게 공간은?", options: ["생산의 장소", "회복의 장소", "관계의 장소", "탈출의 장소"] },
            { q: "Q17. 선호하는 공간 온도/느낌은?", options: ["차갑고 깔끔", "중립적", "따뜻하고 포근", "뜨겁고 에너지 있음"] },
            { q: "Q18. 당신은?", options: ["대중적인 것 선호", "적당히 개성", "확실한 취향 있음", "매우 니치/마이너 취향"] },
            { q: "Q19. 한 공간에 머무는 스타일은?", options: ["짧게 여러 곳", "1~2시간", "오래 머무름", "하루 종일"] },
            { q: "Q20. 가장 끌리는 하루는?", options: ["조용히 책 읽는 하루", "카페/거리 산책", "사람들과 대화", "새로운 곳 탐험"] }
        ];

        let currentQuestionIndex = 0;
        let answers = []; 

        function renderQuestion() {
            if(currentQuestionIndex >= questions.length) { showTransition(); return; }
            document.getElementById('progressBar').style.width = `${(currentQuestionIndex / questions.length) * 100}%`;
            const qData = questions[currentQuestionIndex];
            document.getElementById('questionText').innerText = qData.q;
            const wrapper = document.getElementById('optionsWrapper');
            wrapper.innerHTML = ''; 
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => { answers.push(idx); currentQuestionIndex++; renderQuestion(); };
                wrapper.appendChild(btn);
            });
        }

        function showTransition() {
            document.getElementById('surveyContainer').classList.remove('active');
            const transBox = document.getElementById('transitionScreen');
            transBox.classList.add('active');
            setTimeout(showResult, 2500);
        }

        const archetypes = [
            { name: "Midnight Observer", sub: "고요 + 내향 + 밤 + 사색", desc: "“혼자 깊이 빠지는 타입”", rec: "👉 추천: 심야 카페, 서재형 카페, 한적한 바" },
            { name: "Quiet Curator", sub: "미니멀 + 안정 + 몰입", desc: "“취향을 조용히 쌓는 사람”", rec: "👉 추천: 독립서점, 전시형 카페, 북카페" },
            { name: "Urban Pulse", sub: "외향 + 고자극 + 밤", desc: "“도시의 에너지에서 살아나는 타입”", rec: "👉 추천: 재즈바, LP바, 힙한 카페" },
            { name: "Slow Ritualist", sub: "안정 + 반복 + 낮", desc: "“루틴 속에서 편안함을 느끼는 타입”", rec: "👉 추천: 단골 카페, 조용한 프랜차이즈" },
            { name: "Sensory Drifter", sub: "감각 중심 + 즉흥 + 탐험", desc: "“분위기를 따라 떠도는 사람”", rec: "👉 추천: 골목 카페, 감성 공간" },
            { name: "Deep Diver", sub: "몰입 + 혼자 + 장시간", desc: "“한 공간에서 끝까지 파는 타입”", rec: "👉 추천: 도서관, 스터디카페, 조용한 라운지" },
            { name: "Romantic Escapist", sub: "감성 + 따뜻함 + 밤", desc: "“현실보다 분위기를 사는 사람”", rec: "👉 추천: 와인바, 무드 카페, 한옥 공간" },
            { name: "Social Flow Seeker", sub: "사람 + 자연스러운 교류", desc: "“관계 속에서 흐르는 타입”", rec: "👉 추천: 브런치 카페, 라운지, 커뮤니티 공간" },
            { name: "Aesthetic Explorer", sub: "새로움 + 미적 집착", desc: "“예쁜 곳을 찾아다니는 사람”", rec: "👉 추천: 전시, 디자인 카페, 핫플" },
            { name: "Momentum Chaser", sub: "활동 + 이동 + 자극", desc: "“한 곳에 머물지 않는 타입”", rec: "👉 추천: 복합공간, 팝업, 거리 중심지" },
            { name: "Soft Retreator", sub: "회복 + 자연 + 저자극", desc: "“도시 속 쉼을 찾는 사람”", rec: "👉 추천: 한강, 숲 카페, 한옥 카페" }
        ];

        function showResult() {
            document.getElementById('transitionScreen').classList.remove('active');
            const totalScore = answers.reduce((a, b) => a + b, 0);
            const resultIndex = totalScore % 11; 
            const myResult = archetypes[resultIndex];
            
            document.getElementById('archetypeResult').innerHTML = `<h1 class="archetype-title">${myResult.name}</h1><p class="archetype-sub">${myResult.sub}</p><p class="archetype-desc">${myResult.desc}<br><br>${myResult.rec}</p>`;
            
            const axisData = [
                { name: "Energy", left: "내향", right: "외향", val: (answers[0]+answers[1]+answers[2]+answers[11]) * 8 },
                { name: "Stimulus", left: "저자극", right: "고자극", val: (answers[3]+answers[6]+answers[10]+answers[16]) * 8 },
                { name: "Aesthetic", left: "미니멀", right: "힙/빈티지", val: (answers[7]+answers[8]+answers[12]) * 10 },
                { name: "Purpose", left: "몰입", right: "탐험", val: (answers[5]+answers[15]+answers[19]) * 10 },
                { name: "Routine", left: "안정", right: "새로움", val: (answers[9]+answers[13]+answers[14]) * 10 }
            ];
            
            let axesHtml = '';
            axisData.forEach(axis => {
                let percent = Math.min(Math.max(axis.val, 10), 90); 
                axesHtml += `<div class="axis-row"><div class="axis-labels"><span>${axis.left}</span><span>${axis.name}</span><span>${axis.right}</span></div><div class="axis-line"><div class="axis-dot" style="left: ${percent}%;"></div></div></div>`;
            });
            document.getElementById('axisContainer').innerHTML = axesHtml;
            
            // [아이디어 1] 결과에 맞춘 생성형 아트 그리기
            drawSoulArt(axisData);

            document.getElementById('resultContainer').classList.add('active');
        }

        const introvertTypes = [0, 1, 3, 5, 6, 10]; 

        document.getElementById('goSearchingBtn').addEventListener('click', () => {
            document.getElementById('resultContainer').classList.remove('active');
            const mapScreen = document.getElementById('mapTransitionScreen');
            mapScreen.style.display = 'block';
            setTimeout(() => { mapScreen.style.opacity = '1'; }, 50);

            setTimeout(() => {
                mapScreen.style.opacity = '0';
                setTimeout(() => {
                    mapScreen.style.display = 'none';
                    const totalScore = answers.reduce((a, b) => a + b, 0);
                    renderPlaces(totalScore % 11);
                }, 1000); 
            }, 3000); 
        });

        function renderPlaces(typeIndex) {
            const grid = document.getElementById('placesGrid');
            grid.innerHTML = ''; 
            const targetPlaces = introvertTypes.includes(typeIndex) ? placesDB.introvert : placesDB.extrovert;
            
            targetPlaces.forEach(place => {
                const card = document.createElement('a');
                card.href = place.link;
                card.target = "_blank"; 
                card.className = "place-card";
                card.innerHTML = `<h2 class="place-title">${place.title}</h2><p class="place-vibe">${place.vibe}</p><p class="place-desc">${place.desc}</p><div style="font-size:0.7rem; border-top:1px solid #333; padding-top:10px; margin-top:15px;">Naver Map &rarr;</div>`;
                
                // [아이디어 3] 카드 마우스 이벤트에 사운드 연결
                card.onmouseenter = () => playSound(place.sound);
                card.onmouseleave = () => stopSound();
                
                grid.appendChild(card);
            });
            document.getElementById('placesContainer').classList.add('active');
        }
    </script>
</body>
</html>
