<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR ASSET CURATOR | 초정밀 자산 & 심리 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --surface: #111113;
            --primary: #ffffff;
            --accent: #10b981; /* 자산 성장을 상징하는 에메랄드 */
            --accent-glow: rgba(16, 185, 129, 0.2);
            --safe: #3b82f6; 
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 60%);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* 내비게이션 */
        .navbar { padding: 25px 40px; display: flex; justify-content: center; background: rgba(3,3,5,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; }
        .navbar h1 span { color: var(--accent); }

        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        /* 공통 뷰 트랜지션 */
        .view-section { display: none; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .view-section.active { display: block; }

        .badge-text { font-size: 0.85rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        .main-title { font-size: 2.2rem; font-weight: 900; line-height: 1.35; margin-bottom: 20px; word-break: keep-all; }
        .sub-title { font-size: 1.1rem; color: var(--text-sub); margin-bottom: 40px; font-weight: 300; }

        /* 버튼형 옵션 */
        .options { display: flex; flex-direction: column; gap: 16px; }
        .btn-opt {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text-main);
            padding: 24px 30px; border-radius: 16px; font-size: 1.1rem; font-weight: 500; text-align: left;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-opt:hover { background: rgba(16, 185, 129, 0.05); border-color: var(--accent); transform: translateX(5px); }

        /* 시각화 패널 (그래프 & 재무제표) */
        .visual-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .visual-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; cursor: pointer; transition: 0.3s; }
        .visual-card:hover { border-color: var(--accent); box-shadow: 0 10px 30px var(--accent-glow); transform: translateY(-5px); }
        .v-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 15px; color: var(--primary); text-align: center; }

        .graph-box { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 120px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .bar { width: 30px; background: var(--accent); border-radius: 4px 4px 0 0; transition: 0.5s; }
        .bar.volatile { background: #ef4444; }
        .bar.safe { background: var(--safe); }

        .f-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }
        .f-row:last-child { border-bottom: none; }
        .f-val { font-weight: 800; font-family: monospace; }

        /* 프로그레스 바 */
        .progress-container { width: 100%; height: 4px; background: var(--border); border-radius: 10px; margin-bottom: 50px; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; transition: 0.4s ease; }

        /* 결과 화면 */
        .res-header { text-align: center; margin-bottom: 50px; }
        .res-type { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        .res-name { font-size: 3rem; font-weight: 900; margin-bottom: 20px; line-height: 1.2; }
        .res-desc { font-size: 1.1rem; color: var(--text-sub); line-height: 1.6; max-width: 750px; margin: 0 auto; }

        .curation-grid { display: grid; grid-template-columns: 1fr; gap: 40px; text-align: left; }
        .c-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 35px; }
        .c-header { font-size: 1.5rem; font-weight: 900; margin-bottom: 25px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .c-item { margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 16px; border: 1px solid transparent; transition: 0.3s; }
        .c-item:hover { border-color: var(--border); background: rgba(255,255,255,0.04); }
        .c-item h4 { font-size: 1.1rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
        .c-item p { font-size: 0.95rem; color: var(--text-sub); line-height: 1.6; margin-bottom: 15px; }

        /* 링크 버튼 스타일 */
        .link-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 0.85rem; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .link-btn:hover { background: var(--primary); color: var(--bg); border-color: var(--primary); }

        .btn-restart { display: block; width: 100%; padding: 20px; margin-top: 50px; background: var(--primary); color: var(--bg); font-size: 1.1rem; font-weight: 900; text-align: center; border-radius: 16px; cursor: pointer; border: none; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) { .visual-panel { grid-template-columns: 1fr; } .main-title { font-size: 1.8rem; } .res-name { font-size: 2.2rem; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>YOUR ASSET <span>CURATOR</span></h1>
    </nav>

    <div class="container">
        
        <div id="viewScreening" class="view-section active">
            <span class="badge-text">PHASE 1. SCREENING</span>
            <h1 class="main-title">자산을 운용하는 데 있어<br>당신의 가장 확고한 원칙은 무엇인가요?</h1>
            <p class="sub-title">선택에 따라 당신을 심층 분석할 7개의 다면 평가 문항이 준비됩니다.</p>
            
            <div class="options">
                <button class="btn-opt" onclick="setScreening('safe')">
                    🛡️ "원금 손실은 절대 수용 불가."<br>주식의 변동성보다는 예적금이나 국공채 등 안전하고 확실한 곳에 돈을 지키고 싶어요.
                </button>
                <button class="btn-opt" onclick="setScreening('risk')">
                    📈 "하이 리스크, 하이 리턴!"<br>인플레이션을 이기려면 위험을 감수하더라도 주식, ETF 등을 통해 적극적으로 불려야 해요.
                </button>
            </div>
        </div>

        <div id="viewQuiz" class="view-section">
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <div id="quizContent"></div>
        </div>

        <div id="viewResult" class="view-section">
            <div class="res-header">
                <div class="res-type" id="resType">분석 완료</div>
                <h1 class="res-name" id="resName">타이틀</h1>
                <p class="res-desc" id="resDesc">설명</p>
            </div>

            <div class="curation-grid">
                <div class="c-card">
                    <div class="c-header">💰 맞춤형 자산 포트폴리오 제안</div>
                    <div id="resPort"></div>
                </div>
                <div class="c-card">
                    <div class="c-header">📚 인사이트 확장을 위한 큐레이션</div>
                    <div id="resStudy"></div>
                </div>
            </div>

            <button class="btn-restart" onclick="location.reload()">새로운 시나리오 진단하기</button>
        </div>

    </div>

<script>
    let userType = ''; 
    let currentQ = 0;
    let scores = { risk: 0, knowledge: 0, emotion: 0 }; // 위험감수, 지식수준, 감정통제(Adult vs CP)

    // 초정밀 문항 세트 (각 7문항)
    const quizSets = {
        safe: [
            {
                type: 'text', q: "매달 월급이 들어오면 남는 돈을 어떻게 관리하시나요?",
                opts: [
                    { txt: "일단 일반 입출금 통장(월급통장)에 그대로 방치한다.", r: 0, k: 0, e: -5 },
                    { txt: "매일 이자가 붙는 CMA나 파킹통장으로 즉시 이체한다.", r: 2, k: 10, e: 5 }
                ]
            },
            {
                type: 'visual', q: "두 가지 안전 자산 상품이 있습니다. 당신의 선택은?",
                companies: [
                    { name: "A. 시중은행 정기예금", html: `<div class="graph-box"><div class="bar safe" style="height:30px;"></div><div class="bar safe" style="height:50px;"></div><div class="bar safe" style="height:70px;"></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">원금에만 단리 이자 적용</p>`, r: 0, k: 5, e: 0 },
                    { name: "B. 초단기 국고채 펀드", html: `<div class="graph-box"><div class="bar safe" style="height:20px;"></div><div class="bar safe" style="height:40px;"></div><div class="bar safe" style="height:80px;"></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">이자에 이자가 붙는 복리 효과</p>`, r: 3, k: 15, e: 5 }
                ]
            },
            {
                type: 'text', q: "최근 물가가 급격히 오르고 있습니다(인플레이션). 현재 당신의 생각은?",
                opts: [
                    { txt: "물가가 오르든 말든 내 원금이 깎이지 않는 것이 최우선이다.", r: 0, k: 5, e: -5 },
                    { txt: "물가 상승률보다 이자율이 낮으면 사실상 손해이므로 대안을 찾아야 한다.", r: 5, k: 15, e: 10 }
                ]
            },
            {
                type: 'text', q: "한국은행이 기준금리를 대폭 '인하'한다고 발표했습니다. 당신의 행동은?",
                opts: [
                    { txt: "금리가 더 떨어지기 전에 만기가 긴 고금리 예금/적금에 돈을 묶어둔다.", r: 2, k: 15, e: 10 },
                    { txt: "금리 뉴스는 복잡해서 잘 모르겠고 하던 대로 둔다.", r: 0, k: 0, e: -5 }
                ]
            },
            {
                type: 'text', q: "주변 친구들이 코인과 주식으로 돈을 벌었다고 자랑합니다. (FOMO 테스트)",
                opts: [
                    { txt: "불안해져서 나도 모르게 주식 계좌를 만들고 유행하는 종목을 산다.", r: 15, k: 0, e: -15 },
                    { txt: "배는 아프지만, 내가 잘 모르는 분야는 쳐다보지 않는다며 멘탈을 다잡는다.", r: 0, k: 10, e: 15 }
                ]
            },
            {
                type: 'text', q: "다가올 노후 대비, 어떻게 준비하고 계신가요?",
                opts: [
                    { txt: "국민연금과 회사에서 주는 퇴직금만 믿고 있다.", r: 0, k: 5, e: 0 },
                    { txt: "개인형 퇴직연금(IRP)이나 연금저축펀드를 통해 세액공제를 받으며 안전자산을 굴린다.", r: 5, k: 20, e: 10 }
                ]
            },
            {
                type: 'text', q: "신용카드와 체크카드 중 주로 어떤 것을 사용하시나요?",
                opts: [
                    { txt: "할부와 혜택을 위해 신용카드를 주로 사용하며, 가끔 카드값이 부담스럽다.", r: 5, k: -5, e: -10 },
                    { txt: "지출 통제를 위해 체크카드를 쓰거나, 신용카드를 쓰더라도 선결제 룰을 지킨다.", r: 0, k: 10, e: 15 }
                ]
            }
        ],
        risk: [
            {
                type: 'visual', q: "최근 한 달간의 주가 그래프입니다. 당신의 투자 본능이 이끄는 곳은?",
                companies: [
                    { name: "A 기업 (우량 가치주)", html: `<div class="graph-box"><div class="bar safe" style="height:60px;"></div><div class="bar safe" style="height:65px;"></div><div class="bar safe" style="height:62px;"></div><div class="bar safe" style="height:70px;"></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">변동성은 적지만 꾸준한 우상향</p>`, r: 5, k: 10, e: 10 },
                    { name: "B 기업 (바이오/AI 테마주)", html: `<div class="graph-box"><div class="bar volatile" style="height:40px;"></div><div class="bar volatile" style="height:110px;"></div><div class="bar volatile" style="height:30px;"></div><div class="bar volatile" style="height:90px;"></div></div><p style="text-align:center; font-size:0.85rem; color:#94a3b8;">하루에도 20%씩 급등락 반복</p>`, r: 20, k: 0, e: -10 }
                ]
            },
            {
                type: 'visual', q: "두 기업의 핵심 펀더멘털 지표입니다. 장기 투자를 한다면 어디를 고르시겠습니까?",
                companies: [
                    { name: "C 기업 (가치주)", html: `<div class="f-row"><span>PER</span><span class="f-val">5.2</span></div><div class="f-row"><span>PBR</span><span class="f-val">0.8</span></div><div class="f-row"><span>ROE</span><span class="f-val" style="color:#10b981;">12%</span></div>`, r: 5, k: 20, e: 10 },
                    { name: "D 기업 (성장주)", html: `<div class="f-row"><span>PER</span><span class="f-val">120.5</span></div><div class="f-row"><span>PBR</span><span class="f-val">6.5</span></div><div class="f-row"><span>ROE</span><span class="f-val" style="color:#ef4444;">-2%</span></div>`, r: 20, k: -5, e: -5 }
                ]
            },
            {
                type: 'text', q: "미국 연준(Fed)이 인플레이션을 잡기 위해 '금리를 대폭 인상'한다고 합니다. 당신의 포트폴리오 전략은?",
                opts: [
                    { txt: "금리 인상은 주식 시장에 악재이므로, 주식 비중을 줄이고 현금이나 단기 채권 비중을 높인다.", r: -5, k: 20, e: 10 },
                    { txt: "거시 경제(매크로) 흐름은 잘 모르겠고, 어차피 우상향할 테니 무조건 주식 100%를 홀딩한다.", r: 15, k: 0, e: -10 }
                ]
            },
            {
                type: 'text', q: "보유 종목이 시장 악재로 단기간에 -20% 하락했습니다. 당신의 심리와 대처는?",
                opts: [
                    { txt: "시장을 원망하며 스트레스를 받다가, 더 떨어질까 무서워 전량 손절한다. (Child 자아)", r: -10, k: -10, e: -20 },
                    { txt: "기업 본질 가치가 훼손되지 않았다면 싼 값에 살 기회라 생각하고 분할 매수한다. (Adult 자아)", r: 10, k: 15, e: 20 }
                ]
            },
            {
                type: 'text', q: "반대로 내가 산 종목이 갑자기 +30% 급등했습니다. 당신의 선택은?",
                opts: [
                    { txt: "언제 떨어질지 모른다는 불안감에 일단 전량 매도해서 수익을 챙긴다.", r: -5, k: 5, e: -5 },
                    { txt: "급등 사유를 분석하고, 목표 가치에 도달하지 않았다면 홀딩하거나 일부만 분할 매도한다.", r: 10, k: 15, e: 15 }
                ]
            },
            {
                type: 'text', q: "주식이나 ETF에서 발생한 배당금(분배금)이 계좌로 입금되었습니다.",
                opts: [
                    { txt: "꽁돈이 생겼다 생각하고 평소 사고 싶었던 물건을 사거나 외식을 한다.", r: 5, k: -5, e: -10 },
                    { txt: "복리 효과를 극대화하기 위해 그 돈으로 즉시 해당 주식을 재매수(DRIP) 한다.", r: 5, k: 20, e: 15 }
                ]
            },
            {
                type: 'text', q: "주식 투자 수익금에 대한 세금과 절세에 대해 얼마나 알고 계신가요?",
                opts: [
                    { txt: "중개형 ISA 계좌나 연금저축펀드를 활용해 배당소득세 비과세 및 세액공제 혜택을 알차게 받고 있다.", r: 0, k: 20, e: 10 },
                    { txt: "세금은 나중에 생각할 일이고, 일단 일반 위탁계좌에서 편하게 매매하고 있다.", r: 5, k: -5, e: -5 }
                ]
            }
        ]
    };

    let activeQuiz = [];

    function setScreening(type) {
        userType = type;
        activeQuiz = quizSets[type];
        
        document.getElementById('viewScreening').classList.remove('active');
        document.getElementById('viewQuiz').classList.add('active');
        renderQuiz();
    }

    function renderQuiz() {
        const qData = activeQuiz[currentQ];
        const progress = (currentQ / activeQuiz.length) * 100;
        document.getElementById('progressBar').style.width = progress + '%';
        const content = document.getElementById('quizContent');
        
        let html = `
            <span class="badge-text">PHASE 2. DEEP DIVE : Q0${currentQ + 1}</span>
            <h2 class="main-title">${qData.q}</h2>
        `;

        if (qData.type === 'text') {
            html += `<div class="options">`;
            qData.opts.forEach(opt => { html += `<button class="btn-opt" onclick="handleAns(${opt.r}, ${opt.k}, ${opt.e})">${opt.txt}</button>`; });
            html += `</div>`;
        } else if (qData.type === 'visual') {
            html += `<div class="visual-panel">`;
            qData.companies.forEach(comp => {
                html += `
                    <div class="visual-card" onclick="handleAns(${comp.r}, ${comp.k}, ${comp.e})">
                        <div class="v-title">${comp.name}</div>
                        ${comp.html}
                    </div>
                `;
            });
            html += `</div>`;
        }
        content.innerHTML = html;
    }

    function handleAns(r, k, e) {
        scores.risk += r; scores.knowledge += k; scores.emotion += e;
        currentQ++;
        if(currentQ < activeQuiz.length) renderQuiz();
        else showResult();
    }

    // 4. 결과 분석 및 맞춤형 큐레이션 (콘텐츠 다이렉트 링크 포함)
    function showResult() {
        document.getElementById('viewQuiz').classList.remove('active');
        document.getElementById('viewResult').classList.add('active');

        const typeLabel = document.getElementById('resType');
        const nameLabel = document.getElementById('resName');
        const descLabel = document.getElementById('resDesc');
        const portArea = document.getElementById('resPort');
        const studyArea = document.getElementById('resStudy');

        // [결과 1] 안전형 (예적금/방어형)
        if (userType === 'safe') {
