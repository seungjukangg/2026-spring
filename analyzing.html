<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The mirror of the s(e)oul</title>
    <!-- 세리프 폰트와 산세리프 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Noto Sans KR', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            /* 스크롤을 내릴 수 있도록 충분한 여백 제공 */
            height: 200vh; 
            overflow-x: hidden;
            font-family: var(--font-sans);
        }

        /* ------------------------------------
           Intro Section (첫 화면: 눈 + 중앙 로고)
        ------------------------------------ */
        .intro-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 20; /* 처음에는 가장 위에 위치 */
            background-color: var(--bg-color);
            transition: opacity 0.1s ease-out;
        }

        /* 첨부해주신 이미지(image_fe4efa.jpg)를 위아래로 잘라서 배치 */
        .eye-image {
            width: 100%;
            height: 25vh; /* 원본 이미지의 눈 부분만 보이도록 높이 제한 */
            background-image: url('image_fe4efa.jpg'); /* 사용자님의 이미지 파일명 연동 */
            background-size: cover;
            background-repeat: no-repeat;
            /* 흑백 모드를 원하셨으므로 안전장치로 그레이스케일 적용 */
            filter: grayscale(100%); 
        }

        /* 상단 눈은 이미지의 맨 위쪽을 보여줌 */
        .eye-top {
            background-position: center top;
        }

        /* 하단 눈은 이미지의 맨 아래쪽을 보여줌 */
        .eye-bottom {
            background-position: center bottom;
        }

        /* 중앙 텍스트 영역 */
        .center-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .main-title {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 7vw, 7rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.1;
            text-transform: uppercase;
            margin: 20px 0;
        }

        .main-title span {
            font-style: italic;
            color: #aaaaaa;
        }

        .sub-text {
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            color: #cccccc;
            font-family: var(--font-sans);
            text-transform: uppercase;
        }

        /* ------------------------------------
           Action Section (스크롤 후 나타나는 클릭 버튼 영역)
        ------------------------------------ */
        .action-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 10; /* 초기에는 로고 뒤에 위치 */
            opacity: 0; /* 초기에는 완전히 투명함 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* 버튼이 잘 보이도록 은은한 배경 효과 */
            background: radial-gradient(circle at center, #111111 0%, #000000 100%);
            transition: opacity 0.1s ease-out;
            pointer-events: none; /* 투명할 때는 클릭 방지 */
        }

        .button-container {
            display: flex;
            gap: 40px;
        }

        .action-btn {
            display: inline-block;
            font-family: var(--font-serif);
            font-size: 1.5rem;
            color: #ffffff;
            text-decoration: none;
            padding: 20px 50px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            letter-spacing: 0.05em;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            background: transparent;
            cursor: pointer;
            text-transform: lowercase;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
        }

        .action-btn:hover {
            color: #000000;
            border-color: #ffffff;
        }

        .action-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        @media (max-width: 768px) {
            .button-container {
                flex-direction: column;
                gap: 20px;
            }
        }
        /* --- 새로 추가되는 CSS --- */
        
        /* 1. 첫 화면 로고 뒤 반투명 배경 (image_1ccf77.jpg) */
        .intro-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_1ccf77.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15; /* 반투명 정도 (숫자 조절 가능) */
            z-index: -1;
            pointer-events: none;
        }

        /* 2. 설문 & 결과 페이지 컨테이너 */
        .survey-container, .result-container, .transition-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: var(--bg-color);
            z-index: 100;
            display: none; /* 기본은 숨김 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            overflow-y: auto;
            padding: 20px;
        }

        .survey-container.active, .result-container.active, .transition-screen.active {
            display: flex;
            opacity: 1;
        }

        /* 3. 설문 UI (MBTI 스타일) */
        .progress-bar {
            position: absolute;
            top: 0; left: 0;
            height: 4px;
            background-color: #ffffff;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            text-align: center;
            margin-bottom: 50px;
            max-width: 800px;
        }

        .question-text {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            margin-bottom: 40px;
            word-break: keep-all;
        }

        .options-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .option-btn {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: #fff;
            background-color: rgba(255,255,255,0.1);
        }

        /* 4. 중간 트랜지션 화면 */
        .transition-text {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-style: italic;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* 5. 결과 페이지 UI */
        .result-content {
            max-width: 800px;
            width: 100%;
            text-align: center;
            padding: 50px 20px;
        }

        .archetype-title {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .archetype-sub {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
            font-style: italic;
        }

        .archetype-desc {
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Axis 축 디자인 */
        .axis-container {
            margin-bottom: 40px;
            text-align: left;
            background: #111;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .axis-row {
            margin-bottom: 25px;
        }

        .axis-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .axis-line {
            position: relative;
            width: 100%;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
        }

        .axis-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: left 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

    <!-- 첫 화면 (스크롤 시 사라짐) -->
    <div class="intro-section" id="introSection">
        <!-- 상단 눈 이미지 -->
        <div class="eye-image eye-top"></div>
        
        <!-- 중앙 텍스트 -->
        <div class="center-content">
            <p class="sub-text">Analyzing one's soul, connecting to Seoul.</p>
            <h1 class="main-title">The mirror of<br>the s<span>(e)</span>oul</h1>
            <p class="sub-text">Take in the soul of Seoul.</p>
        </div>

        <!-- 하단 눈 이미지 -->
        <div class="eye-image eye-bottom"></div>
    </div>

    <!-- 버튼 영역 (스크롤 시 나타남) -->
    <div class="action-section" id="actionSection">
        <div class="button-container">
            <a href="#설문" class="action-btn">mirroring my soul</a>
            <a href="#추천" class="action-btn">searching my seoul</a>
        </div>
    </div>

    <!-- 스크롤 이벤트 자바스크립트 -->
    <script>
        const introSection = document.getElementById('introSection');
        const actionSection = document.getElementById('actionSection');

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            
            // 화면의 절반 정도 내렸을 때 전환되도록 계산
            let scrollRatio = scrollY / (windowHeight * 0.5);
            if (scrollRatio > 1) scrollRatio = 1;

            // 1. 눈 이미지와 중앙 로고는 스크롤할수록 투명해짐 (사라짐)
            introSection.style.opacity = 1 - scrollRatio;
            
            // 2. 버튼 섹션은 스크롤할수록 선명해짐 (나타남)
            actionSection.style.opacity = scrollRatio;

            // 버튼 섹션이 어느 정도 나타났을 때(로고가 흐려졌을 때) 클릭 활성화 및 위로 올림
            if (scrollRatio > 0.5) {
                actionSection.style.pointerEvents = 'auto';
                actionSection.style.zIndex = '30'; // 버튼을 맨 앞으로 가져옴
            } else {
                actionSection.style.pointerEvents = 'none';
                actionSection.style.zIndex = '10'; // 로고를 다시 맨 앞으로
            }
        });
    </script>

</body>
</html>
