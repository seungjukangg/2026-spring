<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The mirror of the s(e)oul</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Noto Sans KR', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            /* 스크롤이 가능하도록 바디 높이를 200vh로 설정 */
            height: 200vh; 
            overflow-x: hidden;
            font-family: var(--font-sans);
        }

        /* ------------------------------------
           Fixed Center Logo (스크롤 시 고정되는 중앙 텍스트)
        ------------------------------------ */
        .fixed-center-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            text-align: center;
            width: 100%;
            pointer-events: none; /* 클릭 이벤트가 아래 버튼으로 통과되도록 함 */
        }

        .main-title {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 7vw, 7rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.1;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .main-title span {
            font-style: italic;
            color: #aaaaaa; /* s(e)oul 의 (e)를 살짝 강조 */
        }

        /* ------------------------------------
           Section 1: Eyes Background (첫 화면의 눈 이미지 영역)
        ------------------------------------ */
        .eyes-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            padding: 4vh 0;
            transition: opacity 0.1s ease-out;
        }

        /* 눈 이미지 효과 (임시 플레이스홀더를 흑백+대비 강하게 처리) */
        .eye-image {
            width: 100%;
            height: 28vh;
            background-image: url('https://images.unsplash.com/photo-1512413913424-c146e22f87ee?q=80&w=2000&auto=format&fit=crop'); /* 눈 느낌을 내는 다크한 이미지 */
            background-size: cover;
            background-position: center 30%;
            filter: grayscale(100%) contrast(150%) brightness(0.6);
        }

        .eye-top {
            border-bottom: 1px solid #333;
        }

        .eye-bottom {
            border-top: 1px solid #333;
            transform: scaleY(-1); /* 아래쪽 눈은 반전시켜 대칭미 강조 */
        }

        .sub-text {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: #888;
            margin: 15px 0;
            font-family: var(--font-sans);
        }

        /* ------------------------------------
           Section 2: Action Buttons (스크롤 후 나타나는 영역)
        ------------------------------------ */
        .action-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 20;
            opacity: 0; /* 초기엔 숨김 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* 서울의 밤거리 느낌의 다크한 그라데이션 배경 */
            background: radial-gradient(circle at center, rgba(30,30,30,0.9) 0%, rgba(0,0,0,1) 100%);
            transition: opacity 0.1s ease-out;
            pointer-events: none; /* 투명할 때는 클릭 안되게 방지 */
        }

        .action-section.active {
            pointer-events: auto; /* 불투명해지면 클릭 활성화 */
        }

        .button-container {
            display: flex;
            gap: 40px;
            margin-top: 15vh; /* 중앙 고정 로고 아래에 위치하도록 여백 */
        }

        .action-btn {
            display: inline-block;
            font-family: var(--font-serif);
            font-size: 1.2rem;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px; /* 우아한 타원형 버튼 */
            letter-spacing: 0.05em;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            background: transparent;
            cursor: pointer;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #ffffff;
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
        }

        .action-btn:hover {
            color: #000000;
            border-color: #ffffff;
        }

        .action-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        @media (max-width: 768px) {
            .button-container {
                flex-direction: column;
                gap: 20px;
                margin-top: 20vh;
            }
            .action-btn {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="fixed-center-logo">
        <h1 class="main-title">The mirror of<br>the s<span>(e)</span>oul</h1>
    </div>

    <div class="eyes-section" id="eyesSection">
        <div>
            <div class="eye-image eye-top"></div>
            <p class="sub-text">You can close your lips, but you can never hide the story your eyes tell.</p>
        </div>
        
        <div>
            <p class="sub-text">A kind soul shines through the eyes, finding its hidden place in the city.</p>
            <div class="eye-image eye-bottom"></div>
        </div>
    </div>

    <div class="action-section" id="actionSection">
        <div class="button-container">
            <a href="#설문지" class="action-btn">mirroring my soul</a>
            <a href="#장소추천" class="action-btn">searching my seoul</a>
        </div>
    </div>

    <script>
        const eyesSection = document.getElementById('eyesSection');
        const actionSection = document.getElementById('actionSection');

        window.addEventListener('scroll', () => {
            // 현재 스크롤 위치
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            
            // 화면을 절반(0.5vh) 정도 내렸을 때 완전히 전환되도록 계산
            let scrollRatio = scrollY / (windowHeight * 0.6);
            if (scrollRatio > 1) scrollRatio = 1;

            // 눈 이미지 섹션은 서서히 사라짐
            eyesSection.style.opacity = 1 - scrollRatio;
            
            // 버튼 섹션은 서서히 나타남
            actionSection.style.opacity = scrollRatio;

            // 버튼 섹션이 어느 정도 나타났을 때만 클릭 활성화
            if (scrollRatio > 0.5) {
                actionSection.classList.add('active');
            } else {
                actionSection.classList.remove('active');
            }
        });
    </script>

</body>
</html>
