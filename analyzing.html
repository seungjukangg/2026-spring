<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOT TWIST | 종합 자산 & 투자 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #111113;
            --primary: #ffffff;
            --accent: #22c55e; /* 자산의 성장을 상징하는 그린 */
            --accent-glow: rgba(34, 197, 94, 0.2);
            --safe: #3b82f6; /* 안전자산 블루 */
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 60%);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* 내비게이션 */
        .navbar { padding: 25px 40px; display: flex; justify-content: center; background: rgba(5,5,5,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; }
        .navbar h1 span { color: var(--accent); }

        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        /* 공통 뷰 트랜지션 */
        .view-section { display: none; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .view-section.active { display: block; }

        .badge-text { font-size: 0.85rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        .main-title { font-size: 2.2rem; font-weight: 900; line-height: 1.35; margin-bottom: 20px; word-break: keep-all; }
        .sub-title { font-size: 1.1rem; color: var(--text-sub); margin-bottom: 40px; font-weight: 300; }

        /* 버튼형 옵션 */
        .options { display: flex; flex-direction: column; gap: 16px; }
        .btn-opt {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text-main);
            padding: 24px 30px; border-radius: 16px; font-size: 1.1rem; font-weight: 500; text-align: left;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-opt:hover { background: rgba(34, 197, 94, 0.05); border-color: var(--accent); transform: translateX(5px); }

        /* 시각화 패널 (그래프 & 재무제표) */
        .visual-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .visual-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; cursor: pointer; transition: 0.3s; }
        .visual-card:hover { border-color: var(--accent); box-shadow: 0 10px 30px var(--accent-glow); transform: translateY(-5px); }
        .v-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 15px; color: var(--primary); text-align: center; }

        /* CSS 미니 그래프 */
        .graph-box { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 120px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .bar { width: 30px; background: var(--accent); border-radius: 4px 4px 0 0; transition: 0.5s; }
        .bar.volatile { background: #ef4444; }
        .bar.safe { background: var(--safe); }

        /* 재무제표 텍스트 */
        .f-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }
        .f-row:last-child { border-bottom: none; }
        .f-val { font-weight: 800; font-family: monospace; }

        /* 결과 화면 */
        .res-header { text-align: center; margin-bottom: 50px; }
        .res-type { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
        .res-name { font-size: 3rem; font-weight: 900; margin-bottom: 20px; line-height: 1.2; }
        .res-desc { font-size: 1.1rem; color: var(--text-sub); line-height: 1.6; max-width: 700px; margin: 0 auto; }

        .curation-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; text-align: left; }
        .c-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px; }
        .c-icon { font-size: 2rem; margin-bottom: 15px; }
        .c-header { font-size: 1.3rem; font-weight: 900; margin-bottom: 20px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .c-item { margin-bottom: 15px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; }
        .c-item h4 { font-size: 1.05rem; font-weight: 800; color: var(--accent); margin-bottom: 5px; }
        .c-item.safe h4 { color: var(--safe); } /* 안전자산은 블루컬러 */
        .c-item p { font-size: 0.9rem; color: var(--text-sub); }

        .btn-restart { display: block; width: 100%; padding: 20px; margin-top: 50px; background: var(--primary); color: var(--bg); font-size: 1.1rem; font-weight: 900; text-align: center; border-radius: 16px; cursor: pointer; border: none; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) { .visual-panel { grid-template-columns: 1fr; } .main-title { font-size: 1.8rem; } .res-name { font-size: 2.2rem; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>PLOT<span>TWIST</span> ASSET</h1>
    </nav>

    <div class="container">
        
        <div id="viewScreening" class="view-section active">
            <span class="badge-text">STEP 1. INVESTMENT SCREENING</span>
            <h1 class="main-title">현재 자산을 운용하는 데 있어<br>가장 중요하게 생각하는 원칙은 무엇인가요?</h1>
            <p class="sub-title">당신의 성향에 맞춰 진단 문항이 다르게 구성됩니다.</p>
            
            <div class="options">
                <button class="btn-opt" onclick="setScreening('safe')">
                    🛡️ "원금 손실은 절대 싫어요."<br>주식 같은 위험 자산보다는 예적금이나 안전한 곳에 돈을 묶어두고 싶어요.
                </button>
                <button class="btn-opt" onclick="setScreening('risk')">
                    📈 "하이 리스크, 하이 리턴!"<br>원금 손실의 위험을 감수하더라도 주식, ETF 등을 통해 자산을 적극적으로 불리고 싶어요.
                </button>
            </div>
        </div>

        <div id="viewQuiz" class="view-section">
            <div id="quizContent"></div>
        </div>

        <div id="viewResult" class="view-section">
            <div class="res-header">
                <div class="res-type" id="resType">분석 완료</div>
                <h1 class="res-name" id="resName">타이틀</h1>
                <p class="res-desc" id="resDesc">설명</p>
            </div>

            <div class="curation-grid">
                <div class="c-card">
                    <div class="c-icon">💰</div>
                    <div class="c-header">맞춤형 자산 포트폴리오</div>
                    <div id="resPort"></div>
                </div>
                <div class="c-card">
                    <div class="c-icon">📚</div>
                    <div class="c-header">추천 공부 & 로드맵</div>
                    <div id="resStudy"></div>
                </div>
            </div>

            <button class="btn-restart" onclick="location.reload()">테스트 다시 하기</button>
        </div>

    </div>

<script>
    let userType = ''; 
    let currentQ = 0;
    let scores = { risk: 0, knowledge: 0 };

    // 퀴즈 세트 (안전형 vs 공격형 분리)
    const quizSets = {
        safe: [
            {
                type: 'text',
                q: "금리가 오르고 있는 시기입니다. 당신의 예비 자금(비상금)을 어디에 두시겠습니까?",
                opts: [
                    { txt: "언제든 뺄 수 있지만 이자가 쏠쏠한 'CMA 파킹통장'", r: 2, k: 10 },
                    { txt: "무조건 동네 은행의 일반 '입출금 통장'", r: 0, k: 0 },
                    { txt: "조금이라도 이자를 더 주는 '초단기 국고채 펀드'", r: 3, k: 15 }
                ]
            },
            {
                type: 'visual',
                q: "다음 두 가지 안전 자산 그래프가 있습니다. 어디에 가입하시겠습니까?",
                companies: [
                    { name: "A. 정기예금 (단리)", html: `<div class="graph-box"><div class="bar safe" style="height:30px;"></div><div class="bar safe" style="height:50px;"></div><div class="bar safe" style="height:70px;"></div><div class="bar safe" style="height:90px;"></div></div><p style="text-align:center; font-size:0.9rem; color:#94a3b8;">원금에만 일정한 이자가 붙음</p>`, r: 0, k: 5 },
                    { name: "B. 배당주 펀드 (복리)", html: `<div class="graph-box"><div class="bar safe" style="height:20px;"></div><div class="bar safe" style="height:35px;"></div><div class="bar safe" style="height:60px;"></div><div class="bar safe" style="height:100px;"></div></div><p style="text-align:center; font-size:0.9rem; color:#94a3b8;">이자에 이자가 붙어 곡선 상승</p>`, r: 5, k: 15 }
                ]
            }
        ],
        risk: [
            {
                type: 'visual',
                q: "최근 한 달간의 주가 그래프입니다. 당신의 투자 본능이 이끄는 곳은?",
                companies: [
                    { name: "A 기업 (우량 가치주)", html: `<div class="graph-box"><div class="bar safe" style="height:60px;"></div><div class="bar safe" style="height:65px;"></div><div class="bar safe" style="height:62px;"></div><div class="bar safe" style="height:70px;"></div></div><p style="text-align:center; font-size:0.9rem; color:#94a3b8;">변동성은 적지만 꾸준한 우상향</p>`, r: 5, k: 10 },
                    { name: "B 기업 (바이오/AI 테마주)", html: `<div class="graph-box"><div class="bar volatile" style="height:40px;"></div><div class="bar volatile" style="height:110px;"></div><div class="bar volatile" style="height:30px;"></div><div class="bar volatile" style="height:90px;"></div></div><p style="text-align:center; font-size:0.9rem; color:#94a3b8;">하루에도 20%씩 급등락 반복</p>`, r: 20, k: 0 }
                ]
            },
            {
                type: 'visual',
                q: "두 기업의 재무제표 지표입니다. 장기 투자를 한다면 어디를 고르시겠습니까?",
                companies: [
                    { name: "C 기업 (저평가 상태)", html: `<div class="f-row"><span>PER</span><span class="f-val">5.2</span></div><div class="f-row"><span>PBR</span><span class="f-val">0.8</span></div><div class="f-row"><span>ROE</span><span class="f-val" style="color:#22c55e;">12%</span></div>`, r: 5, k: 20 },
                    { name: "D 기업 (고평가 상태)", html: `<div class="f-row"><span>PER</span><span class="f-val">120.5</span></div><div class="f-row"><span>PBR</span><span class="f-val">6.5</span></div><div class="f-row"><span>ROE</span><span class="f-val" style="color:#ef4444;">-2%</span></div>`, r: 20, k: 0 }
                ]
            },
            {
                type: 'text',
                q: "보유 종목이 시장 악재로 -20% 하락했습니다. 당신의 심리 상태와 대처는?",
                opts: [
                    { txt: "기업 가치는 그대로니 할인된 가격이라 생각하고 추가 매수한다. (Adult 자아)", r: 10, k: 15 },
                    { txt: "불안해서 일이 손에 안 잡히고 일단 전량 매도해서 도망친다. (Child 자아)", r: -10, k: 0 },
                    { txt: "오를 때까지 어플을 지우고 수면제를 먹는다. (회피형)", r: 0, k: 5 }
                ]
            }
        ]
    };

    let activeQuiz = [];

    // 1. 스크리닝 분기 처리
    function setScreening(type) {
        userType = type;
        activeQuiz = quizSets[type];
        
        document.getElementById('viewScreening').classList.remove('active');
        document.getElementById('viewQuiz').classList.add('active');
        renderQuiz();
    }

    // 2. 퀴즈 렌더링
    function renderQuiz() {
        const qData = activeQuiz[currentQ];
        const content = document.getElementById('quizContent');
        
        let html = `
            <span class="badge-text">QUESTION 0${currentQ + 1}</span>
            <h2 class="main-title">${qData.q}</h2>
        `;

        if (qData.type === 'text') {
            html += `<div class="options">`;
            qData.opts.forEach(opt => {
                html += `<button class="btn-opt" onclick="handleAns(${opt.r}, ${opt.k})">${opt.txt}</button>`;
            });
            html += `</div>`;
        } 
        else if (qData.type === 'visual') {
            html += `<div class="visual-panel">`;
            qData.companies.forEach(comp => {
                html += `
                    <div class="visual-card" onclick="handleAns(${comp.r}, ${comp.k})">
                        <div class="v-title">${comp.name}</div>
                        ${comp.html}
                    </div>
                `;
            });
            html += `</div>`;
        }

        content.innerHTML = html;
    }

    function handleAns(r, k) {
        scores.risk += r;
        scores.knowledge += k;

        currentQ++;
        if(currentQ < activeQuiz.length) {
            renderQuiz();
        } else {
            showResult();
        }
    }

    // 3. 결과 리포트 (다양한 금융상품 포괄)
    function showResult() {
        document.getElementById('viewQuiz').classList.remove('active');
        document.getElementById('viewResult').classList.add('active');

        const typeLabel = document.getElementById('resType');
        const nameLabel = document.getElementById('resName');
        const descLabel = document.getElementById('resDesc');
        const portArea = document.getElementById('resPort');
        const studyArea = document.getElementById('resStudy');

        // 소심/안전형 (스크리닝 'safe' 선택자)
        if (userType === 'safe') {
            typeLabel.innerText = "안전제일 철통방어형 (Child Ego)";
            nameLabel.innerText = "원금은 내 목숨!\n'예적금 수호자'";
            descLabel.innerText = "손실에 대한 두려움(Child 자아)이 크기 때문에, 무리한 주식 투자보다는 자산을 안전하게 지키면서 이자를 차곡차곡 쌓아가는 전략이 몸에 맞습니다. 하지만 물가 상승률(인플레이션)을 방어하기 위해 약간의 금융 센스가 필요합니다.";
            
            portArea.innerHTML = `
                <div class="c-item safe">
                    <h4>1. 고금리 예금 & 적금 (기본기)</h4>
                    <p>제1금융권뿐만 아니라 예금자보호(5천만원)가 되는 저축은행의 고금리 특판 상품을 적극 활용해 시드머니를 모으세요.</p>
                </div>
                <div class="c-item safe">
                    <h4>2. CMA 파킹통장 & 초단기 금리형 ETF (KODEX KOFR)</h4>
                    <p>일반 입출금 통장에 돈을 썩히지 마세요. 매일매일 이자가 붙는 파킹통장이나 무손실에 가까운 초단기 금리형 펀드에 비상금을 보관하세요.</p>
                </div>
                <div class="c-item safe">
                    <h4>3. 국공채 펀드 / 원금보장형 ELB</h4>
                    <p>주식보다는 국가가 망하지 않는 한 돈을 돌려받는 국공채 펀드나 증권사의 원금보장형 상품이 당신의 심리적 안정에 좋습니다.</p>
                </div>
            `;
            studyArea.innerHTML = `
                <div class="c-item">
                    <h4>📖 추천 도서: 부자 아빠 가난한 아빠 (로버트 기요사키)</h4>
                    <p>저축만으로는 부자가 될 수 없는 자본주의의 기본 원리를 깨우쳐 줄 입문서입니다.</p>
                </div>
                <div class="c-item">
                    <h4>📺 추천 큐레이션: 예적금 금리 비교 플랫폼</h4>
                    <p>'마이뱅크'나 '금융상품한눈에' 사이트를 통해 매달 가장 이자를 많이 주는 은행을 찾는 습관을 들이세요.</p>
                </div>
            `;
        } 
        // 공격형 중 지식이 부족한 불나방형
        else if (userType === 'risk' && scores.knowledge < 25) {
            typeLabel.innerText = "감정적 하이리스커 (Controlling Parent)";
            nameLabel.innerText = "지식보다 느낌이 앞서는\n'불나방 투자자'";
            descLabel.innerText = "수익에 대한 열망은 크지만, 시장을 예측할 수 있다는 통제적 자아(CP)에 빠지기 쉽습니다. 재무제표 분석보다는 테마주와 차트에 끌려 롤러코스터를 타는 멘탈을 다스려야 합니다.";
            
            portArea.innerHTML = `
                <div class="c-item">
                    <h4>1. 배당 성장 ETF (예: SCHD, KODEX 고배당)</h4>
                    <p>개별 종목의 급등락에 일희일비하지 않도록, 주가와 상관없이 매달 계좌에 현금이 꽂히는 배당 ETF 비중을 늘리세요.</p>
                </div>
                <div class="c-item">
                    <h4>2. S&P 500 시장 지수 추종 ETF</h4>
                    <p>내가 기업을 분석할 능력이 부족하다면, 자본주의 최강국 미국의 상위 500개 기업 전체에 분산 투자하는 것이 가장 현명합니다.</p>
                </div>
            `;
            studyArea.innerHTML = `
                <div class="c-item">
                    <h4>📖 필독서: 돈의 심리학 (모건 하우절)</h4>
                    <p>투자는 지능이 아니라 멘탈과 태도입니다. 흔들리는 마음을 잡아줄 최고의 처방전입니다.</p>
                </div>
                <div class="c-item">
                    <h4>📺 추천 영상: 슈카월드 (거시 경제 편)</h4>
                    <p>급등주 따라다니기를 멈추고, 전 세계의 돈이 어떻게 흘러가는지 경제의 큰 숲을 보는 눈을 기르세요.</p>
                </div>
            `;
        } 
        // 지식과 멘탈이 갖춰진 이성적 가치투자자
        else {
            typeLabel.innerText = "이성적 가치 투자자 (Adult Ego)";
            nameLabel.innerText = "데이터로 시장을 꿰뚫는\n'냉철한 분석가'";
            descLabel.innerText = "PER, PBR, ROE 등 기업의 펀더멘털을 정확히 이해하고 있습니다. 폭락장에서도 감정에 휩쓸리지 않는 어른(Adult) 자아를 유지하며, 위기를 기회로 바꾸는 능력이 탁월합니다.";
            
            portArea.innerHTML = `
                <div class="c-item">
