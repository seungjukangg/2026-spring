<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOT TWIST | 전국구 라이프 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b; --surface: #18181b; --primary: #ffffff;
            --accent: #10b981; /* Emerald */ --glow: #3b82f6; /* Blue Glow */
            --text-main: #f8fafc; --text-sub: #94a3b8; --border: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
            background-image: radial-gradient(circle at 100% 0%, rgba(16,185,129,0.1) 0%, transparent 40%),
                              radial-gradient(circle at 0% 100%, rgba(59,130,246,0.1) 0%, transparent 40%);
            min-height: 100vh; padding-bottom: 100px;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }

        /* 타이포그래피 & 로고 */
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; position: absolute; top: 40px; left: 40px; }
        .logo span { color: var(--accent); }

        /* 메인 대시보드 */
        header { text-align: center; margin: 80px 0 60px 0; }
        header h1 { font-size: 4rem; font-weight: 900; letter-spacing: -2px; line-height: 1.1; margin-bottom: 20px; }
        header p { font-size: 1.2rem; color: var(--text-sub); font-weight: 300; }

        .search-engine {
            background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(16px);
            border: 1px solid var(--border); border-radius: 24px; padding: 40px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .input-group label { font-size: 0.85rem; font-weight: 700; color: #a1a1aa; letter-spacing: 0.5px; }
        
        select, input {
            background: #000000; border: 1px solid var(--border); color: white;
            padding: 18px 20px; border-radius: 14px; font-size: 1rem; outline: none; transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }

        .btn-dive {
            grid-column: 1 / -1; background: var(--text-main); color: var(--bg);
            border: none; padding: 20px; border-radius: 14px; font-size: 1.2rem; font-weight: 900;
            cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase;
        }
        .btn-dive:hover { background: var(--accent); color: white; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16,185,129,0.3); }

        /* 로딩 씬 */
        #loader { display: none; text-align: center; padding: 100px 0; }
        .spinner {
            width: 60px; height: 60px; border: 3px solid var(--border); border-top: 3px solid var(--accent);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 결과 화면 */
        #results { display: none; margin-top: 60px; }
        .result-title { font-size: 2rem; font-weight: 900; margin-bottom: 40px; border-left: 4px solid var(--accent); padding-left: 15px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            overflow: hidden; transition: 0.4s; position: relative; display: flex; flex-direction: column;
            text-decoration: none; color: inherit;
        }
        .card:hover { transform: translateY(-8px); border-color: rgba(255,255,255,0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

        .card-img { width: 100%; height: 220px; background-size: cover; background-position: center; opacity: 0.8; transition: 0.4s; }
        .card:hover .card-img { opacity: 1; }

        .card-body { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .badge { background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; color: var(--accent); }
        .source { font-size: 0.75rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }

        .title { font-size: 1.4rem; font-weight: 800; line-height: 1.4; margin-bottom: 10px; }
        .info { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 6px; }

        .btn-link {
            margin-top: 25px; padding: 15px; background: #000; border: 1px solid var(--border);
            border-radius: 10px; text-align: center; font-weight: 700; font-size: 0.9rem; transition: 0.3s;
        }
        .card:hover .btn-link { background: var(--text-main); color: var(--bg); border-color: var(--text-main); }

        @media (max-width: 768px) {
            header h1 { font-size: 2.5rem; }
            .search-engine { grid-template-columns: 1fr; padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="logo">PLOT<span>TWIST</span></div>

    <div class="container">
        <header>
            <h1>우연한 발견,<br>완벽한 시나리오</h1>
            <p>전국 17개 시/도, 공공 도서관부터 숨겨진 팝업까지 모든 가능성을 탐색합니다.</p>
        </header>

        <div class="search-engine">
            <div class="input-group">
                <label>어떤 반전을 원하시나요?</label>
                <select id="catInput">
                    <option value="all">전체 탐색 (Surprise Me)</option>
                    <option value="popup">✨ 브랜드 팝업 / 상설 전시</option>
                    <option value="library">📚 시립도서관 / 문화센터 특강</option>
                    <option value="local">🎪 지역 축제 / 플리마켓</option>
                    <option value="indie">🎵 인디 공연 / 예술의전당</option>
                    <option value="active">🏃 야간 크루 / 이색 체육활동</option>
                    <option value="mind">🧘 템플스테이 / 심리 명상</option>
                </select>
            </div>
            <div class="input-group">
                <label>날짜 선택</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-group">
                <label>시/도 (전국 17개)</label>
                <select id="provInput" onchange="loadDistricts()">
                    <option value="">시/도 선택</option>
                    <option value="서울">서울특별시</option><option value="부산">부산광역시</option><option value="대구">대구광역시</option><option value="인천">인천광역시</option><option value="광주">광주광역시</option><option value="대전">대전광역시</option><option value="울산">울산광역시</option><option value="세종">세종특별자치시</option><option value="경기">경기도</option><option value="강원">강원특별자치도</option><option value="충북">충청북도</option><option value="충남">충청남도</option><option value="전북">전북특별자치도</option><option value="전남">전라남도</option><option value="경북">경상북도</option><option value="경남">경상남도</option><option value="제주">제주특별자치도</option>
                </select>
            </div>
            <div class="input-group">
                <label>세부 시/구/군</label>
                <select id="distInput"><option value="">지역을 먼저 선택하세요</option></select>
            </div>
            <button class="btn-dive" onclick="runSimulation()">데이터베이스 딥 다이브</button>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <h3 style="font-weight:300; letter-spacing:1px; color:var(--text-sub);" id="loadingText">전국 공공데이터 API 및 민간 인프라 스캔 중...</h3>
        </div>

        <div id="results">
            <h2 class="result-title">당신을 위한 큐레이션 리포트</h2>
            <div class="grid" id="grid"></div>
        </div>
    </div>

<script>
    // 1. 전국 17개 시/도 완벽 데이터
    const koreaMap = {
        "서울": ["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
        "부산": ["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","강서구","연제구","수영구","사상구","기장군"],
        "대구": ["중구","동구","서구","남구","북구","수성구","달서구","달성군","군위군"],
        "인천": ["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
        "광주": ["동구","서구","남구","북구","광산구"],
        "대전": ["동구","중구","서구","유성구","대덕구"],
        "울산": ["중구","남구","동구","북구","울주군"],
        "세종": ["세종특별자치시"],
        "경기": ["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","동두천시","안산시","고양시","과천시","구리시","남양주시","오산시","시흥시","군포시","의왕시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","양주시","포천시","여주시","연천군","가평군","양평군"],
        "강원": ["춘천시","원주시","강릉시","동해시","태백시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],
        "충북": ["청주시","충주시","제천시","보은군","옥천군","영동군","증평군","진천군","괴산군","음성군","단양군"],
        "충남": ["천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시","금산군","부여군","서천군","청양군","홍성군","예산군","태안군"],
        "전북": ["전주시","군산시","익산시","정읍시","남원시","김제시","완주군","진안군","무주군","장수군","임실군","순창군","고창군","부안군"],
        "전남": ["목포시","여수시","순천시","나주시","광양시","담양군","곡성군","구례군","고흥군","보성군","화순군","장흥군","강진군","해남군","영암군","무안군","함평군","영광군","장성군","완도군","진도군","신안군"],
        "경북": ["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"],
        "경남": ["창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시","의령군","함안군","창녕군","고성군","남해군","하동군","산청군","함양군","거창군","합천군"],
        "제주": ["제주시","서귀포시"]
    };

    function loadDistricts() {
        const prov = document.getElementById('provInput').value;
        const dist = document.getElementById('distInput');
        dist.innerHTML = '<option value="">구/시/군 선택</option>';
        if(prov && koreaMap[prov]) {
            koreaMap[prov].forEach(d => dist.innerHTML += `<option value="${d}">${d}</option>`);
        }
    }

    function runSimulation() {
        const cat = document.getElementById('catInput').value;
        const date = document.getElementById('dateInput').value;
        const prov = document.getElementById('provInput').value;
        const dist = document.getElementById('distInput').value;

        if(!date || !prov || !dist) return alert("날짜와 지역(시/도, 구/시/군)을 모두 선택해주세요.");

        document.getElementById('results').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('loadingText').innerText = `${prov} ${dist} 일대 공공데이터베이스 스캔 중...`;

        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            generateDynamicResults(cat, date, prov, dist);
        }, 1500);
    }

    // 2. 동적 데이터 생성 엔진 (핵심 마법)
    // 하드코딩된 데이터베이스가 없어도, 선택한 지역과 카테고리에 맞춰 가상의 결과를 만들어냅니다.
    function generateDynamicResults(cat, date, prov, dist) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        // 카테고리별 템플릿 풀
        const templates = {
            popup: [
                { title: `로컬 크리에이터 팝업 마켓`, source: `${dist} 문화재단`, img: "https://images.unsplash.com/photo-1554188248-986adbb73be4?w=800", badge: "POP-UP" },
                { title: `인더스트리얼 컨셉 브랜드 전시`, source: `민간 문화공간 연동`, img: "https://images.unsplash.com/photo-1536924940846-227afb31e2a5?w=800", badge: "EXHIBITION" }
            ],
            library: [
                { title: `퇴근길 인문학: 서사로 나를 쓰다`, source: `${dist} 시립도서관`, img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=800", badge: "LECTURE" },
                { title: `명사 초청 강연: 2026 트렌드`, source: `${dist} 평생학습관`, img: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800", badge: "STUDY" }
            ],
            local: [
                { title: `${dist} 달빛 야행 축제`, source: `${prov}청 관광과`, img: "https://images.unsplash.com/photo-1514525253344-f814d074d08a?w=800", badge: "FESTIVAL" },
                { title: `골목상권 활성화 플리마켓`, source: `${dist} 소상공인회`, img: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=800", badge: "MARKET" }
            ],
            indie: [
                { title: `지역 아티스트 버스킹 페스타`, source: `${dist} 예술문화회관`, img: "https://images.unsplash.com/photo-1465821185615-20b3c2fbf41b?w=800", badge: "MUSIC" },
                { title: `소극장 클래식 앙상블`, source: `${prov} 문화예술회관`, img: "https://images.unsplash.com/photo-1520529611472-d9622ff5466d?w=800", badge: "CONCERT" }
            ],
            active: [
                { title: `도심 속 야간 러닝 크루 모집`, source: `${dist} 체육회`, img: "https://images.unsplash.com/photo-1551632811-561732d1e306?w=800", badge: "SPORTS" },
                { title: `전통 타악기(난타) 원데이 클래스`, source: `${dist} 문화원`, img: "https://images.unsplash.com/photo-1519683109079-d5f539e1542f?w=800", badge: "ACTIVITY" }
            ],
            mind: [
                { title: `자아 탐구 교류분석(TA) 세미나`, source: `${dist} 심리상담센터`, img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=800", badge: "MIND" },
                { title: `도심 속 숲길 맨발 걷기 명상`, source: `${dist} 보건소 힐링사업`, img: "https://images.unsplash.com/photo-1510798831971-661eb04b3739?w=800", badge: "RETREAT" }
            ]
        };

        // 전체보기일 경우 모든 템플릿 풀에서 추출
        let selectedTemplates = [];
        if(cat === 'all') {
            for(let key in templates) selectedTemplates.push(templates[key][0]);
        } else {
            selectedTemplates = templates[cat];
        }

        // 결과 카드 동적 렌더링
        selectedTemplates.forEach(item => {
            grid.innerHTML += `
                <a href="#" class="card" onclick="alert('UI 프로토타입: 실제 서비스 시 해당 기관(${item.source}) 예약 페이지로 이동합니다.')">
                    <div class="card-img" style="background-image: url('${item.img}')"></div>
                    <div class="card-body">
                        <div class="meta">
                            <span class="badge">${item.badge}</span>
                            <span class="source">🏛️ ${item.source} 연동</span>
                        </div>
                        <h3 class="title">${item.title}</h3>
                        <div class="info">📍 ${prov} ${dist} 일대 주요 시설</div>
                        <div class="info">📅 ${date}</div>
                        <div class="btn-link">상세 정보 및 공공 예약 페이지 이동 〉</div>
                    </div>
                </a>
            `;
        });
    }

    window.onload = () => document.getElementById('dateInput').value = "2026-04-18";
</script>
</body>
</html>
