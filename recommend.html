<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot Twist | 당신의 다음 시나리오</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --glass: rgba(255, 255, 255, 0.8);
            --bg: #f8fafc;
            --dark: #0f172a;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.1) 0, transparent 50%);
            color: var(--dark); margin: 0; padding: 0; min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }

        /* Hero Section */
        header { text-align: center; margin-bottom: 80px; }
        header h1 { font-size: 4rem; font-weight: 900; margin: 0; letter-spacing: -3px; line-height: 0.9; }
        header h1 span { color: var(--primary); }
        header p { font-size: 1.25rem; color: #64748b; margin-top: 20px; font-weight: 300; }

        /* Search Console (Glassmorphism) */
        .search-console {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .input-group label { font-size: 0.85rem; font-weight: 700; color: #475569; letter-spacing: 0.5px; }
        
        select, input {
            padding: 16px; border-radius: 16px; border: 1px solid #e2e8f0;
            background: white; font-size: 1rem; font-family: inherit; outline: none; transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        .btn-search {
            grid-column: 1 / -1; background: var(--dark); color: white;
            border: none; padding: 20px; border-radius: 18px; font-size: 1.2rem;
            font-weight: 800; cursor: pointer; transition: 0.4s; margin-top: 10px;
        }
        .btn-search:hover { background: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }

        /* Results Section */
        .result-header { display: none; margin-bottom: 30px; font-size: 1.5rem; font-weight: 800; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; }

        .card {
            background: white; border-radius: 28px; overflow: hidden;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-15px); box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.12); }
        
        .card-img { width: 100%; height: 240px; background-size: cover; background-position: center; }
        .card-body { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .badge { font-size: 0.7rem; font-weight: 800; padding: 6px 14px; border-radius: 10px; margin-bottom: 16px; display: inline-block; width: fit-content; text-transform: uppercase; }
        .bg-art { background: #fef3c7; color: #92400e; }
        .bg-music { background: #fee2e2; color: #991b1b; }
        .bg-sports { background: #dcfce7; color: #166534; }
        .bg-study { background: #e0e7ff; color: #3730a3; }
        .bg-popup { background: #fae8ff; color: #86198f; }

        .card-title { font-size: 1.4rem; font-weight: 800; margin: 0 0 15px 0; line-height: 1.3; color: var(--dark); }
        .card-info { font-size: 0.95rem; color: #64748b; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .btn-direct {
            margin-top: auto; background: var(--bg); color: var(--dark);
            text-decoration: none; text-align: center; padding: 16px;
            border-radius: 14px; font-weight: 700; font-size: 0.95rem; transition: 0.3s;
            border: 1px solid #e2e8f0;
        }
        .btn-direct:hover { background: var(--dark); color: white; border-color: var(--dark); }

        /* Animation */
        #radar { display: none; text-align: center; padding: 80px 0; }
        .pulse {
            width: 60px; height: 60px; background: var(--primary); border-radius: 50%;
            margin: 0 auto 20px; animation: pulse-anim 1.5s infinite;
        }
        @keyframes pulse-anim { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        @media (max-width: 768px) {
            header h1 { font-size: 2.8rem; }
            .search-console { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PLOT<span>TWIST</span></h1>
        <p>당신의 지루한 일상을 깨뜨릴 다음 장면을 발견하세요.</p>
    </header>

    <div class="search-console">
        <div class="input-group">
            <label>무엇을 찾고 싶나요?</label>
            <select id="category">
                <option value="all">전체 카테고리</option>
                <option value="art">🎨 예술/전시</option>
                <option value="music">🎵 음악/공연</option>
                <option value="sports">🏃 체육/운동</option>
                <option value="study">📚 스터디/강연</option>
                <option value="popup">✨ 팝업/이벤트</option>
                <option value="meditation">🧘 명상/힐링</option>
            </select>
        </div>
        <div class="input-group">
            <label>언제 떠날까요?</label>
            <input type="date" id="date">
        </div>
        <div class="input-group">
            <label>지역(시/도)</label>
            <select id="province" onchange="updateDistricts()">
                <option value="">시/도 선택</option>
                <option value="seoul">서울특별시</option>
                <option value="gyeonggi">경기도</option>
                <option value="gwangju">광주광역시</option>
                <option value="daegu">대구광역시</option>
            </select>
        </div>
        <div class="input-group">
            <label>세부 지역(구/시)</label>
            <select id="district">
                <option value="">지역을 먼저 선택하세요</option>
            </select>
        </div>
        <button class="btn-search" onclick="runSearch()">시나리오 탐색 시작</button>
    </div>

    <div id="radar">
        <div class="pulse"></div>
        <h2 style="font-weight: 700;">내 위치 기반 데이터를 동기화 중...</h2>
    </div>

    <div id="results" class="results-section">
        <h2 class="result-header" id="resultTitle">당신을 위한 새로운 페이지</h2>
        <div id="grid" class="result-grid"></div>
    </div>
</div>

<script>
    const districtData = {
        seoul: ["성동구", "강동구", "도봉구", "강남구", "노원구", "마포구", "성북구"],
        gyeonggi: ["화성시", "수원시", "성남시", "용인시", "부천시", "고양시"],
        gwangju: ["북구", "남구", "동구", "서구", "광산구"],
        daegu: ["중구", "수성구", "달서구", "북구", "동구"]
    };

    const database = [
        { 
            province: "seoul", district: "성동구", cat: "art", catName: "예술/전시", 
            title: "성수 디올 팝업: 미학의 발견", date: "2026-04-18",
            loc: "성수동 에스팩토리", url: "https://www.sfactory.co.kr/",
            img: "https://images.unsplash.com/photo-1554188248-986adbb73be4?w=800"
        },
        { 
            province: "seoul", district: "강동구", cat: "sports", catName: "체육/액티비티", 
            title: "강동 클라이밍 센터 원데이 클래스", date: "2026-04-18",
            loc: "강동 실내 암벽장", url: "https://www.gangdong.go.kr/",
            img: "https://images.unsplash.com/photo-1522163182402-834f871fd851?w=800"
        },
        { 
            province: "seoul", district: "도봉구", cat: "study", catName: "스터디/강연", 
            title: "작가와 함께하는 북토크: 인생의 필력", date: "2026-04-18",
            loc: "도봉 아토 도서관", url: "https://edu.dobong.go.kr/",
            img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=800"
        },
        { 
            province: "gyeonggi", district: "화성시", cat: "music", catName: "음악/공연", 
            title: "동탄 호수공원 야외 재즈 페스티벌", date: "2026-04-18",
            loc: "동탄 호수공원 특설무대", url: "https://www.hcf.or.kr/",
            img: "https://images.unsplash.com/photo-1514525253344-f814d074d08a?w=800"
        },
        { 
            province: "seoul", district: "성북구", cat: "meditation", catName: "명상/힐링", 
            title: "성북동 숲속 요가 & 싱잉볼 명상", date: "2026-04-18",
            loc: "성북구민 힐링센터", url: "https://www.sb.go.kr/",
            img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=800"
        }
    ];

    function updateDistricts() {
        const prov = document.getElementById('province').value;
        const distSelect = document.getElementById('district');
        distSelect.innerHTML = '<option value="">구/시 선택</option>';
        if(prov && districtData[prov]) {
            districtData[prov].forEach(d => distSelect.innerHTML += `<option value="${d}">${d}</option>`);
        }
    }

    function runSearch() {
        const cat = document.getElementById('category').value;
        const date = document.getElementById('date').value;
        const prov = document.getElementById('province').value;
        const dist = document.getElementById('district').value;

        if(!date || !prov || !dist) return alert("당신의 위치와 날짜를 알려주세요!");

        document.getElementById('results').style.display = 'none';
        document.getElementById('radar').style.display = 'block';

        setTimeout(() => {
            document.getElementById('radar').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('resultTitle').style.display = 'block';
            render(cat, date, prov, dist);
        }, 1800);
    }

    function render(cat, date, prov, dist) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        const filtered = database.filter(item => 
            (cat === 'all' || item.cat === cat) && 
            item.date === date && 
            item.province === prov && 
            item.district === dist
        );

        if(filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 100px 0; color: #94a3b8;">
                <p style="font-size:1.2rem;">해당 날짜에 일치하는 시나리오가 없습니다.</p>
                <small>테스트를 위해 날짜를 <b>2026-04-18</b>로 설정해보세요!</small>
            </div>`;
            return;
        }

        filtered.forEach(item => {
            grid.innerHTML += `
                <div class="card">
                    <div class="card-img" style="background-image:url('${item.img}')"></div>
                    <div class="card-body">
                        <span class="badge bg-${item.cat}">${item.catName}</span>
                        <h3 class="card-title">${item.title}</h3>
                        <div class="card-info">📍 ${item.loc}</div>
                        <div class="card-info">📅 ${item.date}</div>
                        <a href="${item.url}" target="_blank" class="btn-link btn-direct">이 시나리오 참여하기 〉</a>
                    </div>
                </div>
            `;
        });
    }

    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = today;
    };
</script>

</body>
</html>
