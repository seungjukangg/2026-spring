<!DOCTYPE html>   
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOT TWIST | 시네마틱 라이프 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {   
            --bg: #050505;    
            --surface: #111111;
            --primary: #ffffff;
            --accent: #4338ca; /* Deep Indigo */
            --glow: #f43f5e; /* Rose Glow */
            --text-main: #f8fafc;
            --text-sub: #64748b;
            --border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(67,56,202,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, rgba(244,63,94,0.1) 0%, transparent 50%);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }

        /* 타이포그래피 & 로고 */
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; position: absolute; top: 40px; left: 40px; z-index: 100; }
        .logo span { color: var(--glow); }

        /* 대화형 스텝 UI (Wizard) */
        .wizard-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 80vh; text-align: center;
        }

        .step { display: none; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(30px); }
        .step.active { display: flex; flex-direction: column; align-items: center; }

        .question-title { font-size: 3rem; font-weight: 900; margin-bottom: 40px; line-height: 1.2; letter-spacing: -1px; }
        .question-sub { font-size: 1.2rem; color: var(--text-sub); margin-bottom: 40px; font-weight: 300; }

        /* 선택지 버튼 디자인 */
        .options-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; max-width: 800px; }
        .btn-option {
            background: transparent; border: 1px solid var(--border); color: var(--text-main);
            padding: 20px 40px; border-radius: 100px; font-size: 1.2rem; font-weight: 400;
            cursor: pointer; transition: all 0.4s ease; backdrop-filter: blur(10px);
        }
        .btn-option:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); transform: translateY(-3px); }
        .btn-option.selected { background: var(--primary); color: var(--bg); font-weight: 700; border-color: var(--primary); }

        /* 지역/날짜 입력 폼 */
        .input-form { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        select, input[type="date"] {
            background: var(--surface); border: 1px solid var(--border); color: white;
            padding: 18px 24px; border-radius: 16px; font-size: 1.1rem; outline: none; font-family: inherit;
            min-width: 200px; transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--glow); box-shadow: 0 0 15px rgba(244,63,94,0.2); }

        /* 하단 진행 컨트롤 */
        .controls { margin-top: 60px; display: flex; gap: 20px; }
        .btn-next {
            background: var(--glow); color: white; border: none; padding: 20px 50px;
            border-radius: 100px; font-size: 1.2rem; font-weight: 900; cursor: pointer;
            transition: 0.3s; letter-spacing: 1px;
        }
        .btn-next:hover { box-shadow: 0 0 30px rgba(244,63,94,0.4); transform: scale(1.05); }

        /* 로딩 씬 */
        #loadingScene { display: none; text-align: center; flex-direction: column; justify-content: center; min-height: 80vh; }
        .loader-ring {
            width: 80px; height: 80px; border: 2px solid var(--border); border-top: 2px solid var(--glow);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 30px;
        }
        .typing-text { font-size: 1.5rem; font-weight: 300; letter-spacing: 1px; }

        /* 결과 화면 (매거진 스타일) */
        #resultScene { display: none; padding-top: 100px; }
        .result-header { margin-bottom: 60px; text-align: center; }
        .result-header h2 { font-size: 3.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; }
        .result-header p { color: var(--glow); font-size: 1.2rem; font-weight: 700; margin-top: 10px; }

        .cards-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; }
        
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
            overflow: hidden; transition: 0.5s; text-decoration: none; color: inherit;
            position: relative; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        .card-img { width: 100%; height: 280px; background-size: cover; background-position: center; filter: grayscale(40%); transition: 0.5s; }
        .card:hover .card-img { filter: grayscale(0%); }

        .card-content { padding: 35px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; color: var(--glow); }
        .source { font-size: 0.8rem; color: var(--text-sub); }

        .card-title { font-size: 1.8rem; font-weight: 800; line-height: 1.3; margin-bottom: 15px; }
        .card-desc { font-size: 1rem; color: var(--text-sub); margin-bottom: 20px; line-height: 1.6; font-weight: 300; }
        
        .btn-link {
            margin-top: auto; padding: 18px; border: 1px solid var(--border); border-radius: 100px;
            text-align: center; font-weight: 700; transition: 0.3s;
        }
        .card:hover .btn-link { background: var(--primary); color: var(--bg); }

        /* 애니메이션 */
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .question-title { font-size: 2rem; }
            .btn-option { padding: 15px 25px; font-size: 1rem; }
            .input-form { flex-direction: column; width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

    <div class="logo">PLOT<span>TWIST</span></div>

    <div class="container">
        
        <div class="wizard-container" id="wizard">
            
            <div class="step active" id="step1">
                <h1 class="question-title">지금, 당신의 일상은 어떤가요?</h1>
                <p class="question-sub">AI가 당신의 심리 상태를 분석하여 완벽한 반전을 기획합니다.</p>
                <div class="options-grid">
                    <button class="btn-option" onclick="selectMood(this, 'mind')">너무 지쳤어요. 고요한 휴식이 필요해요.</button>
                    <button class="btn-option" onclick="selectMood(this, 'active')">몸이 찌뿌둥해요. 땀 흘리고 움직이고 싶어요.</button>
                    <button class="btn-option" onclick="selectMood(this, 'study')">머리가 텅 빈 것 같아요. 지적 자극이 필요해요.</button>
                    <button class="btn-option" onclick="selectMood(this, 'art')">메마른 느낌이에요. 아름다운 예술을 보고 싶어요.</button>
                    <button class="btn-option" onclick="selectMood(this, 'popup')">그냥 다 지루해요. 새롭고 힙한 곳에 갈래요.</button>
                </div>
                <div class="controls"><button class="btn-next" onclick="nextStep(2)">다음으로 〉</button></div>
            </div>

            <div class="step" id="step2">
                <h1 class="question-title">어디서, 언제 시나리오를 시작할까요?</h1>
                <p class="question-sub">당신이 머무는 곳의 공공 및 민간 인프라를 연결합니다.</p>
                
                <div class="input-form">
                    <input type="date" id="dateInput">
                    <select id="provInput" onchange="loadDist()">
                        <option value="">시/도 선택</option>
                        <option value="서울">서울특별시</option>
                        <option value="경기">경기도</option>
                        <option value="인천">인천광역시</option>
                        <option value="부산">부산광역시</option>
                        <option value="광주">광주광역시</option>
                        <option value="제주">제주특별자치도</option>
                    </select>
                    <select id="distInput"><option value="">지역을 먼저 선택하세요</option></select>
                </div>
                
                <div class="controls">
                    <button class="btn-option" style="border:none;" onclick="nextStep(1)">〈 뒤로</button>
                    <button class="btn-next" onclick="startAnalysis()">다이브(Dive) 시작</button>
                </div>
            </div>
        </div>

        <div id="loadingScene">
            <div class="loader-ring"></div>
            <h2 class="typing-text" id="loadingText">당신의 일상을 분석 중입니다...</h2>
        </div>

        <div id="resultScene">
            <div class="result-header">
                <h2>THE NEXT CHAPTER</h2>
                <p>당신의 스크립트를 완벽하게 뒤집을 3가지 제안</p>
            </div>
            <div class="cards-container" id="cardsGrid">
                </div>
            <div style="text-align:center; margin-top:80px;">
                <button class="btn-option" onclick="location.reload()">새로운 시나리오 다시 쓰기</button>
            </div>
        </div>
    </div>

<script>
    // 상태 변수
    let userMood = 'all';

    // 행정구역 데이터
    const areaMap = {
        "서울": ["종로구","성동구","마포구","강남구","용산구","노원구","서초구"],
        "경기": ["수원시","화성시","성남시","고양시","파주시","용인시"],
        "인천": ["중구","연수구","서구","남동구"],
        "부산": ["해운대구","수영구","부산진구","기장군"],
        "광주": ["동구","서구","북구"],
        "제주": ["제주시","서귀포시"]
    };

    // 프리미엄 데이터베이스 (설명문구 추가)
    const db = [
        { prov: "서울", dist: "성동구", cat: "popup", badge: "POP-UP", source: "공간와디즈 연동", title: "크리에이티브 브랜드 마켓", desc: "뻔한 주말을 깨우는 성수동의 숨겨진 브랜드 전시. 당신의 영감을 자극할 새로운 물건들을 만나보세요.", date: "2026-04-19", url: "https://gongganwadiz.com/", img: "https://images.unsplash.com/photo-1536924940846-227afb31e2a5?w=800" },
        { prov: "서울", dist: "종로구", cat: "art", badge: "EXHIBITION", source: "서울시립미술관", title: "현대미술 기획전: 낯선 일상", desc: "익숙함을 비틀어보는 시간. 세계적인 아티스트들의 작품을 통해 메마른 감성을 다시 촉촉하게 적셔보세요.", date: "2026-04-19", url: "https://sema.seoul.go.kr/", img: "https://images.unsplash.com/photo-1554188248-986adbb73be4?w=800" },
        { prov: "서울", dist: "노원구", cat: "active", badge: "ACTIVITY", source: "노원구청 체육과", title: "불암산 야간 하이킹 크루", desc: "책상 앞에만 앉아있던 당신을 위한 시간. 밤공기를 마시며 땀을 흘리고 도심의 야경을 발아래 두세요.", date: "2026-04-19", url: "https://www.nowon.kr/", img: "https://images.unsplash.com/photo-1551632811-561732d1e306?w=800" },
        { prov: "경기", dist: "화성시", cat: "study", badge: "SEMINAR", source: "화성시립도서관", title: "인문학 심야 살롱: 나를 쓰는 밤", desc: "머릿속이 복잡할 땐 활자로 정리해보세요. 나와 비슷한 고민을 가진 사람들과 지적인 대화를 나눌 수 있습니다.", date: "2026-04-19", url: "https://www.hscitylib.or.kr/", img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=800" },
        { prov: "경기", dist: "화성시", cat: "mind", badge: "HEALING", source: "경기문화재단", title: "싱잉볼 테라피와 숲속 명상", desc: "쉴 틈 없이 달려온 뇌에 휴식을 줄 시간. 소리의 파동을 통해 내면의 깊은 고요함을 마주해 보세요.", date: "2026-04-19", url: "https://www.ggcf.kr/", img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=800" },
        { prov: "부산", dist: "해운대구", cat: "art", badge: "CULTURE", source: "부산시립미술관", title: "오픈 미디어 아트 야간 개장", desc: "빛과 소리가 만드는 몽환적인 공간. 생각의 스위치를 끄고 그저 시각적인 경이로움에 빠져보세요.", date: "2026-04-19", url: "https://art.busan.go.kr/", img: "https://images.unsplash.com/photo-1518998053574-53ee753cf68b?w=800" },
        { prov: "제주", dist: "제주시", cat: "mind", badge: "RETREAT", source: "제주관광공사", title: "비자림 맨발 걷기 프로젝트", desc: "자연의 촉감을 온전히 느끼는 시간. 화산송이 길을 맨발로 걸으며 스트레스를 땅속으로 비워내세요.", date: "2026-04-19", url: "https://www.visitjeju.net/", img: "https://images.unsplash.com/photo-1510798831971-661eb04b3739?w=800" }
    ];

    // 스텝 전환 로직
    function nextStep(stepNum) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + stepNum).classList.add('active');
    }

    // 감정 선택 로직
    function selectMood(btn, mood) {
        document.querySelectorAll('.btn-option').forEach(el => el.classList.remove('selected'));
        btn.classList.add('selected');
        userMood = mood;
    }

    // 지역 로드
    function loadDist() {
        const prov = document.getElementById('provInput').value;
        const dist = document.getElementById('distInput');
        dist.innerHTML = '<option value="">구/시 선택</option>';
        if(prov && areaMap[prov]) {
            areaMap[prov].forEach(d => dist.innerHTML += `<option value="${d}">${d}</option>`);
        }
    }

    // 분석 시뮬레이션
    function startAnalysis() {
        const date = document.getElementById('dateInput').value;
        const prov = document.getElementById('provInput').value;
        
        if(!date || !prov) return alert("날짜와 시/도를 입력해주셔야 합니다.");

        document.getElementById('wizard').style.display = 'none';
        const loader = document.getElementById('loadingScene');
        loader.style.display = 'flex';

        const msgs = [
            "당신의 선택을 분석 중입니다...",
            "공공 데이터베이스와 로컬 인프라를 스캔합니다.",
            "당신의 일상을 뒤집을 완벽한 시나리오를 구성했습니다."
        ];
        
        let i = 0;
        const interval = setInterval(() => {
            i++;
            if(i < msgs.length) document.getElementById('loadingText').innerText = msgs[i];
            else {
                clearInterval(interval);
                loader.style.display = 'none';
                showResults(date, prov, document.getElementById('distInput').value);
            }
        }, 1200);
    }

    // 결과 렌더링
    function showResults(date, prov, dist) {
        document.getElementById('resultScene').style.display = 'block';
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';

        // 유저 무드와 지역에 맞는 데이터 필터링 (없으면 지역/날짜만이라도 맞춤)
        let filtered = db.filter(item => 
            item.date === date && item.prov === prov && (dist === '' || item.dist === dist)
        );
        
        // 데이터가 아예 없을 경우 (시연을 위한 예외처리)
        if(filtered.length === 0) {
            grid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding: 60px; border:1px dashed var(--border); border-radius:20px;">
                    <h3 style="font-size:1.5rem; margin-bottom:10px;">현재 시공간에 맞는 시나리오가 부족합니다.</h3>
                    <p style="color:var(--text-sub);">테스트 권장: <b>2026-04-19 / 서울-성동구, 경기-화성시, 제주-제주시</b></p>
                </div>`;
            return;
        }

        // 우선순위 정렬 (선택한 감정과 일치하는 것을 맨 위로)
        filtered.sort((a, b) => (b.cat === userMood ? 1 : 0) - (a.cat === userMood ? 1 : 0));

        filtered.forEach(item => {
            grid.innerHTML += `
                <a href="${item.url}" target="_blank" class="card">
                    <div class="card-img" style="background-image: url('${item.img}')"></div>
                    <div class="card-content">
                        <div class="meta">
                            <span class="badge">${item.badge}</span>
                            <span class="source">🏛️ ${item.source}</span>
                        </div>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                        <div style="font-size:0.9rem; color:var(--text-sub); margin-bottom:20px;">📍 ${item.prov} ${item.dist} &nbsp;|&nbsp; 📅 ${item.date}</div>
                        <div class="btn-link">상세 정보 및 예약 페이지로 다이브 〉</div>
                    </div>
                </a>
            `;
        });
    }

    // 초기값
    window.onload = () => document.getElementById('dateInput').value = "2026-04-19";
</script>
</body>
</html>
