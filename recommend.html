<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시공간(時空間) | 맞춤 활동 검색</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --accent: #10b981;
            --bg: #f1f5f9; --card: #ffffff;
            --text-main: #0f172a; --text-sub: #64748b;
        }

        body {
            font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .app-container { max-width: 900px; width: 100%; margin-top: 30px; }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 0; }
        header p { color: var(--text-sub); margin-top: 8px; }

        /* 필터 패널 */
        .filter-card {
            background: var(--card); border-radius: 24px; padding: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
        }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-weight: 700; font-size: 0.9rem; color: #475569; }
        select, input {
            padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: 1rem; outline: none; transition: 0.2s; background: #f8fafc;
        }
        select:focus, input:focus { border-color: var(--primary); background: white; }

        .search-btn {
            grid-column: span 2; background: var(--primary); color: white;
            border: none; padding: 18px; border-radius: 15px; font-weight: 700;
            font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .search-btn:hover { background: #4338ca; transform: translateY(-2px); }

        /* 로딩/레이더 */
        .radar-box { display: none; text-align: center; padding: 60px 0; }
        .radar-circle {
            width: 100px; height: 100px; border: 4px solid var(--primary);
            border-radius: 50%; margin: 0 auto 20px; animation: radar-pulse 1.2s infinite;
        }
        @keyframes radar-pulse { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* 결과 그리드 */
        .results-section { display: none; margin-top: 40px; width: 100%; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        .item-card {
            background: white; border-radius: 20px; overflow: hidden;
            border: 1px solid #e2e8f0; transition: 0.3s; display: flex; flex-direction: column;
        }
        .item-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        .item-img { width: 100%; height: 160px; background: #eee; object-fit: cover; }
        .item-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .item-cat { font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
        .cat-intel { background: #e0e7ff; color: #4338ca; }
        .cat-active { background: #d1fae5; color: #065f46; }
        .cat-culture { background: #fef3c7; color: #92400e; }

        .item-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 12px 0; line-height: 1.4; }
        .item-info { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }

        .btn-link {
            margin-top: auto; background: var(--text-main); color: white;
            text-decoration: none; text-align: center; padding: 12px;
            border-radius: 10px; font-weight: 700; font-size: 0.9rem; transition: 0.2s;
        }
        .btn-link:hover { background: var(--accent); }

        @media (max-width: 600px) { .filter-card { grid-template-columns: 1fr; } .search-btn { grid-column: span 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>시공간 (時空間)</h1>
            <p>우리 동네 숨은 강연, 전시, 액티비티를 정밀하게 찾아드립니다.</p>
        </header>

        <div class="filter-card">
            <div class="filter-group">
                <label>활동 카테고리</label>
                <select id="category">
                    <option value="all">전체보기</option>
                    <option value="intel">지적 탐구 (특강/스터디)</option>
                    <option value="active">액티비티 (야외/운동)</option>
                    <option value="culture">문화생활 (전시/팝업)</option>
                </select>
            </div>
            <div class="filter-group">
                <label>날짜 선택</label>
                <input type="date" id="date">
            </div>
            <div class="filter-group">
                <label>지역 (시/도)</label>
                <select id="city" onchange="updateDistricts()">
                    <option value="">시/도 선택</option>
                    <option value="seoul">서울특별시</option>
                    <option value="gyeonggi">경기도</option>
                </select>
            </div>
            <div class="filter-group">
                <label>세부 지역 (구/시)</label>
                <select id="district">
                    <option value="">먼저 시/도를 골라주세요</option>
                </select>
            </div>
            <button class="search-btn" onclick="performSearch()">맞춤 활동 탐색 시작</button>
        </div>

        <div id="radar" class="radar-box">
            <div class="radar-circle"></div>
            <h3>입력하신 지역의 실시간 정보를 수집 중...</h3>
        </div>

        <div id="results" class="results-section">
            <h2 id="resHeader">내 조건에 맞는 탐험 리스트</h2>
            <div id="grid" class="result-grid"></div>
        </div>
    </div>

    <script>
        // 지역 데이터
        const districtMap = {
            seoul: ["노원구", "도봉구", "강남구", "마포구", "성북구"],
            gyeonggi: ["화성시", "수원시", "용인시", "성남시", "부천시"]
        };

        // 가상 활동 데이터 (실제 링크 포함)
        const programs = [
            { 
                city: "seoul", district: "노원구", cat: "intel", catName: "지적 탐구",
                title: "인문학 특강: 나를 찾는 글쓰기", date: "2026-04-18",
                loc: "노원평생학습관", url: "https://nlc.sen.go.kr/",
                img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=400"
            },
            { 
                city: "seoul", district: "도봉구", cat: "active", catName: "액티비티",
                title: "도봉산 야간 트레킹 소모임", date: "2026-04-18",
                loc: "도봉산 입구 광장", url: "https://www.knps.or.kr/front/portal/visit/visitCourseMain.do?parkId=121500",
                img: "https://images.unsplash.com/photo-1551632811-561732d1e306?w=400"
            },
            { 
                city: "gyeonggi", district: "화성시", cat: "culture", catName: "문화생활",
                title: "동탄 미디어아트 전시: 빛의 흐름", date: "2026-04-18",
                loc: "화성시 미디어센터", url: "https://media.hcf.or.kr/",
                img: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400"
            },
            { 
                city: "gyeonggi", district: "수원시", cat: "culture", catName: "문화생활",
                title: "수원화성 달빛 동행 투어", date: "2026-04-19",
                loc: "수원화성 행궁", url: "https://www.swcf.or.kr/",
                img: "https://images.unsplash.com/photo-1599347719602-53606f75e7a5?w=400"
            },
            { 
                city: "seoul", district: "노원구", cat: "culture", catName: "문화생활",
                title: "노원 불빛 정원 축제", date: "2026-04-19",
                loc: "화랑대 철도공원", url: "https://www.nowon.kr/www/user/bbs/BD_selectBbs.do?q_bbsCode=1038",
                img: "https://images.unsplash.com/photo-1514525253344-f814d074d08a?w=400"
            }
        ];

        // 시/도 선택 시 구/시 업데이트
        function updateDistricts() {
            const city = document.getElementById('city').value;
            const districtSelect = document.getElementById('district');
            districtSelect.innerHTML = '<option value="">구/시 선택</option>';

            if (city && districtMap[city]) {
                districtMap[city].forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.innerText = d;
                    districtSelect.appendChild(opt);
                });
            }
        }

        // 검색 기능
        function performSearch() {
            const cat = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const city = document.getElementById('city').value;
            const dist = document.getElementById('district').value;

            if (!date || !city || !dist) {
                alert("날짜와 지역을 모두 선택해 주세요!");
                return;
            }

            document.getElementById('results').style.display = 'none';
            document.getElementById('radar').style.display = 'block';

            setTimeout(() => {
                document.getElementById('radar').style.display = 'none';
                document.getElementById('results').style.display = 'block';
                displayResults(cat, date, city, dist);
            }, 2000);
        }

        function displayResults(cat, date, city, dist) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const filtered = programs.filter(p => {
                return (cat === 'all' || p.cat === cat) && 
                       (p.date === date) && 
                       (p.city === city) && 
                       (p.district === dist);
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 3; text-align:center; padding: 50px; color: #94a3b8;">선택하신 조건에 맞는 프로그램이 아직 없습니다. 다른 날짜나 인근 지역을 확인해 보세요!</p>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${p.img}" class="item-img">
                    <div class="item-content">
                        <span class="item-cat cat-${p.cat}">${p.catName}</span>
                        <h3 class="item-title">${p.title}</h3>
                        <div class="item-info">📍 ${p.district} ${p.loc}</div>
                        <div class="item-info">📅 ${p.date}</div>
                        <a href="${p.url}" target="_blank" class="btn-link">상세 페이지/신청 바로가기</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 오늘 날짜로 초기값 설정
        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
        };
    </script>
</body>
</html>
