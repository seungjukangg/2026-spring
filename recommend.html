<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시공간(時空間) | 하이퍼 로컬 액티비티</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --accent: #ec4899;
            --bg: #f8fafc; --card: #ffffff;
            --text-main: #1e293b; --text-sub: #64748b;
        }

        body {
            font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .app-container { max-width: 1000px; width: 100%; margin-top: 20px; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2.8rem; font-weight: 800; color: var(--primary); margin: 0; letter-spacing: -2px; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-sub); margin-top: 10px; font-size: 1.1rem; }

        /* 검색 필터 영역 */
        .filter-section {
            background: var(--card); border-radius: 24px; padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;
            margin-bottom: 40px; border: 1px solid #f1f5f9;
        }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-weight: 700; font-size: 0.85rem; color: #475569; padding-left: 5px; }
        
        select, input {
            padding: 14px; border: 1px solid #e2e8f0; border-radius: 14px;
            font-size: 1rem; outline: none; transition: 0.2s; background: #fdfdfd; font-family: inherit;
        }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .search-btn {
            grid-column: 1 / -1; background: var(--primary); color: white;
            border: none; padding: 18px; border-radius: 14px; font-weight: 800;
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .search-btn:hover { background: #3730a3; transform: translateY(-2px); }

        /* 결과 영역 */
        .results-header { display: none; margin-bottom: 20px; padding: 0 10px; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 25px; }

        .activity-card {
            background: white; border-radius: 22px; overflow: hidden;
            border: 1px solid #e2e8f0; transition: 0.3s; display: flex; flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .activity-card:hover { transform: translateY(-10px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        .card-image { width: 100%; height: 200px; background: #eee; object-fit: cover; }
        .card-body { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .badge { font-size: 0.7rem; font-weight: 800; padding: 5px 12px; border-radius: 8px; margin-bottom: 12px; display: inline-block; width: fit-content; }
        .bg-intel { background: #e0e7ff; color: #4338ca; }
        .bg-active { background: #d1fae5; color: #065f46; }
        .bg-culture { background: #fef3c7; color: #92400e; }

        .title { font-size: 1.3rem; font-weight: 800; margin: 0 0 15px 0; line-height: 1.4; color: #0f172a; }
        .info-item { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

        .link-button {
            margin-top: auto; background: var(--text-main); color: white;
            text-decoration: none; text-align: center; padding: 15px;
            border-radius: 12px; font-weight: 700; font-size: 0.95rem; transition: 0.2s;
        }
        .link-button:hover { background: var(--primary); }

        /* 레이더 애니메이션 */
        #radar { display: none; text-align: center; padding: 100px 0; }
        .radar-wave {
            width: 80px; height: 80px; background: var(--primary); border-radius: 50%;
            margin: 0 auto 30px; animation: wave 1.5s infinite;
        }
        @keyframes wave { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>시공간 <span>時空間</span></h1>
        <p>지금 내 주변에서 열리는 가장 가치 있는 활동을 찾습니다.</p>
    </header>

    <div class="filter-section">
        <div class="filter-group">
            <label>활동 유형</label>
            <select id="category">
                <option value="all">전체보기</option>
                <option value="intel">지적 탐구 (특강/스터디)</option>
                <option value="active">액티비티 (운동/활동)</option>
                <option value="culture">문화/전시 (팝업/전시)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>날짜</label>
            <input type="date" id="searchDate">
        </div>
        <div class="filter-group">
            <label>지역 (시/도)</label>
            <select id="province" onchange="loadDistricts()">
                <option value="">시/도 선택</option>
                <option value="seoul">서울특별시</option>
                <option value="gyeonggi">경기도</option>
                <option value="gwangju">광주광역시</option>
                <option value="daegu">대구광역시</option>
            </select>
        </div>
        <div class="filter-group">
            <label>세부 지역 (구/시)</label>
            <select id="district">
                <option value="">지역을 먼저 선택하세요</option>
            </select>
        </div>
        <button class="search-btn" onclick="startSearch()">지금 탐색하기</button>
    </div>

    <div id="radar">
        <div class="radar-wave"></div>
        <h2>실시간 로컬 데이터를 매칭하고 있습니다...</h2>
    </div>

    <div id="results" class="results-header">
        <h2 style="font-size: 1.5rem; margin-bottom: 20px;">내 맞춤 검색 결과</h2>
        <div id="resultGrid" class="result-grid"></div>
    </div>
</div>

<script>
    // 1. 세부 지역 데이터 정의
    const areaMap = {
        seoul: ["성동구", "강동구", "도봉구", "강남구", "노원구", "마포구"],
        gyeonggi: ["화성시", "수원시", "성남시", "용인시", "안양시"],
        gwangju: ["북구", "남구", "동구", "서구", "광산구"],
        daegu: ["중구", "수성구", "달서구", "북구", "동구"]
    };

    // 2. 활동 데이터베이스 (실제 링크 매칭)
    const db = [
        { 
            province: "seoul", district: "성동구", cat: "culture", catName: "문화/전시", 
            title: "성수동 팝업스토어: 크리에이티브 가든", date: "2026-04-18",
            loc: "성수동 에스팩토리", url: "https://www.sfactory.co.kr/",
            img: "https://images.unsplash.com/photo-1536924940846-227afb31e2a5?w=500"
        },
        { 
            province: "seoul", district: "강동구", cat: "active", catName: "액티비티", 
            title: "강동 바이크 라이딩 스쿨 (초급)", date: "2026-04-18",
            loc: "강동구 광나루 자전거공원", url: "https://yeyak.seoul.go.kr/",
            img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500"
        },
        { 
            province: "seoul", district: "도봉구", cat: "intel", catName: "지적 탐구", 
            title: "도봉 인문학 강좌: 나를 찾는 명상", date: "2026-04-18",
            loc: "도봉구 평생학습관", url: "https://edu.dobong.go.kr/",
            img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=500"
        },
        { 
            province: "gyeonggi", district: "화성시", cat: "intel", catName: "지적 탐구", 
            title: "화성시 작가 초청 북토크: 글쓰기 철학", date: "2026-04-18",
            loc: "동탄 복합문화센터 도서관", url: "https://www.hscitylib.or.kr/",
            img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=500"
        },
        { 
            province: "gwangju", district: "북구", cat: "culture", catName: "문화/전시", 
            title: "광주 비엔날레 특별전시 가이드 투어", date: "2026-04-18",
            loc: "광주 비엔날레 전시관", url: "https://www.gwangjubiennale.org/",
            img: "https://images.unsplash.com/photo-1518998053574-53ee753cf68b?w=500"
        },
        { 
            province: "daegu", district: "중구", cat: "active", catName: "액티비티", 
            title: "대구 김광석거리 야간 골목 투어", date: "2026-04-18",
            loc: "대구 중구 대봉동", url: "https://www.jung.daegu.kr/tour/",
            img: "https://images.unsplash.com/photo-1605330364669-0797204439df?w=500"
        }
    ];

    // 지역 선택 시 세부 지역 로드
    function loadDistricts() {
        const prov = document.getElementById('province').value;
        const distSelect = document.getElementById('district');
        distSelect.innerHTML = '<option value="">세부 구/시 선택</option>';

        if(prov && areaMap[prov]) {
            areaMap[prov].forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.innerText = d;
                distSelect.appendChild(opt);
            });
        }
    }

    // 검색 실행
    function startSearch() {
        const cat = document.getElementById('category').value;
        const date = document.getElementById('searchDate').value;
        const prov = document.getElementById('province').value;
        const dist = document.getElementById('district').value;

        if(!date || !prov || !dist) {
            alert("날짜와 지역(시/도, 구/시)을 모두 골라주세요!");
            return;
        }

        document.getElementById('results').style.display = 'none';
        document.getElementById('radar').style.display = 'block';

        setTimeout(() => {
            document.getElementById('radar').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            renderResults(cat, date, prov, dist);
        }, 1800);
    }

    function renderResults(cat, date, prov, dist) {
        const grid = document.getElementById('resultGrid');
        grid.innerHTML = '';

        const filtered = db.filter(item => {
            return (cat === 'all' || item.cat === cat) &&
                   (item.date === date) &&
                   (item.province === prov) &&
                   (item.district === dist);
        });

        if(filtered.length === 0) {
            grid.innerHTML = `
                <div style="grid-column: 1 / -1; padding: 100px 0; text-align: center; color: #94a3b8;">
                    <p style="font-size: 1.2rem;">해당 조건에 맞는 프로그램이 아직 없습니다.</p>
                    <p>테스트를 위해 날짜를 <b>2026-04-18</b>로 설정하고 검색해 보세요!</p>
                </div>
            `;
            return;
        }

        filtered.forEach(item => {
            const card = `
                <div class="activity-card">
                    <img src="${item.img}" class="card-image" alt="활동 이미지">
                    <div class="card-body">
                        <span class="badge bg-${item.cat}">${item.catName}</span>
                        <h3 class="title">${item.title}</h3>
                        <div class="info-item">📍 ${item.district} | ${item.loc}</div>
                        <div class="info-item">📅 ${item.date}</div>
                        <a href="${item.url}" target="_blank" class="link-button">공식 페이지로 이동하여 신청하기</a>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });
    }

    // 초기 설정: 오늘 날짜로 세팅
    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('searchDate').value = today;
    };
</script>

</body>
</html>
