<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOT TWIST | 공공 & 로컬 액티비티 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4338ca; /* 고급스러운 인디고 */
            --secondary: #10b981; /* 공공 데이터 신뢰감을 주는 그린 */
            --accent: #f43f5e;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text-main); margin: 0; padding: 0;
        }

        .container { max-width: 1280px; margin: 0 auto; padding: 60px 24px; }

        /* 프리미엄 헤더 */
        header { margin-bottom: 50px; text-align: center; }
        header h1 { font-size: 3.2rem; font-weight: 900; letter-spacing: -2px; margin: 0; color: var(--primary); }
        header p { color: var(--text-sub); font-size: 1.15rem; margin-top: 12px; font-weight: 500; }

        /* 고도화된 검색 대시보드 */
        .dashboard {
            background: var(--surface); border: 1px solid #e2e8f0; border-radius: 24px;
            padding: 35px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;
            margin-bottom: 60px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.85rem; font-weight: 800; color: #475569; }
        
        select, input {
            padding: 15px; border: 1px solid #cbd5e1; border-radius: 12px;
            font-size: 1rem; font-family: inherit; outline: none; background: #f8fafc; transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px rgba(67, 56, 202, 0.1); }

        .btn-search {
            grid-column: 1 / -1; background: var(--text-main); color: #ffffff;
            border: none; padding: 18px; border-radius: 14px; font-weight: 800;
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-search:hover { background: var(--primary); transform: translateY(-2px); }

        /* 결과 리스트 (공공 연동형 카드) */
        .results-header { margin-bottom: 25px; font-size: 1.5rem; font-weight: 900; border-left: 6px solid var(--secondary); padding-left: 15px; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }
        
        .card {
            background: var(--surface); border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
            transition: all 0.3s ease; display: flex; flex-direction: column; text-decoration: none; color: inherit;
        }
        .card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); border-color: var(--primary); }

        .card-img { width: 100%; height: 200px; background-size: cover; background-position: center; background-color: #e2e8f0; }
        
        .card-content { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; position: relative; }
        
        /* 출처 뱃지 (공공기관 강조) */
        .source-badge {
            position: absolute; top: -15px; right: 20px; background: var(--secondary); color: white;
            padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tags { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tag { font-size: 0.75rem; font-weight: 800; padding: 5px 12px; border-radius: 8px; }
        .tag-art { background: #fef3c7; color: #92400e; }
        .tag-music { background: #fee2e2; color: #991b1b; }
        .tag-active { background: #dcfce7; color: #166534; }
        .tag-study { background: #e0e7ff; color: #3730a3; }
        .tag-popup { background: #fae8ff; color: #86198f; }
        .tag-local { background: #ffedd5; color: #c2410c; }
        .tag-mind { background: #f3e8ff; color: #6b21a8; }

        .title { font-size: 1.35rem; font-weight: 800; margin: 0 0 12px 0; line-height: 1.4; color: var(--text-main); }
        .info { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        
        .btn-go {
            margin-top: 25px; text-align: center; background: #f1f5f9; color: var(--text-main);
            padding: 14px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; transition: 0.2s; border: 1px solid #e2e8f0;
        }
        .card:hover .btn-go { background: var(--primary); color: #ffffff; border-color: var(--primary); }

        /* 빈 화면 상태 */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: white; border-radius: 20px; border: 2px dashed #cbd5e1; }
        .empty-state h3 { font-size: 1.5rem; color: var(--text-main); margin-bottom: 10px; }
        .empty-state p { color: var(--text-sub); font-size: 1rem; line-height: 1.6; }

        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PLOT TWIST</h1>
        <p>전국 지자체 및 공공/민간 인프라를 연결하여 당신의 시간을 기획합니다.</p>
    </header>

    <div class="dashboard">
        <div class="input-group">
            <label>어떤 성향의 활동인가요?</label>
            <select id="category">
                <option value="all">전체보기 (All)</option>
                <option value="art">🎨 예술/전시</option>
                <option value="music">🎵 음악/공연</option>
                <option value="active">🏃 체육/난타/야외활동</option>
                <option value="study">📚 강연/인문학/글쓰기</option>
                <option value="mind">🧘 심리/명상/자아탐구</option>
                <option value="popup">✨ 팝업스토어/전시</option>
                <option value="local">🎪 지역 축제/플리마켓</option>
            </select>
        </div>
        <div class="input-group">
            <label>검색 날짜</label>
            <input type="date" id="date">
        </div>
        <div class="input-group">
            <label>시/도 (전국 통합)</label>
            <select id="province" onchange="loadDistricts()">
                <option value="">시/도 선택</option>
                <option value="서울">서울특별시</option>
                <option value="경기">경기도</option>
                <option value="인천">인천광역시</option>
                <option value="부산">부산광역시</option>
                <option value="대구">대구광역시</option>
                <option value="광주">광주광역시</option>
                <option value="대전">대전광역시</option>
                <option value="울산">울산광역시</option>
                <option value="세종">세종특별자치시</option>
                <option value="강원">강원특별자치도</option>
                <option value="충북">충청북도</option>
                <option value="충남">충청남도</option>
                <option value="전북">전북특별자치도</option>
                <option value="전남">전라남도</option>
                <option value="경북">경상북도</option>
                <option value="경남">경상남도</option>
                <option value="제주">제주특별자치도</option>
            </select>
        </div>
        <div class="input-group">
            <label>세부 구/시/군</label>
            <select id="district"><option value="">지역을 먼저 선택하세요</option></select>
        </div>
        <button class="btn-search" onclick="runSearch()">공공 & 로컬 데이터 매칭</button>
    </div>

    <h2 id="resHeader" class="results-header">탐색 결과</h2>
    <div class="grid" id="grid">
        <div class="empty-state">
            <h3>데이터베이스 연결 대기 중...</h3>
            <p>공공데이터포털(API), 각 지자체 문화재단, 시립도서관의 리얼 링크가 탑재되어 있습니다.<br>
            날짜를 <b>2026-04-19</b>로 설정하고, <b>서울, 경기, 광주, 부산</b> 등을 검색하여 연동 퀄리티를 확인하세요.</p>
        </div>
    </div>
</div>

<script>
    // 전국 행정구역 데이터
    const areaMap = {
        "서울": ["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
        "경기": ["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","동두천시","안산시","고양시","과천시","구리시","남양주시","오산시","시흥시","군포시","의왕시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","양주시","포천시","여주시","연천군","가평군","양평군"],
        "인천": ["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
        "부산": ["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","강서구","연제구","수영구","사상구","기장군"],
        "대구": ["중구","동구","서구","남구","북구","수성구","달서구","달성군","군위군"],
        "광주": ["동구","서구","남구","북구","광산구"],

        "강원": ["춘천시","원주시","강릉시","동해시","태백시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],
        "충북": ["청주시","충주시","제천시","보은군","옥천군","영동군","증평군","진천군","괴산군","음성군","단양군"],
        "충남": ["천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시","금산군","부여군","서천군","청양군","홍성군","예산군","태안군"],
        "전북": ["전주시","군산시","익산시","정읍시","남원시","김제시","완주군","진안군","무주군","장수군","임실군","순창군","고창군","부안군"],
        "전남": ["목포시","여수시","순천시","나주시","광양시","담양군","곡성군","구례군","고흥군","보성군","화순군","장흥군","강진군","해남군","영암군","무안군","함평군","영광군","장성군","완도군","진도군","신안군"],
        "경북": ["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","군위군","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"],
        "경남": ["창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시","의령군","함안군","창녕군","고성군","남해군","하동군","산청군","함양군","거창군","합천군"],
        "제주": ["제주시","서귀포시"]
    };

    // 고도화된 공공 및 로컬 데이터베이스 (카테고리 세분화 + 공공 출처 명시)
    const db = [
        { prov: "경기", dist: "화성시", cat: "study", catName: "강연/글쓰기", source: "화성시립도서관", title: "수필과 에세이: 내 삶을 글로 남기기", date: "2026-04-19", loc: "동탄복합문화센터 도서관", url: "https://www.hscitylib.or.kr/", img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=800" },
        { prov: "경기", dist: "화성시", cat: "active", catName: "체육/난타", source: "화성시문화재단", title: "시민 전통 연희 아카데미 (난타 클래스)", date: "2026-04-19", loc: "화성시문화재단 예술연습장", url: "https://www.hcf.or.kr/", img: "https://images.unsplash.com/photo-1519683109079-d5f539e1542f?w=800" },
        { prov: "서울", dist: "종로구", cat: "art", catName: "예술/전시", source: "서울시립미술관", title: "SeMA 특별전: 현대미술의 지평", date: "2026-04-19", loc: "서울시립미술관 서소문본관", url: "https://sema.seoul.go.kr/", img: "https://images.unsplash.com/photo-1554188248-986adbb73be4?w=800" },
        { prov: "서울", dist: "성동구", cat: "popup", catName: "팝업스토어", source: "공간와디즈", title: "로컬 크리에이터 연합 마켓 & 팝업", date: "2026-04-19", loc: "성수동 공간와디즈", url: "https://gongganwadiz.com/", img: "https://images.unsplash.com/photo-1536924940846-227afb31e2a5?w=800" },
        { prov: "경기", dist: "수원시", cat: "mind", catName: "심리/자아탐구", source: "경기도평생교육진흥원", title: "교류분석(TA)으로 알아보는 내 안의 자아", date: "2026-04-19", loc: "수원 경기평생학습관", url: "https://www.gill.or.kr/", img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=800" },
        { prov: "서울", dist: "노원구", cat: "music", catName: "음악/공연", source: "노원문화재단", title: "노원문화예술회관 정기 클래식 연주회", date: "2026-04-19", loc: "노원문화예술회관 대공연장", url: "https://www.nowonarts.kr/", img: "https://images.unsplash.com/photo-1520529611472-d9622ff5466d?w=800" },
        { prov: "부산", dist: "해운대구", cat: "local", catName: "지역 축제", source: "해운대구청", title: "해운대 모래축제 연계 야간 미디어아트", date: "2026-04-19", loc: "해운대 해수욕장 백사장", url: "https://www.haeundae.go.kr/", img: "https://images.unsplash.com/photo-1514525253344-f814d074d08a?w=800" },
        { prov: "광주", dist: "동구", cat: "art", catName: "예술/전시", source: "국립아시아문화전당", title: "ACC 기획전: 아시아의 텍스트와 서사", date: "2026-04-19", loc: "국립아시아문화전당(ACC) 문화창조원", url: "https://www.acc.go.kr/", img: "https://images.unsplash.com/photo-1518998053574-53ee753cf68b?w=800" },
        { prov: "대구", dist: "수성구", cat: "study", catName: "강연/인문학", source: "대구시립도서관", title: "미래 사회와 철학: 우리는 어떻게 살 것인가", date: "2026-04-19", loc: "수성도서관 시청각실", url: "https://library.daegu.go.kr/", img: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800" }
    ];

    // 행정구역 드롭다운 로드
    function loadDistricts() {
        const prov = document.getElementById('province').value;
        const distSelect = document.getElementById('district');
        distSelect.innerHTML = '<option value="">전체/선택</option>';
        if(prov && areaMap[prov]) {
            areaMap[prov].forEach(d => {
                distSelect.innerHTML += `<option value="${d}">${d}</option>`;
            });
        }
    }

    // 검색 필터링 로직
    function runSearch() {
        const cat = document.getElementById('category').value;
        const date = document.getElementById('date').value;
        const prov = document.getElementById('province').value;
        const dist = document.getElementById('district').value;
        const grid = document.getElementById('grid');
        const header = document.getElementById('resHeader');

        if(!date || !prov) {
            alert("원하시는 날짜와 시/도 지역을 반드시 선택해주세요.");
            return;
        }

        grid.innerHTML = '';
        header.style.display = 'block';

        const filtered = db.filter(item => 
            (cat === 'all' || item.cat === cat) && 
            item.date === date && 
            item.prov === prov && 
            (dist === '' || item.dist === dist)
        );

        if(filtered.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>해당 조건에 부합하는 공공/민간 프로그램이 없습니다.</h3>
                    <p>조건을 넓혀서 검색해보시거나, 날짜를 확인해주세요.<br>
                    테스트 권장 데이터: <b>2026-04-19 / 경기 화성시, 서울 종로구/성동구, 광주 동구</b></p>
                </div>
            `;
            return;
        }

        filtered.forEach(item => {
            grid.innerHTML += `
                <a href="${item.url}" target="_blank" class="card">
                    <div class="card-img" style="background-image: url('${item.img}')"></div>
                    <div class="card-content">
                        <div class="source-badge">🏛️ ${item.source} 연동</div>
                        <div class="tags">
                            <span class="tag tag-${item.cat}">${item.catName}</span>
                        </div>
                        <h3 class="title">${item.title}</h3>
                        <div class="info">📍 ${item.prov} ${item.dist} | ${item.loc}</div>
                        <div class="info">📅 ${item.date}</div>
                        <div class="btn-go">상세 정보 및 공공 예약 사이트로 이동 〉</div>
                    </div>
                </a>
            `;
        });
    }

    // 초기값 세팅
    window.onload = () => {
        document.getElementById('date').value = "2026-04-19";
    };
</script>

</body>
</html>
