<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Note | 나의 결핍 큐레이션</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-gradient: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            --primary: #2c3e50;
            --accent: #5f27cd;
        }
        body {
            font-family: 'Pretendard', sans-serif; background: var(--bg-gradient); color: var(--primary);
            min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px; width: 100%; text-align: center;
        }
        h1 { margin-top: 0; font-size: 24px; color: var(--primary); }
        p.subtitle { color: #666; font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
        
        textarea {
            width: 100%; height: 150px; padding: 15px; border-radius: 12px; border: 1px solid #ddd;
            font-family: inherit; font-size: 15px; resize: none; box-sizing: border-box; margin-bottom: 20px;
            background: #fafafa; transition: 0.3s;
        }
        textarea:focus { outline: none; border-color: var(--accent); background: #fff; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 15px; width: 100%;
            border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: var(--accent); }

        /* 결과창 숨김 처리 */
        #result-box { display: none; margin-top: 30px; text-align: left; animation: fadeIn 0.5s ease; }
        .result-tag { display: inline-block; background: #eee; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 10px; color: var(--accent); }
        .result-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .cure-box { background: #fff; padding: 15px; border-radius: 10px; border-left: 4px solid var(--accent); margin-bottom: 10px; font-size: 15px; line-height: 1.5;}
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="input-screen">
            <h1>Blank Note 📝</h1>
            <p class="subtitle">오늘 하루, 어떤 감정들이 당신을 스쳐 지나갔나요?<br>편하게 적어주시면 빈 공간을 채울 콘텐츠를 찾아드릴게요.</p>
            <textarea id="diaryInput" placeholder="예: 오늘 진짜 너무 바쁘고 피곤해서 다 던져버리고 싶었어..."></textarea>
            <button class="btn" onclick="analyzeText()">내 마음 분석하고 처방받기</button>
        </div>

        <div id="result-box">
            <span class="result-tag" id="res-tag">#감정분석완료</span>
            <div class="result-title" id="res-title">분석 결과 타이틀</div>
            <div class="cure-box" id="res-music"><strong>🎧 추천 음악:</strong><br>내용</div>
            <div class="cure-box" id="res-activity"><strong>☕ 추천 활동:</strong><br>내용</div>
            <button class="btn" style="margin-top: 20px; background: #95a5a6;" onclick="location.reload()">새로운 일기 쓰기</button>
        </div>
    </div>

    <script>
        // 여기가 바로 마케팅의 핵심, "텍스트 마이닝 매칭 사전" 입니다!
        const emotionDictionary = {
            exhaustion: {
                keywords: ['지친다', '피곤', '번아웃', '힘들', '쉬고', '무기력', '졸려', '에너지'],
                tag: "#에너지결핍",
                title: "배터리가 15% 남은 상태입니다.",
                music: "백예린 - 'Rest' 또는 잔잔한 피아노 인디 음악",
                activity: "방 불을 끄고 따뜻한 캐모마일 차를 마시며 스마트폰을 30분만 멀리해 보세요."
            },
            stress: {
                keywords: ['짜증', '화나', '답답', '스트레스', '우울', '최악', '짜증나', '던져'],
                tag: "#환기결핍",
                title: "마음속 환풍기를 틀어야 할 시간입니다.",
                music: "데이식스(DAY6) - '한 페이지가 될 수 있게' 같이 템포가 빠른 밴드 음악",
                activity: "가까운 코인노래방에 가서 신나는 노래를 3곡 연속으로 부르거나, 시원한 탄산수를 마셔보세요."
            },
            peace: {
                keywords: ['좋았어', '행복', '뿌듯', '다행', '완벽', '즐거웠', '감사', '맛있'],
                tag: "#긍정충만",
                title: "마음의 곳간이 가득 찬 하루네요!",
                music: "검정치마 - 'Everything' 또는 기분 좋은 어쿠스틱 팝",
                activity: "오늘 느꼈던 좋은 감정을 짧게라도 다이어리에 손글씨로 남겨보세요. 이 감정이 더 오래갈 거예요."
            }
        };

        // 분석 로직 (함수)
        function analyzeText() {
            const text = document.getElementById('diaryInput').value;
            
            if(text.trim() === '') {
                alert("일기를 조금이라도 적어주세요!");
                return;
            }

            // 점수판 초기화 (가변수 카운팅과 같습니다)
            let scores = { exhaustion: 0, stress: 0, peace: 0 };

            // 1. 사용자가 쓴 글을 단어 단위로 쪼개기보다는, 글 전체에 키워드가 포함되어 있는지 검사합니다.
            for (const category in emotionDictionary) {
                const keywords = emotionDictionary[category].keywords;
                keywords.forEach(word => {
                    // 텍스트에 해당 키워드가 포함되어 있다면 점수 +1
                    if (text.includes(word)) {
                        scores[category]++;
                    }
                });
            }

            // 2. 가장 점수가 높은 감정 카테고리를 찾습니다.
            let maxCategory = 'peace'; // 기본값 (아무 키워드도 안 걸렸을 때)
            let maxScore = 0;

            for (const category in scores) {
                if (scores[category] > maxScore) {
                    maxScore = scores[category];
                    maxCategory = category;
                }
            }

            // 3. 화면 업데이트 (프론트엔드의 묘미!)
            const resultData = emotionDictionary[maxCategory];
            
            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';

            document.getElementById('res-tag').innerText = resultData.tag;
            document.getElementById('res-title').innerText = resultData.title;
            document.getElementById('res-music').innerHTML = `<strong>🎧 맞춤 처방 음악:</strong><br>${resultData.music}`;
            document.getElementById('res-activity').innerHTML = `<strong>☕ 맞춤 추천 활동:</strong><br>${resultData.activity}`;
        }
    </script>
    
</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Note | 마음 기록 대시보드</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary: #2d3436;
            --accent: #6c5ce7;
            --text-muted: #636e72;
        }
        body {
            font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--primary);
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .dashboard {
            display: grid; grid-template-columns: 350px 1fr; gap: 20px;
            width: 95%; max-width: 1000px; height: 700px;
        }
        .panel {
            background: var(--card-bg); border-radius: 24px; padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid #eee; overflow-y: auto;
        }

        /* 캘린더 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s; position: relative;
        }
        .day:hover { background: #eee; }
        .day.today { border: 2px solid var(--accent); font-weight: bold; }
        .day .emoji { font-size: 16px; margin-top: 2px; }
        .day.selected { background: var(--accent); color: white; }

        /* 작성 및 분석 영역 */
        .editor-section h2 { margin-top: 0; font-size: 20px; }
        .date-display { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }
        textarea {
            width: 100%; height: 180px; border: 1px solid #ddd; border-radius: 15px;
            padding: 15px; font-family: inherit; font-size: 15px; resize: none; box-sizing: border-box;
            background: #fdfdfd; margin-bottom: 15px;
        }
        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%;
        }

        /* 조언가 답글 스타일 */
        .coach-box {
            margin-top: 25px; padding: 20px; background: #fff; border-radius: 15px;
            border-left: 5px solid var(--accent); display: none; animation: fadeIn 0.5s ease;
        }
        .coach-name { font-weight: 800; color: var(--accent); margin-bottom: 8px; font-size: 14px; }
        .coach-text { font-size: 14px; line-height: 1.6; color: #444; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="panel">
            <div class="calendar-header">
                <strong id="monthDisplay">2026년 4월</strong>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                </div>
            <div style="margin-top: 30px; font-size: 12px; color: #999;">
                * 날짜를 클릭해 그날의 마음을 기록하세요.
            </div>
        </div>

        <div class="panel">
            <div class="editor-section">
                <div class="date-display" id="selectedDateText">날짜를 선택해 주세요.</div>
                <h2 id="editorTitle">오늘의 마음 기록</h2>
                <textarea id="diaryInput" placeholder="이곳에 당신의 이야기를 들려주세요..."></textarea>
                <button class="btn" onclick="saveDiary()">기록하고 바이브 분석하기</button>

                <div class="coach-box" id="coachBox">
                    <div class="coach-name">✨ 바이브 코치 '블랭키'의 처방</div>
                    <div class="coach-text" id="coachText">
                        당신의 글 속에서 어떤 결핍과 에너지가 느껴지는지 분석 중입니다...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedDate = new Date().toISOString().split('T')[0];
        let diaryData = JSON.parse(localStorage.getItem('blank_note_data')) || {};

        const emotionMap = {
            exhaustion: { emoji: '🔋', keywords: ['지친', '피곤', '힘들', '번아웃', '졸려'], comment: "많이 지친 하루였군요. 지금 당신에겐 성취보다 '쉼'이라는 상류가 필요합니다. 따뜻한 차 한 잔과 함께 좋아하는 노래를 들어보는 건 어떨까요?" },
            stress: { emoji: '🌋', keywords: ['짜증', '화나', '답답', '스트레스', '최악'], comment: "마음속에 뜨거운 열기가 가득하네요. 이 감정을 억누르기보다 신나는 음악으로 발산해 보세요. 시원한 탄산수 한 잔이 도움이 될 거예요." },
            peace: { emoji: '🌿', keywords: ['좋았', '행복', '뿌듯', '다행', '즐거'], comment: "평온하고 단단한 자아가 느껴지는 글입니다. 오늘 느낀 이 감정의 농도를 잘 기억해 두세요. 당신만의 멋진 길을 잘 거슬러 오르고 있습니다." },
            default: { emoji: '📝', keywords: [], comment: "소중한 기록 감사합니다. 당신의 문장들이 모여 건강한 마음의 나침반이 될 거예요. 내일도 당신의 이야기를 들려주세요." }
        };

        function init() {
            renderCalendar();
            selectDate(selectedDate);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const now = new Date();
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

            for (let i = 1; i <= lastDay; i++) {
                const dateStr = `2026-04-${String(i).padStart(2, '0')}`;
                const dayEl = document.createElement('div');
                dayEl.className = `day ${dateStr === selectedDate ? 'selected' : ''}`;
                dayEl.innerHTML = `<div>${i}</div>`;
                
                if (diaryData[dateStr]) {
                    const emo = document.createElement('div');
                    emo.className = 'emoji';
                    emo.innerText = diaryData[dateStr].emoji;
                    dayEl.appendChild(emo);
                }
                
                dayEl.onclick = () => selectDate(dateStr);
                grid.appendChild(dayEl);
            }
        }

        function selectDate(date) {
            selectedDate = date;
            document.getElementById('selectedDateText').innerText = `${date} 의 기록`;
            document.getElementById('diaryInput').value = diaryData[date] ? diaryData[date].content : '';
            
            if (diaryData[date]) {
                showCoach(diaryData[date].comment);
            } else {
                document.getElementById('coachBox').style.display = 'none';
            }
            renderCalendar();
        }

        function saveDiary() {
            const content = document.getElementById('diaryInput').value;
            if (!content) return alert("내용을 입력해 주세요.");

            let detected = 'default';
            for (const key in emotionMap) {
                if (emotionMap[key].keywords.some(k => content.includes(k))) {
                    detected = key;
                    break;
                }
            }

            diaryData[selectedDate] = {
                content: content,
                emoji: emotionMap[detected].emoji,
                comment: emotionMap[detected].comment
            };

            localStorage.setItem('blank_note_data', JSON.stringify(diaryData));
            showCoach(emotionMap[detected].comment);
            renderCalendar();
        }

        function showCoach(text) {
            const box = document.getElementById('coachBox');
            const textEl = document.getElementById('coachText');
            box.style.display = 'block';
            textEl.innerText = text;
        }

        init();
    </script>
</body>
</html>
