<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Note | 마음 기록 대시보드</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary: #2d3436;
            --accent: #6c5ce7;
            --text-muted: #636e72;
        }
        body {
            font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--primary);
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .dashboard {
            display: grid; grid-template-columns: 350px 1fr; gap: 20px;
            width: 95%; max-width: 1000px; height: 700px;
        }
        .panel {
            background: var(--card-bg); border-radius: 24px; padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid #eee; overflow-y: auto;
        }

        /* 캘린더 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s; position: relative;
        }
        .day:hover { background: #eee; }
        .day.today { border: 2px solid var(--accent); font-weight: bold; }
        .day .emoji { font-size: 16px; margin-top: 2px; }
        .day.selected { background: var(--accent); color: white; }

        /* 작성 및 분석 영역 */
        .editor-section h2 { margin-top: 0; font-size: 20px; }
        .date-display { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }
        textarea {
            width: 100%; height: 180px; border: 1px solid #ddd; border-radius: 15px;
            padding: 15px; font-family: inherit; font-size: 15px; resize: none; box-sizing: border-box;
            background: #fdfdfd; margin-bottom: 15px;
        }
        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%;
        }

        /* 조언가 답글 스타일 */
        .coach-box {
            margin-top: 25px; padding: 20px; background: #fff; border-radius: 15px;
            border-left: 5px solid var(--accent); display: none; animation: fadeIn 0.5s ease;
        }
        .coach-name { font-weight: 800; color: var(--accent); margin-bottom: 8px; font-size: 14px; }
        .coach-text { font-size: 14px; line-height: 1.6; color: #444; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="panel">
            <div class="calendar-header">
                <strong id="monthDisplay">2026년 4월</strong>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                </div>
            <div style="margin-top: 30px; font-size: 12px; color: #999;">
                * 날짜를 클릭해 그날의 마음을 기록하세요.
            </div>
        </div>

        <div class="panel">
            <div class="editor-section">
                <div class="date-display" id="selectedDateText">날짜를 선택해 주세요.</div>
                <h2 id="editorTitle">오늘의 마음 기록</h2>
                <textarea id="diaryInput" placeholder="이곳에 당신의 이야기를 들려주세요..."></textarea>
                <button class="btn" onclick="saveDiary()">기록하고 바이브 분석하기</button>

                <div class="coach-box" id="coachBox">
                    <div class="coach-name">✨ 바이브 코치 '블랭키'의 처방</div>
                    <div class="coach-text" id="coachText">
                        당신의 글 속에서 어떤 결핍과 에너지가 느껴지는지 분석 중입니다...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedDate = new Date().toISOString().split('T')[0];
        let diaryData = JSON.parse(localStorage.getItem('blank_note_data')) || {};

        const emotionMap = {
            exhaustion: { emoji: '🔋', keywords: ['지친', '피곤', '힘들', '번아웃', '졸려'], comment: "많이 지친 하루였군요. 지금 당신에겐 성취보다 '쉼'이라는 상류가 필요합니다. 따뜻한 차 한 잔과 함께 좋아하는 노래를 들어보는 건 어떨까요?" },
            stress: { emoji: '🌋', keywords: ['짜증', '화나', '답답', '스트레스', '최악'], comment: "마음속에 뜨거운 열기가 가득하네요. 이 감정을 억누르기보다 신나는 음악으로 발산해 보세요. 시원한 탄산수 한 잔이 도움이 될 거예요." },
            peace: { emoji: '🌿', keywords: ['좋았', '행복', '뿌듯', '다행', '즐거'], comment: "평온하고 단단한 자아가 느껴지는 글입니다. 오늘 느낀 이 감정의 농도를 잘 기억해 두세요. 당신만의 멋진 길을 잘 거슬러 오르고 있습니다." },
            default: { emoji: '📝', keywords: [], comment: "소중한 기록 감사합니다. 당신의 문장들이 모여 건강한 마음의 나침반이 될 거예요. 내일도 당신의 이야기를 들려주세요." }
        };

        function init() {
            renderCalendar();
            selectDate(selectedDate);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const now = new Date();
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

            for (let i = 1; i <= lastDay; i++) {
                const dateStr = `2026-04-${String(i).padStart(2, '0')}`;
                const dayEl = document.createElement('div');
                dayEl.className = `day ${dateStr === selectedDate ? 'selected' : ''}`;
                dayEl.innerHTML = `<div>${i}</div>`;
                
                if (diaryData[dateStr]) {
                    const emo = document.createElement('div');
                    emo.className = 'emoji';
                    emo.innerText = diaryData[dateStr].emoji;
                    dayEl.appendChild(emo);
                }
                
                dayEl.onclick = () => selectDate(dateStr);
                grid.appendChild(dayEl);
            }
        }

        function selectDate(date) {
            selectedDate = date;
            document.getElementById('selectedDateText').innerText = `${date} 의 기록`;
            document.getElementById('diaryInput').value = diaryData[date] ? diaryData[date].content : '';
            
            if (diaryData[date]) {
                showCoach(diaryData[date].comment);
            } else {
                document.getElementById('coachBox').style.display = 'none';
            }
            renderCalendar();
        }

        function saveDiary() {
            const content = document.getElementById('diaryInput').value;
            if (!content) return alert("내용을 입력해 주세요.");

            let detected = 'default';
            for (const key in emotionMap) {
                if (emotionMap[key].keywords.some(k => content.includes(k))) {
                    detected = key;
                    break;
                }
            }

            diaryData[selectedDate] = {
                content: content,
                emoji: emotionMap[detected].emoji,
                comment: emotionMap[detected].comment
            };

            localStorage.setItem('blank_note_data', JSON.stringify(diaryData));
            showCoach(emotionMap[detected].comment);
            renderCalendar();
        }

        function showCoach(text) {
            const box = document.getElementById('coachBox');
            const textEl = document.getElementById('coachText');
            box.style.display = 'block';
            textEl.innerText = text;
        }

        init();
    </script>
</body>
</html>
