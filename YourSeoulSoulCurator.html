<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The mirror of the s(e)oul</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Noto Sans KR', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background-color: var(--bg-color); color: var(--text-color); min-height: 250vh; overflow-x: hidden; font-family: var(--font-sans); scroll-behavior: smooth; }

        /* --- 1. Intro Section --- */
        .intro-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 50; background-color: var(--bg-color); transition: opacity 0.4s ease;
        }
        .intro-section::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_1ccf77.jpg'); background-size: cover; background-position: center;
            opacity: 0.15; z-index: -1; pointer-events: none;
        }
        .eye-image {
            width: 100%; height: 25vh; background-image: url('image_fe4efa.jpg'); 
            background-size: cover; background-position: center; filter: grayscale(100%); 
        }
        .center-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .main-title { font-family: var(--font-serif); font-size: clamp(3rem, 7vw, 7rem); font-weight: 400; text-transform: uppercase; line-height: 1.1; margin: 20px 0; }
        .main-title span { font-style: italic; color: #aaaaaa; }
        .sub-text { font-size: 0.9rem; letter-spacing: 0.1em; color: #cccccc; text-transform: uppercase; }
        .scroll-indicator { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 25; }
        .scroll-indicator .arrow { width: 1px; height: 30px; background: #fff; margin: 10px auto 0; animation: slideDown 1.5s infinite; }
        @keyframes slideDown { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(15px); opacity: 0; } }

        /* --- 2. Action Section --- */
        .action-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: 40; opacity: 0; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            pointer-events: none; transition: opacity 0.4s ease;
        }
        .btn-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .action-btn {
            display: inline-block; font-family: var(--font-serif); font-size: 1.5rem; color: #ffffff; text-decoration: none; padding: 20px 60px;
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50px; cursor: pointer; background: transparent; transition: 0.4s;
        }
        .action-btn:hover { background: #fff; color: #000; }

        /* --- 3. Transition Screen --- */
        .transition-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: #000; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); overflow: hidden; }
        .star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
        .pulsing-text { font-family: var(--font-serif); font-size: 2.5rem; font-style: italic; color: #fff; text-shadow: 0 0 20px #fff; animation: glow 2s infinite; text-align: center; }
        @keyframes glow { 0%, 100% { opacity: 0.5; text-shadow: 0 0 10px #fff; } 50% { opacity: 1; text-shadow: 0 0 40px #fff; } }

        /* --- 4. Container Shared Styles --- */
        .survey-container, .result-container, .places-container, .archive-final-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: var(--bg-color); z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: flex-start; padding: 60px 20px; overflow-y: auto;
        }
        .active { display: flex !important; }

        /* --- Survey & Results --- */
        #soulArtCanvas { width: 300px; height: 300px; margin-bottom: 20px; filter: blur(15px); animation: rotateArt 25s linear infinite; }
        @keyframes rotateArt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .progress-bar { position: absolute; top: 0; left: 0; height: 4px; background-color: #ffffff; width: 0%; transition: width 0.3s ease; }
        .question-box { margin-top: 10vh; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .question-text { font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 40px; text-align: center; word-break: keep-all; max-width: 800px; line-height: 1.4; }
        .options-wrapper { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; }
        .option-btn { background: #111; border: 1px solid #333; color: #fff; padding: 18px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .option-btn:hover { border-color: #fff; background: #222; }

        .axis-container { width: 100%; max-width: 500px; background: #111; padding: 25px; border-radius: 15px; margin: 30px 0; }
        .axis-row { margin-bottom: 15px; }
        .axis-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        .axis-line { position: relative; width: 100%; height: 2px; background: #333; }
        .axis-dot { position: absolute; top: -4px; width: 10px; height: 10px; background: #fff; border-radius: 50%; transition: left 1s ease; box-shadow: 0 0 10px #fff; }

        /* --- 5. Filter UI --- */
        .filter-wrapper {
            width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; 
            background: rgba(20, 20, 20, 0.8); padding: 25px; border-radius: 15px; border: 1px solid #333; margin-bottom: 40px; z-index: 10;
        }
        .filter-row { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .filter-label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; font-weight: bold; width: 80px; text-align: right; }
        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; flex-grow: 1; }
        .filter-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 8px 18px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .filter-btn.active { border-color: #fff; color: #fff; background: rgba(255,255,255,0.15); }
        .filter-btn:hover:not(.active) { border-color: #888; color: #fff; }

        /* --- 6. Places Grid --- */
        .places-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; z-index: 10; padding-bottom: 100px; }
        .place-card {
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 15px; padding: 30px;
            text-decoration: none; color: #fff; transition: 0.4s; display: flex; flex-direction: column;
        }
        .place-card:hover { border-color: #fff; transform: translateY(-8px); background: #111; }
        .tag-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .category-tag { font-size: 0.65rem; color: #ccc; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid #555; padding: 3px 8px; border-radius: 4px; }
        .region-tag { font-size: 0.65rem; color: #aaa; background: #222; padding: 4px 8px; border-radius: 4px; }
        .naver-link-btn { font-size: 0.8rem; color: #888; margin-top: 20px; text-decoration: underline; transition: 0.3s; }
        .place-card:hover .naver-link-btn { color: #fff; }

        /* --- 7. Map Animation & Background --- */
        .map-transition-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: url('https://images.unsplash.com/photo-1524311583145-d5593bd2602a?q=80&w=2000&auto=format&fit=crop') center/cover;
            filter: grayscale(100%) contrast(120%) brightness(0.3); z-index: 150; display: none; align-items: center; justify-content: center;
        }
        .map-dot { position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 12px #fff; animation: blink 1s forwards; }
        @keyframes blink { 0% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0.8; transform: scale(1); } }
        .places-bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; object-fit: cover; z-index: -1; opacity: 0.2; filter: grayscale(100%) brightness(0.4);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 90%); mask-image: linear-gradient(to bottom, black 0%, transparent 90%);
        }

        /* --- 8. Final Archive --- */
        .archive-box { width: 100%; max-width: 700px; background: #0a0a0a; border: 1px solid #222; padding: 40px; border-radius: 20px; margin-top: 10vh; }
        .archive-input { width: 100%; height: 200px; background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; font-family: var(--font-sans); font-size: 1.1rem; resize: none; margin-top: 25px; outline: none; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- 1. Intro -->
    <div class="intro-section" id="introSection">
        <div class="eye-image eye-top"></div>
        <div class="center-content">
            <p class="sub-text">Analyzing one's soul, connecting to Seoul.</p>
            <h1 class="main-title">The mirror of<br>the s<span>(e)</span>oul</h1>
            <p class="sub-text">Take in the soul of Seoul.</p>
        </div>
        <div class="eye-image eye-bottom"></div>
        <div class="scroll-indicator" id="scrollIndicator"><span>Scroll Down</span><div class="arrow"></div></div>
    </div>

    <!-- 2. Action -->
    <div class="action-section" id="actionSection">
        <div class="btn-wrapper">
            <p style="color:#666; margin-bottom:15px; font-size:0.9rem; letter-spacing: 0.1em;">당신의 공간 성향을 찾아보세요</p>
            <button id="startSurveyBtn" class="action-btn">mirroring my soul</button>
        </div>
    </div>

    <!-- 3. Survey -->
    <div class="survey-container" id="surveyContainer">
        <div class="progress-bar" id="progressBar"></div>
        <div class="question-box">
            <h2 class="question-text" id="questionText">Loading...</h2>
            <div class="options-wrapper" id="optionsWrapper"></div>
        </div>
    </div>

    <!-- 4. Transition -->
    <div class="transition-screen" id="transitionScreen">
        <div class="stars" id="starsContainer"></div>
        <h1 class="pulsing-text">&lt;&lt; Your Seoul Soul Archetype &gt;&gt;</h1>
    </div>

    <!-- 5. Results -->
    <div class="result-container" id="resultContainer">
        <canvas id="soulArtCanvas" width="400" height="400"></canvas>
        <div id="archetypeResult" style="text-align:center;"></div>
        <div class="axis-container" id="axisContainer"></div>
        <button class="option-btn" id="goSearchingBtn" style="background:#fff; color:#000; font-weight:bold;">Searching my Seoul 하러가기</button>
    </div>

    <!-- 6. Map Animation -->
    <div class="map-transition-screen" id="mapTransitionScreen">
        <h1 class="main-title" style="font-size:2rem; z-index:10; letter-spacing: 0.1em;">Plotting Coordinates...</h1>
    </div>

    <!-- 7. Places & Interactive Filters -->
    <div class="places-container" id="placesContainer">
        <img src="https://images.unsplash.com/photo-1524311583145-d5593bd2602a?q=80&w=2000&auto=format&fit=crop" class="places-bg-image">
        
        <!-- [추가된 부분] 성향 결과를 반영한 서브타이틀 -->
        <p id="dynamicArchiveSubtitle" style="font-size: 0.9rem; color: #aaa; letter-spacing: 0.05em; margin-bottom: 5px; font-style: italic;"></p>
        <h1 class="main-title" style="font-size: 2.5rem; margin-bottom: 25px;">Your Seoul Archive</h1>
        
        <div class="filter-wrapper">
            <div class="filter-row">
                <span class="filter-label">Region</span>
                <div class="filter-buttons" id="regionFilters">
                    <button class="filter-btn active" data-region="all">ALL</button>
                    <button class="filter-btn" data-region="north">북부</button>
                    <button class="filter-btn" data-region="south">남부</button>
                    <button class="filter-btn" data-region="east">동부</button>
                    <button class="filter-btn" data-region="west">서부</button>
                </div>
            </div>
            <div class="filter-row">
                <span class="filter-label">Category</span>
                <div class="filter-buttons" id="categoryFilters">
                    <button class="filter-btn active" data-category="all">ALL</button>
                    <button class="filter-btn" data-category="cafe">CAFE (카페)</button>
                    <button class="filter-btn" data-category="shop">SHOP (쇼핑)</button>
                    <button class="filter-btn" data-category="bar">BAR (바)</button>
                    <button class="filter-btn" data-category="stay">STAY (숙소)</button>
                    <button class="filter-btn" data-category="study">STUDY (책방/서재)</button>
                    <button class="filter-btn" data-category="design">DESIGN (전시/체험)</button>
                </div>
            </div>
        </div>

        <div class="places-grid" id="placesGrid"></div>
        <button class="option-btn" id="goArchiveBtn" style="margin-top:60px; background: transparent; border-color: #444;">다음: 오늘을 기록하기</button>
    </div>

    <!-- 8. Archive Final -->
    <div class="archive-final-container" id="archiveFinalContainer">
        <div class="archive-box">
            <h1 class="main-title" style="font-size: 1.8rem; margin-bottom: 10px;">Archive Note</h1>
            <p style="color:#555; font-size:0.85rem;">거울에 비친 당신의 마음과 서울의 조각을 기록하세요.</p>
            <textarea class="archive-input" placeholder="이 공간들이 당신의 내면과 어떻게 닮아있나요?"></textarea>
            <button class="option-btn" style="margin-top:35px; background: #fff; color: #000; font-weight:bold;" onclick="location.reload()">Finish & Close</button>
        </div>
    </div>

            if(ratio > 0.8) { document.getElementById('actionSection').style.pointerEvents = 'auto'; document.getElementById('introSection').style.pointerEvents = 'none'; }
            else { document.getElementById('actionSection').style.pointerEvents = 'none'; document.getElementById('introSection').style.pointerEvents = 'auto'; }

        // Stars
        function createStars() {
            const container = document.getElementById('starsContainer'); container.innerHTML = '';
            for(let i=0; i<80; i++) {
                const star = document.createElement('div'); star.className = 'star';
                star.style.left = Math.random()*100 + '%'; star.style.top = Math.random()*100 + '%';
                const s = Math.random()*2+1+'px'; star.style.width = s; star.style.height = s;
                star.style.setProperty('--duration', Math.random()*3+2+'s'); container.appendChild(star);
            }
        }

            document.body.style.overflow = 'hidden';

        function showQuestion() {
            if(currentQ >= questions.length) { finalize(); return; }
            document.getElementById('progressBar').style.width = `${(currentQ / questions.length) * 100}%`;
            document.getElementById('questionText').innerText = `Q${currentQ+1}. ${questions[currentQ].q}`;
            const wrapper = document.getElementById('optionsWrapper'); wrapper.innerHTML = '';
            questions[currentQ].options.forEach((opt, i) => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
                btn.onclick = () => { answers.push(i); currentQ++; showQuestion(); }; wrapper.appendChild(btn);
            });
        }

        function showResults() {
            const total = answers.reduce((a,b)=>a+b, 0);

            const axisData = [
                { name: "Energy", left: "내향", right: "외향", val: (answers[0]+answers[1]+answers[11]) * 10 },

            ];
            let axisHtml = '';
            axisData.forEach(ax => {
                let p = Math.min(Math.max(ax.val, 5), 95);
                axisHtml += `<div class="axis-row"><div class="axis-labels"><span>${ax.left}</span><span>${ax.name}</span><span>${ax.right}</span></div><div class="axis-line"><div class="axis-dot" style="left:${p}%"></div></div></div>`;
            });
            document.getElementById('axisContainer').innerHTML = axisHtml;
            drawArt(axisData);
            document.getElementById('resultContainer').classList.add('active');
        }

        function drawArt(axes) {
            const canvas = document.getElementById('soulArtCanvas'); const ctx = canvas.getContext('2d');
            const color = axes[0].val < 50 ? 'rgba(100,150,255,0.7)' : 'rgba(255,100,50,0.7)';
            ctx.clearRect(0,0,400,400); ctx.shadowBlur = 50; ctx.shadowColor = color; ctx.fillStyle = color;
            ctx.beginPath();
            for(let i=0; i<6; i++) {
                let ang = (i/6)*Math.PI*2; let r = 80 + (axes[1].val/2);
                ctx.lineTo(200 + Math.cos(ang)*r*(0.8+Math.random()*0.4), 200 + Math.sin(ang)*r*(0.8+Math.random()*0.4));
            }
            ctx.fill();
        }

                        <span class="category-tag">${p.category.toUpperCase()}</span>
                        <span class="region-tag">${regionKR}</span>
                    </div>
                    <h2 class="main-title" style="font-size:1.6rem; margin:0;">${p.title}</h2>
                    <p style="margin-top:15px; font-size:0.9rem; color:#ccc; line-height:1.6; flex-grow:1;">${p.desc}</p>
                    <span class="naver-link-btn">네이버 지도 보러가기 &rarr;</span>
                `;
                grid.appendChild(card);
            });
        }

        document.querySelectorAll('#regionFilters .filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#regionFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); currentRegion = btn.dataset.region; renderPlaces();
            };
        });

        document.querySelectorAll('#categoryFilters .filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#categoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); currentCategory = btn.dataset.category; renderPlaces();
            };
        });

        // ==========================================
        // 4. Archive Final Section
        // ==========================================
        document.getElementById('goArchiveBtn').onclick = () => {
            document.getElementById('placesContainer').classList.remove('active');
            document.getElementById('archiveFinalContainer').classList.add('active');
        };
    </script>
</body>
</html>
