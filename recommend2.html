<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOT TWIST | 전국구 액티비티 & 지식 큐레이션</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; /* 신뢰감을 주는 블루 */
            --accent: #f97316;  /* 액티비티를 상징하는 오렌지 */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg-body);
            color: var(--text-dark); line-height: 1.6;
        }

        .navbar { background: #fff; padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .navbar h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; color: var(--primary); margin: 0; }
        .navbar h1 span { color: var(--accent); }

        .container { max-width: 1300px; margin: 0 auto; padding: 40px 24px; }

        /* 프리미엄 검색 대시보드 */
        .search-engine {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
            padding: 30px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;
            margin-bottom: 50px;
        }

        .input-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .input-wrapper label { font-size: 0.85rem; font-weight: 800; color: #475569; }
        
        select, input[type="date"] {
            background: #f1f5f9; border: 1px solid transparent; color: var(--text-dark);
            padding: 16px; border-radius: 12px; font-size: 1rem; font-family: inherit;
            outline: none; transition: 0.2s; cursor: pointer;
        }
        select:focus, input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn-search {
            grid-column: 1 / -1; background: var(--text-dark); color: #fff;
            border: none; padding: 18px; border-radius: 12px; font-weight: 800;
            font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-search:hover { background: var(--primary); transform: translateY(-2px); }

        /* 카테고리 필터 칩 */
        .chip-container { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .chip {
            padding: 10px 20px; border-radius: 100px; background: #fff; border: 1px solid var(--border);
            font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; color: var(--text-muted);
        }
        .chip:hover { border-color: var(--text-dark); color: var(--text-dark); }
        .chip.active { background: var(--text-dark); color: #fff; border-color: var(--text-dark); }

        /* 결과 안내 */
        .result-stats { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: none; }
        .result-stats span { color: var(--primary); }

        /* 카드 그리드 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        .card {
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);
            overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; text-decoration: none; color: inherit;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1); border-color: #cbd5e1; }

        .card-img { width: 100%; height: 200px; object-fit: cover; background: #e2e8f0; border-bottom: 1px solid var(--border); }
        .card-body { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        
        /* 뱃지 스타일링 */
        .badge { font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; }
        .badge.lecture { background: #dbeafe; color: #1e40af; } /* 지식/특강 */
        .badge.activity { background: #ffedd5; color: #c2410c; } /* 액티비티 */
        .badge.popup { background: #f3e8ff; color: #6b21a8; } /* 팝업/전시 */
        .badge.local { background: #dcfce7; color: #166534; } /* 로컬행사 */

        .source { font-size: 0.75rem; font-weight: 700; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
        
        .title { font-size: 1.25rem; font-weight: 800; line-height: 1.4; margin-bottom: 15px; word-break: keep-all; }
        
        .info-row { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; }
        
        .btn-link {
            margin-top: 20px; padding: 14px; background: #f8fafc; border: 1px solid var(--border);
            border-radius: 10px; text-align: center; font-weight: 700; font-size: 0.9rem; transition: 0.2s;
        }
        .card:hover .btn-link { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* 데이터 없음 */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: #fff; border-radius: 16px; border: 1px dashed #cbd5e1; }
        .empty-state h3 { font-size: 1.3rem; margin-bottom: 10px; }
        .empty-state p { color: var(--text-muted); }

        @media (max-width: 768px) { .search-engine { grid-template-columns: 1fr; } }
    </style>
</head>

    // 행정구역 드롭다운 연동
    function loadDistricts() {
        const prov = document.getElementById('provInput').value;
        const dist = document.getElementById('distInput');
        dist.innerHTML = '<option value="">전체 구/시/군</option>';
        if(prov && koreaMap[prov]) {
            koreaMap[prov].forEach(d => dist.innerHTML += `<option value="${d}">${d}</option>`);
        }
    }

    // 카테고리 칩 UI 제어
    function setCategory(cat, element) {
        currentCategory = cat;
        document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        searchData(); // 카테고리 변경 시 즉시 재검색
    }

    // 메인 탐색 로직
    function searchData() {
        const date = document.getElementById('dateInput').value;
        const prov = document.getElementById('provInput').value;
        const dist = document.getElementById('distInput').value;
        
        const grid = document.getElementById('grid');
        const stats = document.getElementById('resultStats');

        grid.innerHTML = '';
        stats.style.display = 'block';

        // 필터링 적용
        let filtered = database.filter(item => {
            const dateMatch = !date || item.date === date;
            const provMatch = !prov || item.prov === prov;
            const distMatch = !dist || item.dist === dist;
            const catMatch = currentCategory === 'all' || item.cat === currentCategory;
            
            return dateMatch && provMatch && distMatch && catMatch;
        });

        stats.innerHTML = `탐색 결과 <span>${filtered.length}</span>건`;

        // 결과 렌더링
        if(filtered.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>해당 조건에 등록된 큐레이션 정보가 없습니다.</h3>
                    <p>지역이나 카테고리 조건을 넓혀보세요.<br>
                    (테스트 추천: 전남 목포시, 강원 양양군, 대구 북구, 충남 천안시)</p>
                </div>`;
            return;
        }

        filtered.forEach(item => {
            grid.innerHTML += `
                <a href="${item.url}" target="_blank" class="card">
                    <div class="card-img" style="background-image: url('${item.img}')"></div>
                    <div class="card-body">
                        <div class="card-header">
                            <span class="badge ${item.cat}">${item.catName}</span>
                            <span class="source">🔗 ${item.source} 연동</span>
                        </div>
                        <h3 class="title">${item.title}</h3>
                        <div class="info-row">📍 ${item.prov} ${item.dist} | ${item.loc}</div>
                        <div class="info-row">📅 ${item.date}</div>
                        <div class="btn-link">상세 정보 및 예약 페이지로 이동 〉</div>
                    </div>
                </a>
            `;
        });
    }

    // 초기 실행
    window.onload = () => {
        document.getElementById('dateInput').value = "2026-04-18";
        searchData();
    };
</script>
