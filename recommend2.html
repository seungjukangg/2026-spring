<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOT TWIST | 프리미엄 라이프 큐레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* 하이엔드 다크 모드 디자인 */
        :root {
            --bg-base: #050505;
            --bg-surface: #121212;
            --primary: #ffffff;
            --accent: #d9f99d; /* 네온 라임 그린 */
            --accent-glow: rgba(217, 249, 157, 0.4);
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(18, 18, 18, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg-base);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, rgba(255,255,255,0.05) 0%, transparent 50%);
            min-height: 100vh;
        }

        /* 네비게이션 */
        .navbar { 
            padding: 30px 50px; display: flex; align-items: center; 
            position: sticky; top: 0; z-index: 100; 
            background: var(--glass); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
        }
        .navbar h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: var(--primary); }
        .navbar h1 span { color: var(--accent); }

        .container { max-width: 1400px; margin: 0 auto; padding: 60px 40px; }

        .hero { margin-bottom: 80px; }
        .hero h2 { font-size: 4.5rem; font-weight: 900; line-height: 1.1; letter-spacing: -2px; margin-bottom: 20px; text-transform: uppercase; }
        .hero p { font-size: 1.25rem; color: var(--text-sub); font-weight: 300; max-width: 650px; }

        /* 글래스모피즘 검색 엔진 */
        .search-engine {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 24px;
            padding: 30px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;
            margin-bottom: 50px; backdrop-filter: blur(20px);
        }

        .input-wrapper { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-width: 200px; }
        .input-wrapper label { font-size: 0.75rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }
        
        select, input[type="date"] {
            background: var(--bg-surface); border: 1px solid var(--border); color: var(--primary);
            padding: 18px 20px; border-radius: 14px; font-size: 1rem; outline: none; transition: 0.3s;
            appearance: none; cursor: pointer; font-family: inherit;
        }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

        .btn-search {
            background: var(--primary); color: var(--bg-base); border: none; padding: 18px 40px;
            border-radius: 14px; font-weight: 900; font-size: 1rem; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px; height: 56px;
        }
        .btn-search:hover { background: var(--accent); transform: scale(1.02); }

        /* 동적 카테고리 칩 */
        .category-section { margin-bottom: 60px; }
        
        .main-chips { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .chip {
            padding: 14px 24px; border-radius: 100px; background: transparent; border: 1px solid var(--border);
            font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--text-sub); display: flex; align-items: center; gap: 8px;
        }
        .chip:hover { border-color: var(--primary); color: var(--primary); }
        .chip.active { background: var(--primary); color: var(--bg-base); border-color: var(--primary); font-weight: 800; }

        .sub-chips { 
            display: flex; gap: 10px; flex-wrap: wrap; padding: 20px; 
            background: rgba(255,255,255,0.02); border-radius: 16px; border: 1px dashed var(--border);
            display: none; animation: slideDown 0.4s ease forwards;
        }
        .sub-chips.show { display: flex; }
        .sub-chip {
            padding: 8px 18px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border);
            font-size: 0.85rem; color: var(--text-sub); cursor: pointer; transition: 0.2s; font-weight: 500;
        }
        .sub-chip:hover { color: var(--accent); border-color: var(--accent); }
        .sub-chip.active { background: var(--accent); color: var(--bg-base); border-color: var(--accent); font-weight: 800; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* 결과 그리드 및 카드 */
        .result-stats { font-size: 1.5rem; font-weight: 300; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .result-stats span { font-weight: 900; color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 40px; }

        .card {
            background: var(--bg-surface); border: 1px solid var(--border); border-radius: 24px;
            overflow: hidden; transition: 0.5s ease; display: flex; flex-direction: column; text-decoration: none; color: inherit;
            position: relative;
        }
        .card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .card-img { width: 100%; height: 240px; background-size: cover; background-position: center; border-bottom: 1px solid var(--border); filter: grayscale(20%); transition: 0.5s; }
        .card:hover .card-img { filter: grayscale(0%); }

        .card-body { padding: 30px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .meta-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .badge { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
        .source { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
        .source::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }

        .title { font-size: 1.35rem; font-weight: 800; line-height: 1.35; margin-bottom: 15px; word-break: keep-all; }
        .info-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-sub); margin-bottom: 8px; font-weight: 300; }
        
        .btn-link {
            margin-top: 30px; padding: 16px; background: transparent; border: 1px solid var(--border);
            border-radius: 12px; text-align: center; font-weight: 700; font-size: 0.95rem; transition: 0.3s;
        }
        .card:hover .btn-link { background: var(--primary); color: var(--bg-base); border-color: var(--primary); }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 100px 20px; border: 1px dashed var(--border); border-radius: 24px; }
        .empty-state h3 { font-size: 1.8rem; margin-bottom: 15px; font-weight: 800; }
        .empty-state p { color: var(--text-sub); font-size: 1.1rem; }

        @media (max-width: 768px) {
            .hero h2 { font-size: 3rem; }
            .search-engine { flex-direction: column; align-items: stretch; }
            .btn-search { width: 100%; height: auto; padding: 18px; }
        }
    </style>
</head>

    function loadDistricts() {
        const prov = document.getElementById('provInput').value;
        const dist = document.getElementById('distInput');
        dist.innerHTML = '<option value="">시/구를 먼저 선택하세요</option>';
        if(prov && koreaMap[prov]) {
            koreaMap[prov].forEach(d => dist.innerHTML += `<option value="${d}">${d}</option>`);
        }
    }

    function setMainCat(cat) {
        currentMainCat = cat;
        currentSubCat = 'all'; 
        
        document.querySelectorAll('#mainChips .chip').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');

        const subContainer = document.getElementById('subChipsContainer');
        if (cat === 'all') {
            subContainer.classList.remove('show');
        } else {
            subContainer.classList.add('show');
            subContainer.innerHTML = `<div class="sub-chip active" onclick="setSubCat('all', this)">전체보기</div>`;
            subCatsData[cat].forEach(sub => {
                subContainer.innerHTML += `<div class="sub-chip" onclick="setSubCat('${sub}', this)">${sub}</div>`;
            });
        }
        searchData();
    }

    function setSubCat(sub, element) {
        currentSubCat = sub;
        document.querySelectorAll('.sub-chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        searchData();
    }

    function searchData() {
        const date = document.getElementById('dateInput').value;
        const prov = document.getElementById('provInput').value;
        const dist = document.getElementById('distInput').value;
        
        const grid = document.getElementById('grid');
        const stats = document.getElementById('resultStats');

        grid.innerHTML = '';
        
        let filtered = database.filter(item => {
            const dateMatch = !date || item.date === date;
            const provMatch = !prov || item.prov === prov;
            const distMatch = !dist || item.dist === dist;
            const mainCatMatch = currentMainCat === 'all' || item.cat === currentMainCat;
            const subCatMatch = currentSubCat === 'all' || item.subCat === currentSubCat;
            
            return dateMatch && provMatch && distMatch && mainCatMatch && subCatMatch;
        });

        stats.innerHTML = `Curated Results: <span>${filtered.length}</span>`;

        if(filtered.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>We couldn't find any scenes matching your criteria.</h3>
                    <p>조건을 넓혀서 전국 단위로 검색하시거나 다른 카테고리를 탐색해 보세요.</p>
                </div>`;
            return;
        }

        filtered.forEach(item => {
            grid.innerHTML += `
                <a href="${item.url}" target="_blank" class="card">
                    <div class="card-img" style="background-image: url('${item.img}')"></div>
                    <div class="card-body">
                        <div class="meta-top">
                            <span class="badge">${item.subCat}</span>
                            <span class="source">${item.source} 연동</span>
                        </div>
                        <h3 class="title">${item.title}</h3>
                        <div class="info-row">📍 ${item.prov} ${item.dist} | ${item.loc}</div>
                        <div class="info-row">📅 ${item.date}</div>
                        <div class="btn-link">상세 정보 및 예약 페이지 이동 〉</div>
                    </div>
                </a>
            `;
        });
    }

    window.onload = () => {
        document.getElementById('dateInput').value = "2026-04-18";
        searchData();
    };
</script>

</body>
</html>
