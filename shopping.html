<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find The Original | AI 정밀 가격 비교</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --secondary: #10b981; --warning: #f59e0b;
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b;
        }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;
        }

        .container { max-width: 1000px; width: 100%; padding: 60px 20px; box-sizing: border-box; }

        header { text-align: center; margin-bottom: 50px; }
        header h1 { font-size: 2.8rem; margin: 0; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        header p { color: #64748b; font-size: 1.1rem; margin-top: 10px; }

        /* 입력 폼 섹션 */
        .search-card {
            background: var(--card); border-radius: 24px; padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 40px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px;
        }

        .upload-area {
            border: 2px dashed #cbd5e1; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; height: 300px; position: relative; overflow: hidden;
        }
        .upload-area:hover { border-color: var(--primary); background: #f5f3ff; }
        #preview { width: 100%; height: 100%; object-fit: cover; display: none; }

        .form-area { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        label { font-weight: 600; font-size: 0.9rem; color: #475569; }
        input, select {
            padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: 1rem; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); ring: 2px var(--primary); }

        .analyze-btn {
            background: var(--primary); color: white; border: none; padding: 16px;
            border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1.1rem;
            margin-top: 10px; transition: 0.3s;
        }
        .analyze-btn:hover { background: #4338ca; transform: translateY(-2px); }

        /* 결과 섹션 */
        .loading { display: none; text-align: center; padding: 50px; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .result-area { display: none; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-header { background: #fef3c7; color: #92400e; padding: 15px 25px; border-radius: 12px; margin-bottom: 30px; font-weight: 600; }

        .comparison-table { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        .product-row {
            background: white; border-radius: 16px; padding: 25px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border-left: 6px solid #e2e8f0;
        }
        .product-row.best { border-left-color: var(--secondary); background: #f0fdf4; }
        .product-info h3 { margin: 0; font-size: 1.2rem; }
        .product-info p { margin: 5px 0 0; color: #64748b; font-size: 0.9rem; }
        .price-info { text-align: right; margin-right: 30px; }
        .price-info .amt { font-size: 1.4rem; font-weight: 800; }
        
        .link-btn {
            background: #1e293b; color: white; padding: 12px 24px; border-radius: 8px;
            text-decoration: none; font-weight: 600; transition: 0.2s;
        }
        .link-btn:hover { background: #000; }

        @media (max-width: 768px) { .search-card { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Find The Original V2</h1>
        <p>사진, 이름, 가격을 입력하면 AI가 동대문 도매 원천 상품을 추적합니다.</p>
    </header>

    <div class="search-card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <img id="preview" src="">
