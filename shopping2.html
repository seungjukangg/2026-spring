<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find The Original | 쇼핑 호갱 탈출기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --point-color: #ff4757; /* 톡톡 튀는 트렌디한 레드/핑크 */
            --box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg-gradient);
            color: #2f3542;
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .app-container {
            max-width: 600px; width: 100%;
            background: white; border-radius: 30px;
            box-shadow: var(--box-shadow); overflow: hidden;
            padding: 40px; box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; color: #2f3542; letter-spacing: -1px; }
        header h1 span { color: var(--point-color); }
        header p { color: #747d8c; margin-top: 10px; font-size: 1rem; }

        /* 1. 입력 폼 섹션 */
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-weight: 700; margin-bottom: 8px; color: #57606f; }
        
        .upload-box {
            width: 100%; height: 200px;
            background: #f1f2f6; border: 2px dashed #ced6e0; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
        }
        .upload-box:hover { border-color: var(--point-color); background: #fff0f1; }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; }
        
        input[type="text"], input[type="number"] {
            width: 100%; padding: 15px; border: 1px solid #dfe4ea; border-radius: 15px;
            font-size: 1rem; font-family: inherit; box-sizing: border-box; transition: 0.2s;
        }
        input:focus { outline: none; border-color: var(--point-color); box-shadow: 0 0 0 3px rgba(255,71,87,0.1); }

        .submit-btn {
            width: 100%; background: var(--point-color); color: white;
            border: none; padding: 18px; border-radius: 15px;
            font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255,71,87,0.3);
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,71,87,0.4); }

        /* 2. 로딩 섹션 */
        .loading-area { display: none; text-align: center; padding: 50px 0; }
        .loader {
            border: 5px solid #f1f2f6; border-top: 5px solid var(--point-color);
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 3. 결과 섹션 */
        .result-area { display: none; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-header { text-align: center; margin-bottom: 30px; padding: 15px; background: #f1f2f6; border-radius: 15px; }
        .result-header strong { color: var(--point-color); }

        .shop-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px; border-radius: 20px; border: 1px solid #dfe4ea; margin-bottom: 15px;
            transition: 0.3s; background: white;
        }
        .shop-card:hover { transform: scale(1.02); box-shadow: var(--box-shadow); }
        
        .shop-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .shop-info p { margin: 0; color: #a4b0be; font-size: 0.9rem; }
        .shop-price { font-size: 1.3rem; font-weight: 800; color: #2f3542; margin-top: 5px; }
        
        /* 각 쇼핑몰별 버튼 색상 */
        .link-btn {
            padding: 12px 20px; border-radius: 12px; text-decoration: none;
            font-weight: 700; color: white; text-align: center; font-size: 0.9rem;
        }
        .btn-ably { background: #ff477e; }
        .btn-zigzag { background: #ff007f; }
        .btn-musinsa { background: #000000; }
        .btn-temu { background: #ff6a00; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Find <span>The Original</span></h1>
            <p>같은 옷, 다른 가격? 도매 원작자를 찾아드려요!</p>
        </header>

        <div id="inputSection">
            <div class="input-group">
                <label>1. 위시리스트 사진 업로드 📸</label>
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <img id="imagePreview" src="" alt="미리보기">
                    <div id="uploadText" style="text-align: center; color: #a4b0be;">
                        <span style="font-size: 2rem;">+</span><br>클릭해서 사진 올리기
                    </div>
                    <input type="file" id="fileInput" hidden accept="image/*" onchange="previewImage(event)">
                </div>
            </div>

            <div class="input-group">
                <label>2. 상품의 이름을 적어주세요 👕</label>
                <input type="text" id="itemName" placeholder="예: 봄내음 찰랑 브이넥 니트">
            </div>

            <div class="input-group">
                <label>3. 쇼핑몰에서 본 가격은 얼마인가요? 💰</label>
                <input type="number" id="itemPrice" placeholder="예: 35000">
            </div>

            <button class="submit-btn" onclick="startAI()">AI 비교 분석하기</button>
        </div>

        <div id="loadingSection" class="loading-area">
            <div class="loader"></div>
            <h3 style="color: #57606f;">AI가 동대문 도매 DB를 뒤지는 중...</h3>
            <p style="color: #a4b0be;" id="loadingText">의류 패턴 분석 중...</p>
        </div>

        <div id="resultSection" class="result-area">
            <div class="result-header">
                💡 찾았습니다! 이 옷은 <strong>[동대문 디오트 3층]</strong>에서 도매로 납품되는 옷입니다.
            </div>

            <div id="shopList"></div>
            
            <button class="submit-btn" style="background: #a4b0be; margin-top: 20px;" onclick="location.reload()">다른 옷 다시 검색하기</button>
        </div>
    </div>

    <script>
        // 사진 미리보기 기능
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const img = document.getElementById('imagePreview');
                img.src = reader.result;
                img.style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        // 분석 시작 (로딩 애니메이션 처리)
        function startAI() {
            const name = document.getElementById('itemName').value;
            const price = parseInt(document.getElementById('itemPrice').value);
            const imgSrc = document.getElementById('imagePreview').src;

            // 입력값 확인 (사진은 없어도 넘어가게끔 느슨하게 처리)
            if(!name || !price) {
                alert("옷 이름과 가격을 정확히 입력해주세요!");
                return;
            }

            // 화면 전환 (입력 -> 로딩)
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';

            // 텍스트 바뀌는 애니메이션
            const texts = ["입력하신 텍스트/이미지 대조 중...", "지그재그, 에이블리 가격 크롤링 중...", "도매가 마진율 계산 완료!"];
            let i = 0;
            const interval = setInterval(() => {
                document.getElementById('loadingText').innerText = texts[i];
                i++;
                if(i >= texts.length) clearInterval(interval);
            }, 800);

            // 3초 후 결과 화면 띄우기
            setTimeout(() => {
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('resultSection').style.display = 'block';
                showResults(name, price);
            }, 3000);
        }

        // 결과 생성 로직
        function showResults(name, originalPrice) {
            // 내가 입력한 가격을 바탕으로 쇼핑몰별 가상 가격 세팅
            const temuPrice = Math.round(originalPrice * 0.4); // 테무 (도매가 수준)
            const ablyPrice = Math.round(originalPrice * 0.85); // 에이블리 (박리다매)
            const zigzagPrice = Math.round(originalPrice * 1.05); // 지그재그 (평균가)
            const musinsaPrice = Math.round(originalPrice * 1.3); // 무신사 (브랜드화)

            // 쇼핑몰 데이터 배열 (실제 링크 주소 포함!)
            const shops = [
                { id: 'temu', name: 'Temu (테무)', desc: '해외 직구 도매가 (배송 7일)', price: temuPrice, colorClass: 'btn-temu', url: 'https://www.temu.com/kr' },
                { id: 'ably', name: '에이블리', desc: '1020 인기 마켓 최저가', price: ablyPrice, colorClass: 'btn-ably', url: 'https://m.a-bly.com/' },
                { id: 'zigzag', name: '지그재그', desc: '입력하신 상품과 가장 유사한 마켓', price: zigzagPrice, colorClass: 'btn-zigzag', url: 'https://zigzag.kr/' },
                { id: 'musinsa', name: '무신사', desc: '자체 라벨 갈이 후 브랜드 판매', price: musinsaPrice, colorClass: 'btn-musinsa', url: 'https://www.musinsa.com/' }
            ];

            // 가격 순으로 정렬
            shops.sort((a, b) => a.price - b.price);

            const shopList = document.getElementById('shopList');
            shopList.innerHTML = '';

            // HTML에 카드 그려넣기
            shops.forEach(shop => {
                // 천 단위 콤마 찍기
                const formattedPrice = shop.price.toLocaleString() + "원";
                
                const card = document.createElement('div');
                card.className = 'shop-card';
                card.innerHTML = `
                    <div class="shop-info">
                        <h3>${shop.name}</h3>
                        <p>${shop.desc}</p>
                        <div class="shop-price">${formattedPrice}</div>
                    </div>
                    <a href="${shop.url}" target="_blank" class="link-btn ${shop.colorClass}">
                        쇼핑몰 이동
                    </a>
                `;
                shopList.appendChild(card);
            });
        }
    </script>
</body>
</html>
