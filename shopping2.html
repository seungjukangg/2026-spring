<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same Item, Best Price | 동일 상품 최저가 추적기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --main-color: #4F46E5; /* 신뢰감을 주는 블루 계열 */
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .
        header { text-align: center; margin-bottom: 40px; }
        header h1 { margin: 0; font-size: 2rem; font-weight: 800; color: var(--text-dark); }
        header p { color: var(--text-light); margin-top: 10px; font-size: 1rem; line-height: 1.5; }

        /* 입력 폼 스타일 */
        .input-section { display: flex; flex-direction: column; gap: 20px; }
        
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
        
        .upload-box {
            width: 100%; height: 220px;
            background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
        }
        .upload-box:hover { border-color: var(--main-color); background: #eef2ff; }
        .upload-box img { width: 100%; height: 100%; object-fit: contain; display: none; position: absolute; background: white; }
        
        input[type="text"], input[type="number"] {
            width: 100%; padding: 16px; border: 1px solid var(--border-color); border-radius: 12px;
            font-size: 1rem; font-family: inherit; box-sizing: border-box; background: #f8fafc;
        }
        input:focus { outline: none; border-color: var(--main-color); background: #ffffff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .submit-btn {
            background: var(--main-color); color: white; border: none;
            padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px;
        }
        .submit-btn:hover { background: #4338ca; transform: translateY(-2px); }

        /* 로딩 애니메이션 */
        .loading-sec { display: none; text-align: center; padding: 50px 0; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top: 4px solid var(--main-color);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; }
        .sub-text { font-size: 0.9rem; color: var(--text-light); }

        /* 결과 화면 (핵심) */
        .result-sec { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .notice-box {
            background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;
            padding: 16px; border-radius: 12px; margin-bottom: 30px; text-align: center;
            font-weight: 600; font-size: 0.95rem; line-height: 1.5;
        }

        .product-card {
            display: flex; flex-direction: column; padding: 24px; border-radius: 16px;
            border: 1px solid var(--border-color); margin-bottom: 16px;
            background: #ffffff; transition: 0.2s; position: relative;
        }
        .product-card:hover { border-color: #cbd5e1; box-shadow: 0 12px 24px rgba(0,0,0,0.06); }
        .product-card.lowest { border: 2px solid var(--main-color); background: #fafafa; }
        
        .card-header { display: flex; justify-content: space-between; align-

        // 분석 시작
        function startSearch() {
            const name = document.getElementById('itemName').value;
            const price = parseInt(document.getElementById('itemPrice').value);
            
            if(!name || !price) {
                alert("정확한 상품 탐색을 위해 이름과 가격을 입력해주세요.");
                return;
            }

            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';

            // 리얼리티를 살린 로딩 메시지
            const steps = [
                { main: "각 쇼핑몰 이미지 픽셀 대조 중...", sub: "유사도 99% 이상 항목 추출" },
                { main: "상세 페이지 URL(Deep Link) 확보 중...", sub: "에이블리, 지그재그 입점몰 스캔 완료" },
                { main: "최저가 정렬 및 비교 결과 생성 중...", sub: "배송비 포함 최종 혜택가 계산 완료" }
            ];
            
            let i = 0;
            const timer = setInterval(() => {
                document.getElementById('statusMain').innerText = steps[i].main;
                document.getElementById('statusSub').innerText = steps[i].sub;
                i++;
                if(i >= steps.length) clearInterval(timer);
            }, 900);

            setTimeout(() => {
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('resultSection').style.display = 'block';
                displayResults(name, price);
            }, 3000);
        }

        // 결과 리스트 생성 (실제 Deep Link 적용)
        function displayResults(inputName, inputPrice) {
            
            // 핵심 기능: 말씀하신 에이블리 딥링크 및 지그재그 가상 딥링크 하드코딩
            const exactProductData = [
                {
                    platform: "에이블리", tagClass: "tag-ably", shopName: "A 마켓 (최저가 매장)",
                    productName: inputName + " (단독 특가)",
                    price: Math.floor(inputPrice * 0.7), // 유저 입력가보다 무조건 30% 싸게 설정
                    url: "https://m.a-bly.com/goods/66868567", // 요청하신 실제 상품 페이지 1
                    match: "일치율 100%", isLowest: true
                },
                {
                    platform: "지그재그", tagClass: "tag-zigzag", shopName: "B 패션랩",
                    productName: inputName,
                    price: Math.floor(inputPrice * 0.85),
                    url: "https://zigzag.kr/catalog/products/115598150", // 지그재그 상품 상세 페이지
                    match: "일치율 99%", isLowest: false
                },
                {
                    platform: "에이블리", tagClass: "tag-ably", shopName: "C 감성부띠끄 (덤터기 매장)",
                    productName: "[무료배송] " + inputName,
                    price: inputPrice, // 유저가 본래 입력한(비싼) 가격
                    url: "https://m.a-bly.com/goods/66172201", // 요청하신 실제 상품 페이지 2
                    match: "일치율 100%", isLowest: false
                }
            ];

            // 가격 오름차순(싼 것부터) 정렬
            exactProductData.sort((a, b) => a.price - b.price);

            const listContainer = document.getElementById('productList');
            listContainer.innerHTML = '';

            exactProductData.forEach((item, index) => {
                // 최저가 항목에만 특별한 스타일 적용
                const cardClass = item.isLowest ? 'product-card lowest' : 'product-card';
                const priceClass = item.isLowest ? 'price-final highlight' : 'price-final';
                const btnClass = item.isLowest ? 'btn-link highlight-btn' : 'btn-link';
                const lowestBadge = item.isLowest ? '<div style="position:absolute; top:-12px; left:20px; background:#4F46E5; color:white; padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:800;">🔥 동일상품 최저가</div>' : '';

                // 천 단위 콤마
                const formattedPrice = item.price.toLocaleString() + "원";
                const originalPriceHtml = index > 0 ? `<div class="price-original">${inputPrice.toLocaleString()}원 (기준가)</div>` : '';

                const cardHtml = `
                    <div class="${cardClass}">
                        ${lowestBadge}
                        <div class="card-header">
                            <div>
                                <span class="platform-tag ${item.tagClass}">${item.platform}</span>
                                <span class="match-rate">${item.match}</span>
                            </div>
                        </div>
                        <h3 class="shop-title">${item.shopName}</h3>
                        <p class="product-name">${item.productName}</p>
                        
                        <div class="card-bottom">
                            <div class="price-wrap">
                                ${originalPriceHtml}
                                <div class="${priceClass}">${formattedPrice}</div>
                            </div>
                            <a href="${item.url}" target="_blank" class="${btnClass}">
                                상세 페이지로 이동 〉
                            </a>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += cardHtml;
            });
        }
    </script>
</body>
</html>
