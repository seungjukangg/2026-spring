<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find The Original | AI 동일 상품 추적기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f6f8; --point: #ff3f6c; --text-main: #1e293b; --text-sub: #64748b;
        }

        body {
            font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main);
            margin: 0; padding: 30px 15px; display: flex; flex-direction: column; align-items: center;
        }

        .container {
            max-width: 600px; width: 100%; background: white; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); padding: 35px; box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; color: #0f172a; letter-spacing: -1px; }
        header span { color: var(--point); }
        header p { color: var(--text-sub); margin-top: 8px; font-size: 0.95rem; line-height: 1.5; }

        /* 입력 폼 */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
        
        .upload-area {
            border: 2px dashed #cbd5e1; border-radius: 16px; height: 180px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; background: #f8fafc;
        }
        .upload-area:hover { border-color: var(--point); background: #fff1f2; }
        .upload-area img { width: 100%; height: 100%; object-fit: contain; display: none; position: absolute; background: white; }
        
        input[type="text"], input[type="number"] {
            width: 100%; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: 1rem; font-family: inherit; box-sizing: border-box; background: #f8fafc;
        }
        input:focus { outline: none; border-color: var(--point); background: white; }

        .btn-submit {
            width: 100%; background: var(--point); color: white; border: none; padding: 16px;
            border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-submit:hover { background: #e11d48; transform: translateY(-2px); }

        /* 분석 로딩 */
        .loading { display: none; text-align: center; padding: 40px 0; }
        .spinner {
            width: 45px; height: 45px; border: 4px solid #f1f5f9; border-top: 4px solid var(--point);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-weight: 600; color: #334155; }
        .loading-sub { color: var(--text-sub); font-size: 0.85rem; margin-top: 5px; }

        /* 결과 리스트 */
        .result-area { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .summary-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 15px; border-radius: 12px; margin-bottom: 25px; font-size: 0.95rem; font-weight: 600; text-align: center; }

        .item-card {
            display: flex; flex-direction: column; padding: 20px; border-radius: 16px;
            border: 1px solid #e2e8f0; margin-bottom: 15px; transition: 0.2s;
            background: white; position: relative; overflow: hidden;
        }
        .item-card:hover { border-color: #cbd5e1; box-shadow: 0 10px 20px rgba(0,0,0,0.04); transform: translateY(-2px); }
        .item-card.best { border-color: var(--point); background: #fffbfb; }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        
        .platform-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; color: white; margin-bottom: 8px; }
        .badge-ably { background: #ff477e; }
        .badge-zigzag { background: #ff007f; }
        
        .shop-name { font-size: 1.05rem; font-weight: 700; margin: 0 0 4px 0; }
        .acc-rate { font-size: 0.8rem; color: #0ea5e9; font-weight: 600; background: #e0f2fe; padding: 3px 8px; border-radius: 4px; }
        
        .price-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .price { font-size: 1.4rem; font-weight: 800; color: var(--text-main); }
        .price del { font-size: 0.9rem; color: #94a3b8; font-weight: 400; margin-right: 5px; }
        
        .link-btn {
            background: #0f172a; color: white; padding: 10px 20px; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 0.9rem; text-align: center;
        }
        .link-btn:hover { background: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Find <span>The Original</span></h1>
            <p>플랫폼 내 입점 쇼핑몰들의 '동일 상품 다른 가격'을<br>정확도 99%로 찾아내어 상품 페이지로 직행합니다.</p>
        </header>

        <div id="inputSec">
            <div class="form-group">
                <label>1. 옷 캡처본 업로드 📸</label>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <img id="previewImg" src="">
                    <div id="uploadTxt" style="text-align: center; color: #94a3b8;">
                        <span style="font-size: 2rem;">+</span><br>터치하여 사진 선택
                    </div>
                    <input type="file" id="fileInput" hidden accept="image/*" onchange="loadImg(event)">
                </div>
            </div>

            <div class="form-group">
                <label>2. 상품 이름 (키워드) 👕</label>
                <input type="text" id="itemName" placeholder="예: 봄내음 여리핏 가디건">
            </div>

            <div class="form-group">
                <label>3. 발견하신 가격 💰</label>
                <input type="number" id="itemPrice" placeholder="예: 32000 (숫자만 입력)">
            </div>

            <button class="btn-submit" onclick="runDeepSearch()">초정밀 딥서치 시작</button>
        </div>

        <div id="loadSec" class="loading">
            <div class="spinner"></div>
            <div class="loading-text" id="loadMain">이미지 픽셀 단위 분해 중...</div>
            <div class="loading-sub" id="loadSub">원본 도매 DB와 대조합니다</div>
        </div>

        <div id="resultSec" class="result-area">
            <div class="summary-box">
                ✔️ 도매 원형 발견! 동일 플랫폼 내에서도 가격이 다릅니다.<br>최저가 다이렉트 링크를 확인하세요.
            </div>
            
            <div id="resultList">
                </div>

            <button class="btn-submit" style="background: #e2e8f0; color: #475569; margin-top: 15px;" onclick="location.reload()">새로운 옷 검사하기</button>
        </div>
    </div>

    <script>
        function loadImg(e) {
            if(e.target.files[0]){
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('previewImg').src = event.target.result;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('uploadTxt').style.display = 'none';
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function runDeepSearch() {
            const name = document.getElementById('itemName').value;
            const price = parseInt(document.getElementById('itemPrice').value);
            if(!name || !price) { alert("정확한 매칭을 위해 이름과 가격을 입력해주세요."); return; }

            document.getElementById('inputSec').style.display = 'none';
            document.getElementById('loadSec').style.display = 'block';

            const steps = [
                {m: "에이블리, 지그재그 입점몰 스캔 중...", s: "이미지 유사도 98% 이상 필터링"},
                {m: "상품 상세페이지 다이렉트 링크 추출 중...", s: "각 쇼핑몰별 배송비, 쿠폰가 계산 완료"}
            ];
            
            let i = 0;
            const timer = setInterval(() => {
                document.getElementById('loadMain').innerText = steps[i].m;
                document.getElementById('loadSub').innerText = steps[i].s;
                i++;
                if(i >= steps.length) clearInterval(timer);
            }, 1000);

            setTimeout(() => {
                document.getElementById('loadSec').style.display = 'none';
                document.getElementById('resultSec').style.display = 'block';
                renderResults(name, price);
            }, 2500);
        }

        function renderResults(name, userPrice) {
            // 실제 유저가 보내준 에이블리 상품 링크 적용
            const linkA = "https://m.a-bly.com/goods/66172201";
            const linkB = "https://m.a-bly.com/goods/66868567";
            const linkZ = "https://zigzag.kr/catalog/products/115598150"; // 지그재그 예시 링크

            // 데이터 구조: 플랫폼 내에서도 여러 쇼핑몰이 존재
            const data = [
                { 
                    platform: "에이블리", badgeClass: "badge-ably", shop: "A마켓 (도매직영)", 
                    price: Math.floor(userPrice * 0.75), url: linkA, acc: "99.8%", isBest: true 
                },
                { 
                    platform: "에이블리", badgeClass: "badge-ably", shop: "B감성스토어", 
                    price: Math.floor(userPrice * 1.15), url: linkB, acc: "99.8%", isBest: false 
                },
                { 
                    platform: "지그재그", badgeClass: "badge-zigzag", shop: "C부띠끄 (Z결제)", 
                    price: Math.floor(userPrice * 0.95), url: linkZ, acc: "98.5%", isBest: false 
                }
            ];

            // 가격 오름차순 정렬 (가장 싼 게 위로)
            data.sort((a, b) => a.price - b.price);

            const list = document.getElementById('resultList');
            list.innerHTML = '';

            data.forEach((item, index) => {
                const isBestClass = item.isBest ? 'best' : '';
                const bestLabel = item.isBest ? '<span style="color:var(--point); font-size:0.8rem; font-weight:800; margin-bottom:5px; display:block;">🔥 동일상품 최저가 매칭</span>' : '';
                
                const card = document.createElement('div');
                card.className = `item-card ${isBestClass}`;
                card.innerHTML = `
                    ${bestLabel}
                    <div class="card-top">
                        <div>
                            <div class="platform-badge ${item.badgeClass}">${item.platform}</div>
                            <h3 class="shop-name">${item.shop}</h3>
                        </div>
                        <div class="acc-rate">AI 일치율 ${item.acc}</div>
                    </div>
                    <div class="price-row">
                        <div class="price">
                            ${index !== 0 ? `<del>${userPrice.toLocaleString()}원</del><br>` : ''}
                            ${item.price.toLocaleString()}원
                        </div>
                        <a href="${item.url}" target="_blank" class="link-btn">
                            해당 상품 바로가기 〉
                        </a>
                    </div>
                `;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
